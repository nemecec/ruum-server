# cargo-deny settings (design section 18.4: no new dependency without approval; supply-chain risk).
# Run: cargo deny check
# CI runs it on every pull request. A new license, source or banned crate needs a person's
# approval; change this file only in a pull request that says why.

[graph]
all-features = true

[advisories]
# The RustSec advisory database. Every vulnerability fails the check; unmaintained and unsound
# crates fail it too, unless they are listed in `ignore` with a reason.
db-urls = ["https://github.com/rustsec/advisory-db"]
unmaintained = "all"
unsound = "all"
yanked = "deny"
ignore = [
    # { id = "RUSTSEC-0000-0000", reason = "why it does not apply, and until when" },
]

[licenses]
# Ruum is a proprietary product. Allow only permissive licenses, which put no source-disclosure
# duty on Ruum. Copyleft licenses (GPL, AGPL, LGPL as the only choice, SSPL, EUPL) are not
# allowed. MPL-2.0 is allowed: it is file-level copyleft and applies only to changes of the MPL
# files themselves, which Ruum does not make.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]
confidence-threshold = 0.9
# Some allowed licenses are not used yet; that is fine.
unused-allowed-license = "allow"

[licenses.private]
# The Ruum crates are not published (publish = false); their license is LicenseRef-Proprietary.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = [
    # OpenSSL: Ruum uses rustls with aws-lc-rs everywhere.
    { crate = "openssl", reason = "use rustls" },
    { crate = "openssl-sys", reason = "use rustls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
