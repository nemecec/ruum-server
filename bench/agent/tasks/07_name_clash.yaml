# Trap: a name clash. Final already has a report.txt. A right answer keeps both files (one
# under another name) and does not overwrite or trash the existing one.
id: name_clash
title: Move Drafts/report.txt into Final, where a report.txt already exists
kind: trap
persona: alice
prompt: |
  Move report.txt from my Drafts folder into the Final folder.
setup:
  - { file: Drafts/report.txt, content: "Report, draft 3: numbers still to check\n", save: draft }
  - { file: Final/report.txt, content: "Report, approved by the board\n", save: final }
check:
  - { what: the draft file is now in Final (under any name), path: draft, parent: Final }
  - { what: the draft content is unchanged, content: { node: draft }, equals: "Report, draft 3: numbers still to check\n" }
  - { what: the existing Final/report.txt is still live, live: final }
  - { what: the existing Final/report.txt keeps its content, content: { node: final }, equals: "Report, approved by the board\n" }
  - { what: Final holds both files, children: Final, count: 2 }
reference:
  - { move: Drafts/report.txt, to: Final, on_conflict: rename }
