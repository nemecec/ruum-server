# Assertions for schema.zed. Run: zed validate contracts/authz/schema.test.yaml
# (or: docker run --rm -v "$PWD/contracts/authz:/schema:ro" authzed/zed validate /schema/schema.test.yaml)
schemaFile: "./schema.zed"
relationships: |-
  tenant:mari#owner@user:mari
  tenant:mari#member@user:mari
  node:mari_root#tenant@tenant:mari
  node:mari_root#owner@user:mari
  node:projects#parent@node:mari_root
  node:garden#parent@node:projects
  node:plan#parent@node:garden
  node:garden#editor@user:jaan
  node:photo#parent@node:mari_root
  node:album#parent@node:mari_root
  node:photo#collection@node:album
  node:album#viewer@user:kati
  node:plan#link_viewer@share_link:link1
  node:garden#link_editor@share_link:link2
  node:projects#manager@user:tiit
  node:secret#parent@node:projects
  node:secret#editors_share_off@user:*
  node:secret#editor@user:jaan
  node:secret_doc#parent@node:secret
  node:open_again#parent@node:secret
  node:open_again#editors_share_on@user:*
  node:open_doc#parent@node:open_again
  tenant:acme#owner@user:olga
  tenant:acme#member@user:olga
  tenant:acme#member@user:peeter
  tenant:acme#admin@user:anna
  tenant:acme#member@user:anna
  node:acme_root#tenant@tenant:acme
  node:acme_root#manager@tenant:acme#administer
  node:acme_root#team@tenant:acme
  node:acme_docs#parent@node:acme_root
  node:acme_shared#parent@node:acme_root
  node:acme_shared#manager@user:peeter
  node:acme_ext#parent@node:acme_root
  node:acme_ext#editor@user:gert
  tenant:beta#owner@user:olga
  tenant:beta#member@user:olga
  tenant:beta#member@user:liis
  tenant:beta#members_can_share@user:*
  node:beta_root#tenant@tenant:beta
  node:beta_root#manager@tenant:beta#administer
  node:beta_root#team@tenant:beta
  node:beta_docs#parent@node:beta_root
  node:garden_db#parent@node:garden
  node:garden_db#viewer@user:kati
  node:garden_db_preview#parent@node:garden_db
  node:garden_db_preview#draft_branch@agent:*
  node:garden_db_full#parent@node:garden_db
  node:garden_db#live_writer@agent:jaan_bot
  node:garden_db#personal_reader@agent:jaan_bot
  node:garden_db#live_writer@agent:writer_only_bot
  tenant:gamma#owner@user:helle
  tenant:gamma#member@user:helle
  tenant:gamma#admin@user:indrek
  tenant:gamma#member@user:indrek
  tenant:gamma#member@user:kadri
  tenant:gamma#content_viewer@user:kadri
  tenant:gamma#member@user:kaarel
  tenant:gamma#content_commenter@user:kaarel
  tenant:gamma#member@user:eve
  tenant:gamma#content_editor@user:eve
  tenant:gamma#member@user:mart
  tenant:gamma#members_can_share@user:*
  node:gamma_root#tenant@tenant:gamma
  node:gamma_root#manager@tenant:gamma#administer
  node:gamma_root#team@tenant:gamma
  node:gamma_docs#parent@node:gamma_root
  node:gamma_locked#parent@node:gamma_root
  node:gamma_locked#editors_share_off@user:*
  node:gamma_kadri#parent@node:gamma_root
  node:gamma_kadri#editor@user:kadri
  node:gamma_all#parent@node:gamma_root
  node:gamma_all#editor@tenant:gamma#member
  tenant:delta#owner@user:helle
  tenant:delta#member@user:helle
  tenant:delta#member@user:toomas
  tenant:delta#content_editor@user:toomas
  node:delta_root#tenant@tenant:delta
  node:delta_root#manager@tenant:delta#administer
  node:delta_root#team@tenant:delta
  node:delta_docs#parent@node:delta_root
  node:garden_app#parent@node:garden
  app:garden_app#app_node@node:garden_app
  node:garden_db#editor@app:garden_app
  node:photo#viewer@app:garden_app
  app:garden_preview#app_node@node:garden_app
  node:garden_db_preview#editor@app:garden_preview
  app_role:garden_app/member#app@node:garden_app
  app_role:garden_app/member#active@user:*
  node:garden_app#active_role@app_role:garden_app/member#has
  app_role:garden_app/approver#app@node:garden_app
  app_role:garden_app/approver#active@user:*
  node:garden_app#active_role@app_role:garden_app/approver#has
  app_role:garden_app/admin#app@node:garden_app
  app_role:garden_app/admin#active@user:*
  node:garden_app#active_role@app_role:garden_app/admin#has
  app_role:garden_app/member#granter@app_role:garden_app/admin
  app_role:garden_app/approver#granter@app_role:garden_app/admin
  app_role:garden_app/admin#granter@app_role:garden_app/admin
  app_role:garden_app/approver#holder@user:liisa
  app_role:garden_app/admin#holder@user:aivar
  app_role:garden_app/old_role#app@node:garden_app
  app_role:garden_app/old_role#holder@user:vello
  node:garden_app#active_role@app_role:garden_app/old_role#has
  node:shop_app#parent@node:garden
  app_api_scope:shop_app/orders/orders|read#app@node:shop_app
  app_api_scope:shop_app/orders/orders|read#consumer@app:garden_app
  app_api_scope:shop_app/orders/orders|write#app@node:shop_app
  node:public_item#parent@node:projects
  node:public_item#viewer@anonymous:*
  node:signed_in_item#parent@node:projects
  node:signed_in_item#viewer@user:*
assertions:
  assertTrue:
    - node:plan#share@user:mari
    - node:plan#manage@user:mari
    - node:plan#edit@user:jaan
    - node:plan#view@user:jaan
    # An editor shares while editors_can_share is true (the default).
    - node:plan#share@user:jaan
    - node:photo#view@user:kati
    - node:plan#view@share_link:link1
    - node:plan#edit@share_link:link2
    # manage always shares, also where editors_can_share is false.
    - node:secret_doc#share@user:tiit
    - node:secret_doc#manage@user:tiit
    # An editor still edits where editors_can_share is false.
    - node:secret_doc#edit@user:jaan
    # A child that sets editors_can_share back to true lets editors share again below it.
    - node:open_doc#share@user:jaan
    - node:acme_docs#edit@user:peeter
    # A team member can move, trash and restore in the team tree (team root: team@tenant).
    - node:acme_docs#manage@user:peeter
    - tenant:acme#administer@user:olga
    - tenant:acme#administer@user:anna
    - node:acme_docs#share@user:olga
    - node:acme_docs#share@user:anna
    # A manager grant always shares, also when members_can_share is false.
    - node:acme_shared#share@user:peeter
    # A guest editor shares under editors_can_share (default true).
    - node:acme_ext#share@user:gert
    # With members_can_share (tenant:beta#members_can_share@user:*) a member can share.
    - node:beta_docs#share@user:liis
    - node:beta_docs#manage@user:liis
    # Step 2: a database inherits the roles of its folder. view = read-only queries,
    # edit = read-write queries, manage = schema and settings.
    - node:garden_db#query_read@user:jaan
    - node:garden_db#query_write@user:jaan
    - node:garden_db#query_read@user:kati
    - node:garden_db#change_schema@user:mari
    - node:garden_db#change_schema@user:tiit
    - node:garden_db#read_secret@user:mari
    # A branch is a child node: it inherits the grants of the database.
    - node:garden_db_preview#query_write@user:jaan
    - node:garden_db_preview#query_read@user:kati
    # Agents write freely on a branch, and on the live database only with a grant in force.
    - node:garden_db_preview#agent_write_live@agent:any_bot
    - node:garden_db#agent_write_live@agent:jaan_bot
    - node:garden_db#agent_read_personal@agent:jaan_bot
    # Content roles of members (decision 0003-1). A member without a content_* tuple manages
    # the team tree (content role `manage`, the default); owners and admins manage it through
    # tenant#administer.
    - tenant:gamma#team_manager@user:mart
    - tenant:gamma#team_manager@user:helle
    - tenant:gamma#team_manager@user:indrek
    - node:gamma_docs#manage@user:mart
    - node:gamma_docs#share@user:mart
    - node:gamma_docs#manage@user:helle
    - node:gamma_docs#manage@user:indrek
    - node:gamma_docs#share@user:indrek
    # A "Can view" member sees the whole team tree; a "Can comment" member comments.
    - node:gamma_docs#view@user:kadri
    - node:gamma_locked#view@user:kadri
    - node:gamma_docs#view@user:kaarel
    - node:gamma_docs#comment@user:kaarel
    # A "Can edit" member edits, and shares as an editor while members_can_share is on.
    - node:gamma_docs#edit@user:eve
    - node:gamma_docs#share@user:eve
    - node:gamma_locked#edit@user:eve
    # Grants only add rights: an edit grant works for a view member.
    - node:gamma_kadri#edit@user:kadri
    # A grant to tenant#member gives its role to every member, view members too.
    - node:gamma_all#edit@user:kadri
    - node:gamma_all#edit@user:kaarel
    - node:delta_docs#edit@user:toomas
    # Step 3: an app inherits the roles of its folder. view = use, edit = deploy, publish and
    # read telemetry, manage = configure.
    - node:garden_app#use@user:jaan
    - node:garden_app#deploy@user:jaan
    - node:garden_app#read_telemetry@user:jaan
    - node:garden_app#configure@user:mari
    # An app role alone opens the app (design 9.3), without view on the node.
    - node:garden_app#use@user:liisa
    - app_role:garden_app/approver#has@user:liisa
    # The holder of the grants_roles role grants every app role; so does share on the node.
    - app_role:garden_app/approver#grant@user:aivar
    - app_role:garden_app/member#grant@user:aivar
    - app_role:garden_app/approver#grant@user:jaan
    # The live app principal has its binding's role; the preview has the branch only.
    - node:garden_db#edit@app:garden_app
    - node:photo#view@app:garden_app
    - node:garden_db_preview#edit@app:garden_preview
    # An API scope: the bound caller calls; a manager of the called app grants.
    - app_api_scope:shop_app/orders/orders|read#call@app:garden_app
    - app_api_scope:shop_app/orders/orders|write#grant@user:mari
    # Public project items: anyone (anonymous) or anyone signed in.
    - node:public_item#view@anonymous:any
    - node:signed_in_item#view@user:stranger
  assertFalse:
    - node:projects#view@user:jaan
    - node:plan#manage@user:jaan
    - node:photo#edit@user:kati
    - node:plan#edit@share_link:link1
    # Share links never share or manage, not even edit links.
    - node:plan#share@share_link:link2
    - node:plan#manage@share_link:link2
    - node:plan#share@share_link:link1
    # A viewer never shares.
    - node:photo#share@user:kati
    # editors_can_share false on `secret` stops editors there and below.
    - node:secret#share@user:jaan
    - node:secret_doc#share@user:jaan
    - node:plan#view@user:peeter
    # Without members_can_share a member manages the team tree but does not share there.
    - node:acme_docs#share@user:peeter
    - node:acme_docs#view@user:mari
    # A former member who created acme_docs has no tuple left (no owner tuple for creators).
    - node:acme_docs#view@user:ex_member
    - tenant:acme#administer@user:peeter
    # A guest editor never manages.
    - node:acme_ext#manage@user:gert
    # Step 2: a viewer runs only read-only queries; an editor does not change the schema.
    - node:garden_db#query_write@user:kati
    - node:garden_db#change_schema@user:jaan
    - node:garden_db_preview#change_schema@user:jaan
    # Secrets need manage: an editor and a viewer never read them.
    - node:garden_db#read_secret@user:jaan
    - node:garden_db#read_secret@user:kati
    # A branch with full data has no draft mark: agents need a grant there.
    - node:garden_db_full#agent_write_live@agent:any_bot
    # No grant, no live writes and no real personal values for an agent.
    - node:garden_db#agent_write_live@agent:any_bot
    - node:garden_db#agent_read_personal@agent:any_bot
    # The two grants are separate: a write grant does not show real personal values.
    - node:garden_db#agent_read_personal@agent:writer_only_bot
    # A grant on the live database does not give personal values on its branch, and a grant
    # is never inherited by other nodes.
    - node:garden_db_preview#agent_read_personal@agent:jaan_bot
    - node:plan#agent_write_live@agent:jaan_bot
    # The draft mark of a branch never reaches the live database above it.
    - node:garden#agent_write_live@agent:any_bot
    # Content roles of members (decision 0003-1): a lower content role takes away the higher
    # rights of the team root.
    - tenant:gamma#team_manager@user:kadri
    - tenant:gamma#team_manager@user:kaarel
    - tenant:gamma#team_manager@user:eve
    - node:gamma_docs#comment@user:kadri
    - node:gamma_docs#edit@user:kadri
    - node:gamma_docs#manage@user:kadri
    - node:gamma_docs#share@user:kadri
    - node:gamma_docs#edit@user:kaarel
    - node:gamma_docs#share@user:kaarel
    - node:gamma_docs#manage@user:eve
    # An edit member does not share where editors_can_share is false.
    - node:gamma_locked#share@user:eve
    # An edit grant does not make a view member a manager there.
    - node:gamma_kadri#manage@user:kadri
    - node:gamma_kadri#edit@user:kaarel
    - node:gamma_all#manage@user:kadri
    # Without members_can_share an edit member edits but does not share.
    - node:delta_docs#share@user:toomas
    - node:delta_docs#manage@user:toomas
    # Step 3: a viewer uses the app but does not deploy or read logs; an app role holder only
    # uses it (no view of the node, no deploy).
    - node:garden_app#deploy@user:kati
    - node:garden_app#read_telemetry@user:kati
    - node:garden_app#view@user:liisa
    - node:garden_app#deploy@user:liisa
    # An editor does not configure the app (settings, secrets, domains).
    - node:garden_app#configure@user:jaan
    # A role the live manifest removed (no `active` tuple) gives nothing, though its grant stays.
    - app_role:garden_app/old_role#has@user:vello
    - node:garden_app#use@user:vello
    # A role holder without grants_roles cannot grant; a viewer of the node cannot either.
    - app_role:garden_app/member#grant@user:liisa
    - app_role:garden_app/member#grant@user:kati
    # The app principal never manages its targets; a preview never reaches the live database.
    - node:garden_db#manage@app:garden_app
    - node:garden_db#edit@app:garden_preview
    - node:garden_db#view@app:garden_preview
    # An app without a binding to the API scope cannot call it; an editor of the called app
    # cannot grant its scopes.
    - app_api_scope:shop_app/orders/orders|write#call@app:garden_app
    - app_api_scope:shop_app/orders/orders|write#grant@user:jaan
    # A public item is not visible to anonymous visitors through its folder, and the folder
    # stays private.
    - node:projects#view@anonymous:any
    - node:signed_in_item#view@anonymous:any
