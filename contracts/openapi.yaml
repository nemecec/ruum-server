      properties:
        issue_title:
          x-ruum-content-trust: untrusted
          type: string
        status:
          $ref: '#/components/schemas/IssueStatus'
        choices:
          type: array
          items:
            type: object
            required: [field, choice]
            properties:
              field:
                type: string
              choice:
                type: string
                enum: [include, pseudonymise, remove]
        reveal_requests:
          type: array
