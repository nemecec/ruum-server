        fields:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [field, choice]
            properties:
              field:
                type: string
              choice:
                type: string
                enum: [allow, refuse]
    TemplateKind:
      type: string
      enum: [project, issue]
    Template:
      type: object
      required: [id, kind, source, name, description, version, node_id, manifest]
