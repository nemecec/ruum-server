  /v1/issues:
    get:
      tags: [issues]
      operationId: listIssues
      x-ruum-area: issues
      x-ruum-status: planned
      summary: List issues
      description: |
        Issues (typed nodes of type `issue`, design 9.7) that the caller can see, in the whole
        tenant or `within` a folder, with filters for the fields that boards sort by. Issues the
        caller cannot see are left out. Titles are untrusted text.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: within
          in: query
          description: A folder; only issues below it.
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: app_id
          in: query
          description: Only issues linked to this app.
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/IssueStatus'
        - name: source
          in: query
          schema:
            $ref: '#/components/schemas/IssueSource'
        - name: assignee
          in: query
          description: A user or agent ID.
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: sort
          in: query
          schema:
            type: string
            enum: [updated, last_seen, count, users]
            default: updated
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of issues.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuePage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [issues]
      operationId: createIssue
      x-ruum-area: issues
      x-ruum-status: planned
      summary: File an issue
      description: |
        Creates a typed node of type `issue` (provider `ruum.issue`) under `parent_id` (the
        project's `Issues/` folder by default; any folder works). Its content (`IssueContent`,
        `contracts/manifests/issue.schema.json`) is validated against the issue template's JSON
        Schema (`template_ref`, recorded in the issue). Needs `comment` on the folder (filing is
        a kind of commenting; decision 0006, open question 7). A caller with only `comment` may
        not set `assignee`, `status` or `links` (`403 permission_denied`), and filing is rate
        limited per principal. `source` is `person` for a user and `agent` for an agent;
        `monitoring` and `report` issues are made by the platform only (actor: the app). Writes
        `node.created` and `issue.created`.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIssueRequest'
      responses:
