          description: Parts that are left out by default and that the template should take.
          items:
            type: string
            enum: [issues, issue_templates, smart_folders]
        issue:
          type: object
          description: '`issue`: the fields as a JSON Schema and the form layout.'
          required: [schema]
          properties:
            schema:
              type: object
              additionalProperties: true
            layout:
              type: array
              items:
                type: object
                additionalProperties: true
    InstantiateTemplateRequest:
      type: object
      required: [parent_id, name]
      properties:
        parent_id:
          $ref: '#/components/schemas/Uuid'
        name:
          $ref: '#/components/schemas/NodeName'
        version:
          type: string
          description: A version of the template; the newest when missing.
        placeholders:
          type: object
          description: The people for each role placeholder of the template ("client" -> grantees).
          additionalProperties:
            type: array
            maxItems: 50
            items:
              $ref: '#/components/schemas/Grantee'
    TemplateSetup:
      type: object
      required: [id, template_id, template_version, project_id, state, steps, open_placeholders, created_by, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        template_id:
          type: string
        template_version:
          type: string
        project_id:
          $ref: '#/components/schemas/Uuid'
        state:
          type: string
          enum: [running, done, failed]
        steps:
          type: array
          items:
            type: object
            required: [name, kind, state, node_id, message]
            properties:
              name:
                type: string
              kind:
                type: string
                enum: [folder, file, database, app, preview, issue_template, smart_folder, grants]
              state:
                type: string
                enum: [pending, running, done, failed, skipped]
              node_id:
                oneOf:
                  - $ref: '#/components/schemas/Uuid'
                  - type: 'null'
              message:
                x-ruum-content-trust: untrusted
                type: [string, 'null']
        open_placeholders:
          type: array
          items:
            type: string
        created_by:
          $ref: '#/components/schemas/ActorPair'
        created_at:
          $ref: '#/components/schemas/Timestamp'
