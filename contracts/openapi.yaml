  /v1/databases/{node_id}/approvals/{approval_id}/decision:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/NodeId'
      - $ref: '#/components/parameters/ApprovalId'
    post:
      tags: [databases]
      operationId: decideDatabaseApproval
      x-ruum-area: access
      x-ruum-user-only: true
      summary: Approve or deny a request of an agent
      description: |
        The person sees the statement, its parameters (as markers) and the number of rows it
        touches, and approves or denies it. An approval lets the agent run exactly that
        statement with those parameters once, within 15 minutes. Who may decide: the user the
        agent acts for, or a person with `manage` on the database; in both cases the person
        needs the right that the statement needs (`edit` for data, `manage` for schema and
        migrations), else `403 permission_denied`. Users only. An approval never replaces a
        `write_live` grant: when the agent sends the statement again, every other check runs
        again. Writes `database.approval_decided`.

        A migration request (`subject: migration`) lists `planned_columns`; the person may
        confirm their classes in the same decision (`classes`, needs `manage`), so the approval
        and the classification are one step (design 8.5). The classes take effect in the same
        transaction as the approved migration; until it runs, nothing changes.

        A grant request (`subject: grant`) is decided only by the user the agent acts for, with
        the right that `createDatabaseAccessGrant` needs. Approving it makes the grant at once
        (the same rules, limits and restore point as `createDatabaseAccessGrant`; writes
        `database.grant_created`); `grant_request.grant_id` names it. The approval cannot change
        the kind or lengthen the time the agent asked for.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecideDatabaseApprovalRequest'
      responses:
        '200':
          description: The decided approval.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseApproval'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/apps:
    post:
      tags: [apps]
      operationId: createApp
      x-ruum-area: apps
      x-ruum-status: planned
      summary: Create a web app node
      description: |
        Creates a typed node of type `webapp` (provider `ruum.webapp`, design sections 7.1 and
        9.1) under `parent_id`. The new app has no deployment yet: its `status.state` is
        `provisioning` until the first deployment (`createAppDeployment`) is ready, and the
        gateway answers its address with a "not deployed yet" page. Needs `edit` on the parent,
        and room in the plan (`plan_limit_reached`: apps per tenant, section 4.3). Agents may
        create apps inside their scope with `max_role` `edit` or higher. A guest, or an agent of a
        guest, needs the tenant policy `guests_create_resources` (default false: `403
        permission_denied`, hint `guests_create_resources`), as for databases (decision 0002-2).

        `settings` are the settings that are not in the archive (`AppSettings`): who may use the
        app (`access`), the telemetry mode and the report widget. `access: public` needs the
        approval of a Ruum platform admin for the tenant (`Tenant.app_approval.public_apps`, design
        9.5 and decision 22): without it `403 permission_denied` (hint `public_apps_not_allowed`).

        Writes `node.created` (kind `typed`, type `webapp`). The address is
        `https://<app-slug>.<tenant-slug>.ruumapps.net` (`App.url`); the slugs come from the node
        name and the tenant name and never change after the first deployment. An app slug is one
        DNS label with room for the preview prefix: 2 to 53 characters, lower-case letters,
        digits and single `-` (no `--`, no `-` at either end, no `xn--` prefix), not a reserved
        slug (`docs/STEP3.md`) and not a slug that this tenant used before for another app
        (`409 conflict`, hint `slug_retired`). A clash with a name rule makes the platform pick a
        free slug from the name; the person can change it until the first deployment.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAppRequest'
      responses:
        '202':
          description: The new app node; it waits for its first deployment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppWrite'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/apps/{node_id}:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/NodeId'
    get:
      tags: [apps]
      operationId: getApp
      x-ruum-area: apps
      x-ruum-status: planned
      summary: Get a web app with its status
      description: |
        The node, the settings, the live deployment (its manifest, resolved bindings and
        roles), the open previews, the status (`provisioning`, `ready`, `updating`, `degraded`,
        `suspended`, `failed`), the address and what the caller may do (`my_permissions`). Needs
        `view`. A node that is not a web app is `404`. Secret values never appear (only names
        and states, `listAppSecrets`).
      responses:
        '200':
          description: The app.
          headers:
            ETag:
              $ref: '#/components/headers/NodeETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/App'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/apps/{node_id}/settings:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/NodeId'
    patch:
      tags: [apps]
      operationId: updateAppSettings
      x-ruum-area: apps
      x-ruum-status: planned
      summary: Change the settings of a web app
      description: |
        Changes the settings that are not in the archive: `access`, the telemetry mode (`privacy`
        or `full`, design 9.6), the raw-copy retention, the report widget (design 9.7) and the
        automatic rollback. Needs `manage`. `access: public` needs the platform admin's approval
        for the tenant (`403 permission_denied`, hint `public_apps_not_allowed`) and the tenant
        admins' choice: in a team tenant only an owner or admin makes an app public (decision 22;
        `403 permission_denied`, hint `tenant_admin_required`). Agents may not change `access`,
        may not raise `telemetry_mode` to `full` and may not raise `raw_copy_days` (`403
        user_required`): full telemetry and the raw copy are a person's choice (design 9.6). An
        agent may lower both, and may change the report widget and the automatic rollback within
        its scope. The change takes effect at the gateway within a few seconds. Writes
        `app.settings_changed`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAppSettingsRequest'
      responses:
        '200':
          description: The app with the new settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppWrite'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/apps/{node_id}/deployments:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/NodeId'
    get:
      tags: [apps]
      operationId: listAppDeployments
      x-ruum-area: apps
      x-ruum-status: planned
      summary: List the deployments of a web app
      description: |
        Previews and live deployments, newest first. Needs `view`. Each live deployment is a
        version of the app node (`version_id`); a preview has no version until it is published.
      parameters:
        - name: environment
          in: query
          schema:
            $ref: '#/components/schemas/AppEnvironment'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of deployments, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppDeploymentPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [apps]
      operationId: createAppDeployment
      x-ruum-area: apps
      x-ruum-status: planned
      summary: Deploy an archive as a preview
      description: |
        Starts a **preview** deployment of a deployment archive (design 9.1: a `.tar.gz` or
        `.zip` with `app.yaml` at its root, valid against `contracts/manifests/app.schema.json`).
        The archive comes from a file node version the caller can `view` (`source.kind: file`),
        or from a folder the caller can `view` (`source.kind: folder`): the platform packs the
        head versions of the folder's files into an archive and records the file versions it
        used, so an agent with only MCP tools deploys with `write_file` and then this call.
        Builds from a repo node come in step 4 (`source.kind: build`, not accepted yet); clients
        accept unknown source kinds in answers. Needs `edit` on the app.

        The cheap stages run **before the answer**: `unpack` (size and file count limits),
        `validate` (the manifest schema and the provider rules; a bad manifest is a direct `422`
        whose `error.details.pointer` points into `app.yaml`) and `bindings` (resolve every
        binding to a node ID and check that the deployer may give it, below; a refused binding
        is a direct `403`). The other stages run after the `202` and are reported in
        `AppDeployment.stages`, each with a machine-readable `error` when it fails: `build` and
        `test` (always `skipped` in step 3; step 4), `migrations` (on the preview's database
        branches), `image` (static files to object storage, or an OCI image for `node22`, built
        in the app sandbox with no secrets and no bindings), `start`, `check` (the health path,
        then the post-deploy browser check of design 9.6 level 1). Wait with
        `getAppDeployment?wait=30`.

        **No privilege escalation through bindings** (design 9.4): for every binding the deployer
        (for an agent: its user's right intersected with its scope) must hold the binding's role
        on the target node, and for an API binding the right to grant its scopes (`manage` on the
        called app, or an app role named in the API's `granted_by`). Else the call answers `403
        permission_denied`, hint `binding_not_allowed`, with the binding name in
        `error.details.binding`. The grant records `granted_by` = the deployer. In step 3 a file
        or folder binding is `view` (`edit` only on a database). A binding that names a node of
        another tenant fails exactly like a missing node.

        **Previews never touch live data.** A preview gets a principal of its own (the
        deployment ID). A database binding resolves to a branch of the bound database with
        `masked` data, made for the preview or reused from the same `draft` label (decision 30);
        other node bindings are capped at `view` (reads of live data, allowed because the deployer
        can read them); an API binding gets only the scopes that the called API lists in
        `preview_scopes` (the stage `bindings` warns about the scopes left out), so preview code
        never writes live data of another app; generated secrets get preview values; entered
        secrets are not given to previews unless a user with `manage` turned on `preview` for
        that secret (`setAppSecret`; stored state, never the manifest). A preview keeps the
        egress proxy limits and runs no jobs. A preview is reachable only by people with
        `open_preview` on the app (today `edit`), and by agents through the gateway, at
        `https://<deployment-short-id>--<app-slug>.<tenant-slug>.ruumapps.net`; `short_id` is 8
        characters of lower-case base32. It expires after 7 days without a request; a new preview
        with the same `draft` label supersedes the older ready one (state `superseded`).

        `publishAppDeployment` makes a preview live.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAppDeploymentRequest'
      responses:
        '202':
          description: The deployment has started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppDeployment'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/apps/{node_id}/deployments/{deployment_id}:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/NodeId'
      - $ref: '#/components/parameters/DeploymentId'
    get:
      tags: [apps]
      operationId: getAppDeployment
      x-ruum-area: apps
      x-ruum-status: planned
      summary: One deployment with its stages and check result
      description: |
        The stages, the resolved bindings, the migrations it ran, the result of the post-deploy
        check (console errors, failing requests, server errors, new issues), the source (which
        file or folder versions are deployed) and its address. Needs `view`; the check result and
        stage messages need `edit` (they can quote log lines), else they are left out. With
        `wait`, the call holds up to that many seconds until the state changes, so a client does
        not poll in a loop.
      parameters:
        - $ref: '#/components/parameters/Wait'
      responses:
        '200':
          description: The deployment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppDeployment'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/apps/{node_id}/deployments/{deployment_id}/publish:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/NodeId'
      - $ref: '#/components/parameters/DeploymentId'
    post:
      tags: [apps]
      operationId: publishAppDeployment
      x-ruum-area: apps
      x-ruum-status: planned
      summary: Make a deployment live (publish or roll back)
      description: |
        Makes the deployment the live one. For a ready preview this is **Publish**: the archive
        is deployed again as live, with the live bindings (database bindings now resolve to the
        bound databases themselves, after the deployer check of `createAppDeployment` runs again
        for the live roles), the declared migrations run on the live databases first (decision 19:
        one transaction each, a restore point first, the deployment stops and nothing changes when
        one fails), and a new version of the app node is written (encoding `app_release_v1`). For
        an older live deployment this is a **rollback** (the same as `restoreVersion` of its
        version): no migration runs; a rollback across a migration needs `force: true` and keeps
        the database as it is.

        Needs `edit` on the app; migrations on a live database also need `manage` on that
        database (as `applyDatabaseMigration`). A person publishes at once. **An agent's publish
        waits for a person** (design 11.1, decision 0006-4): the answer is `202` with a pending
        approval (`AppApprovalRequired`) that the agent's user, or a person with `manage` on the
        app, decides (`decideAppApproval`); the agent then sends the same call with `approval_id`.
        An approval is used once, within 15 minutes, only by the agent that asked, for exactly
        this deployment: its archive hash, its parsed manifest and the binding targets resolved
        at preview time. A publish that resolves anything differently fails (`409 conflict`,
        hint `approval_stale`) and asks again. An approved publish also covers the database
        migration approvals of its migrations (the D-2 rules, including `write_live` for an
        agent): the person decides once.

        Entered secrets that the manifest lists and that have no value fail the publish (`409
        conflict`, hint `secret_missing`, with the names). The new live deployment takes traffic
        when its check passes; the old one keeps running until then. **Automatic rollback**
        (design 9.6): when the server-side error rate (the gateway's `5xx` answers, the runtime's
        crashes and failed health checks; never browser events, which anyone can send) rises
        clearly within 15 minutes after a publish (the rule is in `AppSettings.auto_rollback`),
        the platform publishes the previous live deployment and writes `app.rolled_back` (reason
        `error_rate`, actor the app). Writes `version.created` and `app.deployed`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishAppDeploymentRequest'
      responses:
        '200':
          description: The deployment is going live; poll `getAppDeployment`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppDeployment'
        '202':
          description: An agent's publish waits for a person (`AppApprovalRequired`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppApprovalRequired'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/apps/{node_id}/deployments/{deployment_id}/comparison:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/NodeId'
      - $ref: '#/components/parameters/DeploymentId'
    get:
      tags: [apps]
      operationId: compareAppDeployment
      x-ruum-area: telemetry
      x-ruum-status: planned
      summary: Compare a deployment with the one before it
      description: |
        Request rate, error rate, latency (p50, p95), cold starts and memory in the window after
        this deployment against the same window before it, and the issues that are new or
        regressed since it (design 9.6, "compare before and after a deploy"). Needs `edit` (as for
        every telemetry read). Numbers only; issue titles are untrusted text.
      parameters:
        - name: window_minutes
          in: query
          schema:
            type: integer
            minimum: 5
            maximum: 1440
            default: 60
      responses:
        '200':
          description: The comparison.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppDeploymentComparison'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/apps/{node_id}/secrets:
    parameters:
