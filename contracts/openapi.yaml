      tags: [templates]
      operationId: listTemplates
      x-ruum-area: templates
      x-ruum-status: planned
      summary: List project and issue templates
      description: |
        The gallery of Ruum (built into the platform, IDs `gallery:<slug>`) and the template
        folders (folders of type `template`, design 2.7) of the tenant that the caller can see.
        Filter by `kind` and `source`.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: kind
          in: query
          schema:
            $ref: '#/components/schemas/TemplateKind'
        - name: source
          in: query
          schema:
            type: string
            enum: [gallery, tenant]
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of templates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplatePage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [templates]
      operationId: createTemplate
      x-ruum-area: templates
      x-ruum-status: planned
      summary: Save a project (or an issue kind) as a template
      description: |
        Copies `source_id` (a project folder) into a new folder of type `template` under
        `parent_id`, with a `template.yaml` (`contracts/manifests/template.schema.json`). What the
        copy takes follows the copy rules of typed nodes: databases as masked sample data (never
        `full`), apps as their live archive without secrets, sessions, agent memory, logs and
