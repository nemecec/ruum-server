openapi: 3.1.0
info:
  title: Ruum API
  version: 0.1.0
  summary: Files, versions, tags, sharing, agents and the change journal of Ruum (step 1, Core), databases (step 2), and web apps, issues and templates (step 3, draft).
  description: |
    The REST API of Ruum (`ruum.space`). Everything is a node in a tree, and one permission
    system protects all nodes. This contract covers step 1 (Core) of `docs/DESIGN.md`, section 16.

    ## Authentication
    - **Web UI**: the server runs the OIDC code flow with Zitadel (`/v1/auth/login`,
      `/v1/auth/callback`) and sets the HttpOnly cookie `ruum_session`. A cookie-authenticated
      request that changes state must also send the header `Ruum-Csrf` with the value of the
      cookie `ruum_csrf` (double submit). The value is bound to the session: a value that the
      server did not issue for this session fails with `403 permission_denied`, also when the
      header and the cookie are equal.
    - **Native clients and the CLI**: `Authorization: Bearer <token>` with a platform token.
    - **Agents, first choice (decision 3)**: OAuth 2.1. MCP clients find the authorization server
      through `/.well-known/oauth-protected-resource`, register with dynamic client registration
      (`POST /v1/oauth/register`, RFC 7591), send the user to `GET /v1/oauth/authorize` and get
      tokens from `POST /v1/oauth/token` (`authorization_code` with PKCE, then `refresh_token`).
      The user signs in (Zitadel) and approves the client in a consent screen of the web UI. The
      consent creates an agent, or binds the client to an existing agent of the user, with an
      `AgentScope`. Ruum is the authorization server for agent tokens and signs them itself;
      Zitadel only signs the user in.
    - **Agents, scripts**: exchange an API key (`ruum_agent_...`) for a short-lived access token at
      `POST /v1/oauth/token` (token exchange), then send it as a bearer token. The key itself is
      never a bearer token.
    - **Share links**: `POST /v1/share-links/resolve` returns a short-lived bearer token for the
      link (see `bearerAuth` for the claims).
    - **WebDAV** (a separate host, `https://dav.<domain>/`, that never sets or reads cookies;
      not part of this REST contract): HTTP Basic with the user's email and an app password
      (`ruum_app_...`, see `createAppPassword`), or a bearer agent token. An app password is the
      user, bound to one tenant: writes through it record the user as `actor`. The REST API
      does not accept app passwords, and the platform origin does not serve WebDAV.

    ## Roles and the share permission
    Roles follow Google Drive: `view < comment < edit < manage` (`Role`). `share` (change grants
    and share links) is a permission, not a role: `manage` always has it; `edit` has it while the
    node's effective `editors_can_share` setting is true (the default; see `updateNodeSharing`).
    In a team tenant, members manage the team tree, and share there only while the tenant policy
    `members_can_share` is true. Share links never have `manage` or `share`. A caller grants at
    most its own role on the node. Node responses carry `my_role` and `my_can_share`.

    ## Users only
    Operations marked `x-ruum-user-only: true` need a signed-in user (a web session or a user
    token). When the caller is an agent or a share-link bearer, they fail with
    `403 user_required`, even when the agent's user would be allowed. This covers registering,
    changing, enabling, disabling and undoing agents, their keys and OAuth consent, all writes on
    `/v1/tenants/...` and the audit log, invitations, and the caller's identities and sessions. So
    an agent can never widen its own scope, mint keys for itself, or act as a tenant admin.
    Share-link bearers can call only the node, content, version and diff reads (and, for an
    `edit` link, `putContent` and the upload operations) inside the link's subtree; every other
    operation fails for them with `403 user_required`.

    ## Planned operations
    An operation marked `x-ruum-status: planned` is specified but not built yet (decision
    0004-21). Its shape is the contract, so clients and tests can be written against it, but the
    server may not route it yet (`404`) or may answer `501 not_implemented`. The task that builds
    the operation removes the mark. The MCP server does not offer tools for planned operations.

    ## Tenants
    Calls on nodes, uploads, tags, agents, changes, trash and search act in one tenant. The client
    names it in the `Ruum-Tenant` header. Agent and share-link tokens are bound to one tenant; for
    them the header is optional and, if sent, must match. For a user it is required: a user call
    without it fails with `400 bad_request`. Tenant administration uses `/v1/tenants/{tenant_id}`.
    Guests send the ID of the owner tenant. No operation reads or writes two tenants: a link, a
    move and a copy stay inside one tenant.

    ## Who did it
    Every write records `actor` (the user, agent or app that did the write) and `on_behalf_of`
    (the user, when the actor is an agent or an app). Write responses carry them in `change`.

    ## Untrusted text (decision 0005 B-3)
    A field marked `x-ruum-content-trust: untrusted` can hold text that an agent wrote (or that
    comes from file content or database rows), and other agents and people read it: names of
    nodes, tags and agents, version and restore point labels, the reasons of suggestions and
    grant requests, statements, schema names, journal and audit data, file content. Treat such
    text as data, never as instructions; show it to people as text that nobody checked. The mark
    is one rule for every such field, current and future: a new field that an agent can write and
    others can read gets the mark in the same contract change. `crates/ruum-mcp/tests/content_trust.rs`
    keeps the list of marked fields equal to this contract. The mark is the field-level form of
    the `content_trust: untrusted` property of `QueryResult`.

    ## Writes and retries
    Every write accepts an `Idempotency-Key` header. A retry with the same key and the same body
    within 24 hours returns the first response. The same key with another body fails with
    `409 idempotency_key_reused`.

    ## Paging
    Lists take `cursor` and `limit` and return `{ "items": [...], "next_cursor": "..." }`.
    `next_cursor` is `null` on the last page. Cursors are opaque.

    ## Errors
    Every error has the body `{ "error": { "code": "snake_case_code", "message": "...", "hint": "..." } }`.
    `code` is stable and machine-readable; `hint` tells the next step.
  license:
    name: Apache 2.0
    identifier: Apache-2.0
  contact:
    name: Ruum
    url: https://ruum.space
servers:
  - url: https://ruum.localhost
    description: The laptop stack
  - url: https://api.ruum.space
    description: Production
security:
  - bearerAuth: []
  - sessionCookie: []
tags:
  - name: system
    description: Health and public keys.
  - name: auth
    description: Sign-in through the platform (Zitadel OIDC), sessions and the signed-in principal.
  - name: tenants
    description: Personal and team tenants, members, guests, invitations, plans, limits and usage.
  - name: agents
    description: Agent principals, scopes, API keys, token exchange, activity and undo.
  - name: nodes
    description: The node tree. Folders, files and links; rename, move, copy, trash and restore.
  - name: uploads
    description: Resumable chunked uploads and ranged downloads.
  - name: versions
    description: Version history, restore, labels and diffs.
  - name: tags
    description: Tenant tags on nodes.
  - name: sharing
    description: Grants, share links and Shared with me.
  - name: changes
    description: The change journal as a feed for sync clients and agents.
  - name: search
    description: Search by name.
  - name: audit
    description: The audit log of a tenant.
  - name: databases
    description: |
      Step 2 (DRAFT): database nodes (Postgres and SQLite), the HTTP query API with the privacy
      filter and typed hidden-value markers, column classes, migrations, branches, backups and
      point-in-time restore, and time-limited grants for agents (design section 8). Every
      operation of this tag is `x-ruum-status: planned` until its build task lands.
  - name: apps
    description: |
      Step 3 (DRAFT): web app nodes (design section 9): deployments (previews and live),
      publish and rollback, settings, secrets (write-only), custom domains, app-defined roles,
      bindings, partner API keys, approvals of agents' publishes, logs, metrics, traces and
      telemetry classes, and public projects (section 9.9). The gateway and the runtime API that
      apps call are in `contracts/apps/`. Every operation of this tag is `x-ruum-status: planned`
      until its build task lands (`docs/STEP3.md`).
  - name: issues
    description: |
      Step 3 (DRAFT): issues as nodes (design section 9.7): filed by people, agents, monitoring
      and the report widget; error occurrences; reporters' receipts and reveal requests. Planned.
  - name: templates
    description: |
      Step 3 (DRAFT): project and issue templates (design section 2.7): the Ruum gallery, saving a
      project as a template, and new projects from a template. Planned.

paths:
  /healthz:
    get:
      tags: [system]
      operationId: health
      summary: Liveness check
      security: []
      responses:
        '200':
          description: The service is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /.well-known/jwks.json:
    get:
      tags: [system]
      operationId: getJwks
      summary: Public keys of the Ruum token issuer
      description: |
        The keys that verify Ruum access tokens (agents, users of native clients and share links),
        as a JWKS. The same issuer signs other token types later (provider and app tokens); they
        have another `aud` and `typ`, and the API refuses them (see `bearerAuth`).
      security: []
      responses:
        '200':
          description: The JWKS document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jwks'

  /.well-known/oauth-protected-resource:
    get:
      tags: [system]
      operationId: getProtectedResourceMetadata
      summary: OAuth protected resource metadata (RFC 9728)
      description: |
        Tells OAuth and MCP clients which authorization server issues tokens for this API. A `401`
        from the API or from `/mcp` has `WWW-Authenticate: Bearer resource_metadata="<this URL>"`.
      security: []
      responses:
        '200':
          description: The metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProtectedResourceMetadata'

  /.well-known/oauth-authorization-server:
    get:
      tags: [system]
      operationId: getAuthorizationServerMetadata
      summary: OAuth authorization server metadata (RFC 8414)
      description: |
        Ruum is the authorization server for agent tokens. The endpoints are
        `/v1/oauth/authorize`, `/v1/oauth/token` and `/v1/oauth/register`. Only the
        `authorization_code` (with PKCE `S256`), `refresh_token` and token exchange grants exist.
      security: []
      responses:
        '200':
          description: The metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationServerMetadata'

  # ---------------------------------------------------------------- auth
  /v1/auth/login:
    get:
      tags: [auth]
      operationId: loginStart
      summary: Start OIDC sign-in
      description: |
        Redirects the browser to Zitadel (authorization code flow with PKCE). The server keeps the
        state, nonce and PKCE verifier in a short-lived cookie of this sign-in flow,
        `ruum_login_<hash of the state>`, so parallel sign-ins do not replace each other.
      security: []
      parameters:
        - name: return_to
          in: query
          description: A relative path in the web UI to go to after sign-in. Absolute URLs are refused.
          schema:
            type: string
            pattern: '^/[^/\\]'
            default: /
        - name: idp
          in: query
          description: A hint for the identity provider (decision 6).
          schema:
            type: string
            enum: [google, microsoft, passkey]
      responses:
        '302':
          description: Redirect to the identity provider.
          headers:
            Location:
              schema:
                type: string
                format: uri
            Set-Cookie:
              description: The `ruum_login_<hash>` state cookie of the flow; it can also clear stale flow cookies.
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'

  /v1/auth/callback:
    get:
      tags: [auth]
      operationId: loginCallback
      summary: OIDC callback
      description: |
        Exchanges the code, verifies the ID token, finds or makes the user (a new user gets a
        personal tenant) and starts a session. Identities are linked only by an explicit action or
        by a verified email from a trusted provider.
      security: []
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: error
          in: query
          description: Set by the identity provider when sign-in failed.
          schema:
            type: string
      responses:
        '302':
          description: Redirect to `return_to`, with the session cookie set.
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              description: '`ruum_session` (HttpOnly, Secure, SameSite=Lax) and `ruum_csrf`.'
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Sign out
      description: >-
        Ends the caller's web session, clears the cookies and returns the end-session URL of the
        identity provider. A caller with a bearer token (a user or an agent token) has no
        session: the call ends nothing and answers `200`; the token stays valid until it
        expires.
      responses:
        '200':
          description: Signed out.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /v1/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: The signed-in principal
      description: |
        Who the caller is. For an agent token, the agent, its user and its scope.

        With the session cookie of the web UI, the call also binds the pending email grants of
        the user's verified email (see `addGrant`), at most once per session per 60 seconds.
        No other credential binds.
      responses:
        '200':
          description: The principal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /v1/me/preferences:
    patch:
      tags: [auth]
      operationId: updateMyPreferences
      x-ruum-user-only: true
      summary: Change the preferences of the signed-in user
      description: |
        Users only (agents and share links get `user_required`). Sets the preferences of the
        caller's own account (design 12.4); they hold for the user in every tenant. A property
        that is left out keeps its value; `null` clears it. `getMe` returns the preferences in
        `preferences`. Nobody else can read or change them.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserPreferencesRequest'
      responses:
        '200':
          description: The preferences after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferences'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/me/identities:
    get:
      tags: [auth]
      operationId: listMyIdentities
      x-ruum-user-only: true
      summary: Linked identities of the signed-in user
      description: Users only (agents and share links get `user_required`).
      responses:
        '200':
          description: The identities.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Identity'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'

  /v1/me/sessions:
    get:
      tags: [auth]
      operationId: listMySessions
      x-ruum-user-only: true
      summary: Web sessions of the signed-in user
      description: Users only (agents and share links get `user_required`).
      responses:
        '200':
          description: The sessions.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'

  /v1/me/sessions/{session_id}:
    delete:
      tags: [auth]
      operationId: endSession
      x-ruum-user-only: true
      summary: End one web session
      description: Users only (agents and share links get `user_required`).
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: The session is ended.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/me/app-passwords:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
    get:
      tags: [auth]
      operationId: listAppPasswords
      x-ruum-user-only: true
      summary: App passwords of the signed-in user
      description: |
        Users only (agents and share links get `user_required`). The caller's app passwords for
        the tenant of `Ruum-Tenant`, also revoked and expired ones. Secrets are not shown again.
      responses:
        '200':
          description: The app passwords.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AppPassword'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [auth]
      operationId: createAppPassword
      x-ruum-user-only: true
      summary: Create an app password
      description: |
        Users only (agents and share links get `user_required`). Makes an app password for
        WebDAV clients (Finder, Windows Explorer, rclone) on the WebDAV host (`dav_url` in the
        answer, not the platform origin) in the tenant of `Ruum-Tenant`; the
        caller must be a member or a guest there. The client signs in with HTTP Basic: the
        caller's email and the password. The password acts as the caller (`actor` is the user,
        not an agent) with the caller's rights in that one tenant. The secret is in this response
        only; the server stores its SHA-256. Members and guests who leave the tenant lose their
        app passwords (`removeMember`).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAppPasswordRequest'
      responses:
        '201':
          description: The app password with its secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppPasswordCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/me/app-passwords/{app_password_id}:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/AppPasswordId'
    delete:
      tags: [auth]
      operationId: revokeAppPassword
      x-ruum-user-only: true
      summary: Revoke an app password
      description: |
        Users only (agents and share links get `user_required`). Only the user who made it; the
        app passwords of other people answer `404`. WebDAV clients that use it fail at once.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Revoked.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------- tenants
  /v1/tenants:
    get:
      tags: [tenants]
      operationId: listTenants
      summary: Tenants of the signed-in user
      description: The personal tenant, the team tenants and the tenants where the user is a guest.
      responses:
        '200':
          description: The tenants with the user's role in each.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/TenantMembership'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [tenants]
      operationId: createTenant
      x-ruum-user-only: true
      summary: Create a team tenant
      description: Users only (agents and share links get `user_required`). The caller becomes the owner.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenantRequest'
      responses:
        '201':
          description: The new tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/tenants/{tenant_id}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [tenants]
      operationId: getTenant
      summary: Get a tenant
      responses:
        '200':
          description: The tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [tenants]
      operationId: updateTenant
      x-ruum-user-only: true
      summary: Rename a tenant or change its policy
      description: |
        Users only (agents get `user_required`). Needs the tenant role `admin` or `owner`. A change
        of `policy` applies at once to new grants, links and invitations; existing share links
        that the new policy forbids stop working (`allow_share_links`, `allow_edit_links`).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTenantRequest'
      responses:
        '200':
          description: The tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/tenants/{tenant_id}/members:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [tenants]
      operationId: listMembers
      summary: List members and guests
      description: >-
        Members, admins and owners (and their agents). Guests get `permission_denied`: the list
        holds the emails of everybody in the tenant.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of members.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/tenants/{tenant_id}/members/{user_id}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/UserId'
    patch:
      tags: [tenants]
      operationId: updateMember
      x-ruum-user-only: true
      summary: Change the role of a member
      description: |
        Users only (agents get `user_required`). Needs `admin`. Only an `owner` can make or remove owners. A tenant keeps at least one owner. A member made `guest` loses `tenant#member` and keeps only direct grants.

        `content_role` (decision 0003-1) is allowed only when the new `role` is `member`;
        otherwise the call fails with `422 validation_failed`. A member who stays a member keeps
        their content role when `content_role` is left out. A guest, admin or owner who becomes a
        member gets the given content role, else `manage`. A member who becomes an admin, owner
        or guest loses the content role (`null`). Every change of `role` or `content_role` is
        one `member.role_changed` audit entry.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  $ref: '#/components/schemas/MemberRole'
                content_role:
                  $ref: '#/components/schemas/ContentRole'
      responses:
        '200':
          description: The member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      tags: [tenants]
      operationId: removeMember
      x-ruum-user-only: true
      summary: Remove a member
      description: |
        Users only (agents get `user_required`). Needs `admin`, or the member removes themselves.
        In one transaction the server:
        - removes the membership (and so `tenant#member` and `tenant#administer`);
        - removes every direct grant to the user on nodes of this tenant (`grant.removed` for
          each), so the user does not stay a silent guest. To keep the person as a guest, an admin
          invites them again with role `guest` and grants again;
        - revokes the share links that the user or the user's agents made in this tenant
          (`share_link.revoked` for each), because the user may still hold their URLs;
        - disables the user's agents in this tenant (`owner_left`) and ends their OAuth grants;
        - revokes the user's app passwords for this tenant.
        Grants and member links that the user made for other people stay: they were made for the
        tenant. The actor of these entries is the caller.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Removed.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/tenants/{tenant_id}/invitations:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [tenants]
      operationId: listInvitations
      x-ruum-user-only: true
      summary: List open invitations
      description: Users only (agents get `user_required`). Needs `admin`.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of invitations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
    post:
      tags: [tenants]
      operationId: createInvitation
      x-ruum-user-only: true
      summary: Invite a person
      description: >-
        Users only (agents get `user_required`). Needs `admin`. Queues an email with the accept link in the same transaction (decision 0003-3); it names the space, the inviter, the role and the end date (`expires_at`). The server mints the token in the link when it sends the mail, so no token is stored in the outbox; a token works only while the invitation is pending. Fails with `plan_limit_reached` at the member limit, and with `permission_denied` for role `guest` when the tenant policy has `allow_guests: false`. `content_role` is allowed only with role `member` (else `422 validation_failed`) and defaults to `manage` (decision 0003-1). On acceptance a new person, or a guest, becomes a member with the invitation's content role; a person who is already a member keeps the higher of the two content roles (acceptance never lowers rights); an admin or owner keeps their role and has no content role.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
      responses:
        '201':
          description: The invitation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/tenants/{tenant_id}/invitations/{invitation_id}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/InvitationId'
    delete:
      tags: [tenants]
      operationId: revokeInvitation
      x-ruum-user-only: true
      summary: Revoke an invitation
      description: Users only (agents get `user_required`). Needs `admin`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Revoked.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/invitations/accept:
    post:
      tags: [tenants]
      operationId: acceptInvitation
      x-ruum-user-only: true
      summary: Accept an invitation
      description: |
        Users only (agents and share links get `user_required`). The signed-in user joins the tenant
        with the role of the invitation. The token binds the invitation to the user who presents
        it; the email of the user does not have to match. Email grants (`addGrant` with an email)
        to this invitation's email become grants to this user.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: The secret token from the invitation email.
      responses:
        '200':
          description: The new membership.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/invitations/preview:
    post:
      tags: [tenants]
      operationId: previewInvitation
      summary: What an invitation is for, before it is accepted
      description: |
        No sign-in needed (C-9, decision 0003-6). The accept page shows it before the person
        signs in or joins: the space, who invited them, the role and the end date. The token is
        in the body, not the URL, so it does not reach logs, as with `resolveShareLink`. Limited
        per client IP (30 per minute; `429`). Nothing changes: the invitation stays pending.

        `state` says whether the token still works. A pending or expired invitation also shows
        the space, the inviter, the roles, the end date and the email it was sent to, masked
        (for example `k***@e***.ee`), so the person can sign in with the right address. A
        revoked or accepted invitation shows only its `state`. An unknown token is `404`, and
        so is a token whose invitation ended more than 7 days ago (decision 0003-3: the server
        keeps ended tokens for a week, then deletes them).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreviewInvitationRequest'
      responses:
        '200':
          description: The state of the invitation, and what it is for.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPreview'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/tenants/{tenant_id}/limits:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [tenants]
      operationId: getLimits
      summary: Plan limits and usage
      description: The limits of the plan (design section 4.3) and the current usage. Any member can read them.
      responses:
        '200':
          description: The limits and the usage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LimitsAndUsage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/tenants/{tenant_id}/audit:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [audit]
      operationId: listAudit
      x-ruum-user-only: true
      summary: The audit log of a tenant
      description: |
        Users only (agents get `user_required`). Newest first. Needs the tenant role `admin`. With `Accept: application/x-ndjson` the server
        streams all matching entries as one JSON object per line (export).
      parameters:
        - name: since
          in: query
          schema:
            $ref: '#/components/schemas/Timestamp'
        - name: until
          in: query
          schema:
            $ref: '#/components/schemas/Timestamp'
        - name: actor
          in: query
          description: Only entries by this user, agent or app.
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: action
          in: query
          description: Only entries whose action starts with this prefix, for example `agent.`.
          schema:
            type: string
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
            application/x-ndjson:
              schema:
                $ref: '#/components/schemas/AuditEntry'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'

  # ---------------------------------------------------------------- agents
  /v1/agents:
    get:
      tags: [agents]
      operationId: listAgents
      summary: List agents
      description: >-
        The caller's agents. Tenant admins see all agents of the tenant. An agent caller sees
        only itself.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: owner
          in: query
          description: Only agents of this user (admins only).
          schema:
            $ref: '#/components/schemas/Uuid'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of agents.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [agents]
      operationId: registerAgent
      x-ruum-user-only: true
      summary: Register an agent
      description: |
        Users only (agents get `user_required`). Registers an agent that acts for the signed-in user
        (no team agents in step 1). Members and guests may register agents. A guest's live agents
        count against a per-guest limit (one member's allowance), not against the tenant's agent
        limit; each limit fails with `plan_limit_reached`. A guest gets `permission_denied` while
        the tenant policy has `allow_guests: false`. The agents of a guest who leaves or is
        removed are disabled (`owner_left`).
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterAgentRequest'
      responses:
        '201':
          description: The agent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/agents/{agent_id}:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/AgentId'
    get:
      tags: [agents]
      operationId: getAgent
      summary: Get an agent
      responses:
        '200':
          description: The agent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [agents]
      operationId: updateAgent
      x-ruum-user-only: true
      summary: Change an agent's name or scope
      description: >-
        Users only (agents get `user_required`, also for their own record). Only the owner of the agent. A new scope applies at once to every request: the API reads the scope of the agent row on each request, not from the token.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAgentRequest'
      responses:
        '200':
          description: The agent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/agents/{agent_id}/disable:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/AgentId'
    post:
      tags: [agents]
      operationId: disableAgent
      x-ruum-user-only: true
      summary: Disable an agent
      description: Users only (agents get `user_required`). The owner or a tenant admin. Key exchange, refresh and all requests of the agent fail with `agent_disabled`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The agent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/agents/{agent_id}/enable:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/AgentId'
    post:
      tags: [agents]
      operationId: enableAgent
      x-ruum-user-only: true
      summary: Enable an agent
      description: Users only (agents get `user_required`). Only the owner. An agent that was disabled because its user left the tenant cannot be enabled.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The agent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/agents/{agent_id}/keys:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/AgentId'
    get:
      tags: [agents]
      operationId: listAgentKeys
      x-ruum-user-only: true
      summary: List the API keys of an agent
      description: Users only (agents get `user_required`). The owner or a tenant admin. Metadata only. The secret is never shown again after creation.
      responses:
        '200':
          description: The keys.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AgentKey'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [agents]
      operationId: createAgentKey
      x-ruum-user-only: true
      summary: Create an API key
      description: |
        Users only (agents get `user_required`, so an agent cannot mint keys for itself). Only the
        owner of the agent. The response has the secret once. The server stores only a hash. Keys
        always expire (default 90 days, at most 1 year).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentKeyRequest'
      responses:
        '201':
          description: The key and its secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentKeyCreated'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/agents/{agent_id}/keys/{key_id}:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/AgentId'
      - $ref: '#/components/parameters/KeyId'
    delete:
      tags: [agents]
      operationId: revokeAgentKey
      x-ruum-user-only: true
      summary: Revoke an API key
      description: Users only (agents get `user_required`). The owner or a tenant admin. Access tokens from this key stop working within their lifetime (at most 15 minutes).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Revoked.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/agents/{agent_id}/activity:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/AgentId'
    get:
      tags: [agents]
      operationId: listAgentActivity
      summary: Changes made by an agent
      description: >-
        The journal entries where the agent is the actor, newest first. The owner of the agent or
        a tenant admin. Agents (also the agent itself) get `403` or `404`.
      parameters:
        - name: since
          in: query
          schema:
            $ref: '#/components/schemas/Timestamp'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of changes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/agents/{agent_id}/undo:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/AgentId'
    post:
      tags: [agents]
      operationId: undoAgent
      x-ruum-user-only: true
      summary: Undo what an agent did
      description: |
        Users only (agents get `user_required`). Only the owner of the agent or a tenant admin.
        Reverts the journal entries of the agent between `since` and `until` (or only the entries
        in `seqs`), newest first. With `dry_run` nothing changes. The undo itself is a set of new
        changes by the caller. Every event type has an inverse:

        | Event | Inverse |
        |---|---|
        | `node.created`, `node.copied` | trash the node |
        | `node.renamed` | rename back |
        | `node.moved` | move back to the old parent and name |
        | `node.trashed` | restore |
        | `node.restored` | trash again |
        | `node.purged` | none: skipped with reason `irreversible` |
        | `version.created`, `version.restored` | restore the version before it (a new head) |
        | `version.labeled` | set the old label |
        | `tag.attached` / `tag.detached` | detach / attach |
        | `grant.added` | remove the grant |
        | `grant.updated` | set the old role |
        | `grant.removed` | add the grant again |
        | `share_link.created` | revoke the link |
        | `share_link.revoked` | none: skipped with reason `irreversible` (the token is gone) |
        | `node.sharing_updated` | set the old `editors_can_share` |

        An entry whose node another actor changed later is skipped with reason
        `changed_later` (`changed_by` names the first such change), and an entry whose inverse the caller may not do is skipped with reason
        `permission_denied`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UndoRequest'
      responses:
        '200':
          description: What was (or would be) reverted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UndoReport'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/oauth/register:
    post:
      tags: [agents]
      operationId: registerOAuthClient
      summary: Register an OAuth client (RFC 7591)
      description: |
        Dynamic client registration for MCP clients. No sign-in needed. Only public clients with
        PKCE (`token_endpoint_auth_method: none`). Redirect URIs must be `https`, or `http` on a
        loopback address (`127.0.0.1`, `[::1]`, `localhost`) for native clients. A registration
        gives no access: access needs the consent of a user (`POST /v1/oauth/consent`). Unused
        registrations are deleted after 30 days. Errors use the OAuth error body (`OAuthError`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthClientRegistration'
      responses:
        '201':
          description: The registered client.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthClient'
        '400':
          description: '`invalid_redirect_uri` or `invalid_client_metadata`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/oauth/clients/{client_id}:
    parameters:
      - name: client_id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [agents]
      operationId: getOAuthClient
      summary: Get a registered OAuth client
      description: The public metadata of a client, for the consent screen. Users only.
      x-ruum-user-only: true
      responses:
        '200':
          description: The client.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthClient'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/oauth/authorize:
    get:
      tags: [agents]
      operationId: oauthAuthorize
      summary: Start an OAuth authorization (RFC 6749, PKCE)
      description: |
        The browser comes here from the OAuth client. The server checks `client_id`,
        `redirect_uri` (an exact match with a registered URI) and the PKCE challenge (`S256`
        only). Then it redirects to the consent screen of the web UI,
        `/oauth/consent?request=<request>`, through sign-in when there is no session. `request`
        is a signed, short-lived (10 minutes) value that holds the checked parameters; the server
        keeps no row for it. An unknown client or a wrong redirect URI is a `400` page, never a
        redirect. Other errors redirect to `redirect_uri` with `error` and `state` (RFC 6749,
        section 4.1.2.1).
      security: []
      parameters:
        - name: response_type
          in: query
          required: true
          schema:
            type: string
            const: code
        - name: client_id
          in: query
          required: true
          schema:
            type: string
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
            format: uri
        - name: code_challenge
          in: query
          required: true
          schema:
            type: string
            minLength: 43
            maxLength: 128
        - name: code_challenge_method
          in: query
          required: true
          schema:
            type: string
            const: S256
        - name: state
          in: query
          schema:
            type: string
        - name: scope
          in: query
          description: Ignored in step 1 except for `offline_access`. The user picks the `AgentScope` in the consent screen.
          schema:
            type: string
        - name: resource
          in: query
          description: RFC 8707. Must be the API origin or its `/mcp` URL; it becomes the `aud` of the tokens.
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: Redirect to the consent screen, to sign-in, or back to the client with an error.
          headers:
            Location:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'

  /v1/oauth/consent:
    post:
      tags: [agents]
      operationId: oauthConsent
      summary: Approve or deny an OAuth authorization
      description: |
        Users only (agents get `user_required`). The consent screen of the web UI calls it with the
        `request` value from `oauthAuthorize`. On approval the server creates a new agent of the
        user in `tenant_id` with `new_agent` (the rules of `registerAgent` apply: the agent limits,
        and a guest gets `permission_denied` while the tenant policy has `allow_guests: false`),
        or binds the client to the existing agent `agent_id` of the user, and stores the binding
        (table `agent_oauth_grants`). It returns the client's `redirect_uri` with a one-time code
        (valid 60 seconds). On denial it returns the `redirect_uri` with `error=access_denied`.
        Writes the audit entry `agent.oauth_approved` or `agent.oauth_denied`.
      x-ruum-user-only: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthConsentRequest'
      responses:
        '200':
          description: Where the browser goes next.
          content:
            application/json:
              schema:
                type: object
                required: [redirect_to]
                properties:
                  redirect_to:
                    type: string
                    format: uri
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/oauth/token:
    post:
      tags: [agents]
      operationId: exchangeToken
      summary: Get an access token
      description: |
        The OAuth token endpoint. Ruum signs all agent access tokens itself (15 minutes, bound to
        the agent's tenant; see `bearerAuth`). Three grants:
        - `authorization_code`: the code from the consent, with the PKCE `code_verifier`,
          `client_id` and the same `redirect_uri`. Returns an access token and a refresh token.
        - `refresh_token`: a refresh token rotates on each use (the old one stops working; reuse
          of an old one ends the whole grant). Refresh tokens live 30 days from the last use, and
          stop when the agent is disabled or its grant is ended.
        - token exchange (RFC 8693 shape): the `subject_token` is an agent API key
          (`ruum_agent_...`), for scripts and the CLI. No refresh token.

        Errors use the OAuth error body (`OAuthError`, RFC 6749 section 5.2) with the Ruum code in
        `ruum_code`: `invalid_grant` (unknown, used, revoked or expired code, key or refresh
        token; `ruum_code` `unauthenticated` or `agent_disabled`), `invalid_client`,
        `invalid_request`, `unsupported_grant_type`.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: The access token.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: The OAuth error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '401':
          description: '`invalid_client`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '429':
          $ref: '#/components/responses/RateLimited'

  # ---------------------------------------------------------------- nodes
  /v1/nodes/root:
    get:
      tags: [nodes]
      operationId: getRoot
      summary: The root folder of the tenant
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
      responses:
        '200':
          description: The root folder.
          headers:
            ETag:
              $ref: '#/components/headers/NodeETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'

  /v1/nodes:
    post:
      tags: [nodes]
      operationId: createNode
      summary: Create a folder, an empty file or a link
      description: |
        Needs `edit` on the parent. Typed nodes are made by the operation of their type
        (`createDatabase` in step 2); `kind: typed` fails with `validation_failed`. A parent that
        is a typed node fails with `409 conflict` (a database node holds only its branches).

        Links (design section 2.3): the target must be a node of the same tenant as the link
        (the `Ruum-Tenant` of the call). A target in another tenant, or one that the caller cannot
        see, fails with `404 not_found`; the database checks it too. So "Add to my drive" of a
        node that another tenant shared with you is not a link in step 1. A `member` link also
        needs `share` on the target. A member link acts like a grant of `view` made by its
        creator: it stays when the creator later loses `share`, and it ends when the link is
        trashed or the target leaves the tenant. Whoever can view the folder that holds the link
        can view the target, so sharing that folder (to guests, or by a share link) shares the
        target too, under the same tenant policy (`TenantPolicy`) as any other grant.
        To create a file with content, use `POST /v1/uploads` with a `new_file` target, or create
        an empty file and `PUT /v1/nodes/{node_id}/content`.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNodeRequest'
      responses:
        '201':
          description: The new node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeWrite'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/nodes/move:
    post:
      tags: [nodes]
      operationId: moveNodes
      summary: Move many nodes
      description: |
        Moves 1 to 100 nodes, each to its own new parent (decision 0003-7). Each item is one
        `moveNode`: it needs `manage` on the node and `edit` on the new parent, takes `name` and
        `on_conflict` as `moveNode` does, and writes its own `node.moved`.

        Not atomic. The items run in order, each on its own, and one item's error does not stop
        the others. The answer is `200` with one result per item, in the order of the request:
        `status` is the status that `moveNode` would answer for that item (`200`, `403`, `404`,
        `409`, `422`), with `node` and `change` on success or `error` on failure. The
        `Idempotency-Key` covers the whole call. A request with 0 or more than 100 items is
        `422 validation_failed`.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveNodesRequest'
      responses:
        '200':
          description: One result per item, in the order of the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/nodes/by-path/{path}:
    get:
      tags: [nodes]
      operationId: getNodeByPath
      summary: Get a node by its path
      description: |
        Resolves a path from the tenant root, for example `/v1/nodes/by-path/Projects/Garden`.
        The `path` parameter spans the rest of the URL and may contain `/`; each name is
        percent-encoded. Trashed nodes are not found. A link is returned as the link, not its target.
        Needs `view` on the target, as `getNode`; the caller need not see the folders on the way
        (a guest with a grant on `Projects/Garden` resolves `Projects/Garden`).
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: path
          in: path
          required: true
          description: Names separated by `/`, each percent-encoded.
          schema:
            type: string
      responses:
        '200':
          description: The node.
          headers:
            ETag:
              $ref: '#/components/headers/NodeETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/nodes/{node_id}:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/NodeId'
    get:
      tags: [nodes]
      operationId: getNode
      summary: Get a node
      description: |
        Needs `view`. A node that the caller cannot see is `404`, not `403`, so IDs do not leak.
        Node responses carry `my_role`, the caller's effective role on the node (after the agent
        scope), so clients know what they may do.
      responses:
        '200':
          description: The node.
          headers:
            ETag:
              $ref: '#/components/headers/NodeETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [nodes]
      operationId: purgeNode
      summary: Delete a trashed node permanently
      description: |
        Only for a trashed root (a live node fails with `409 conflict`; trash it first). Needs
        `manage`. On a plan with `admin_restore_days` greater than `trash_days` (team plans), it
        also needs the tenant role `admin`, so a member cannot cut the admin restore window short.
        Deletes the subtree and its versions; chunks go to garbage collection. Links to purged
        nodes stay as broken links. Writes `node.purged`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Purged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeOnly'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/nodes/{node_id}/children:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/NodeId'
    get:
      tags: [nodes]
      operationId: listChildren
      summary: List the children of a folder
      description: The live children that the caller can see. Folders come first when sorted by name.
      parameters:
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, updated_at, size]
            default: name
        - name: kind
          in: query
          schema:
            $ref: '#/components/schemas/NodeKind'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of children.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodePage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/nodes/{node_id}/rename:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/NodeId'
    post:
      tags: [nodes]
      operationId: renameNode
      summary: Rename a node
      description: Needs `edit` on the node. Writes `node.renamed`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameRequest'
      responses:
        '200':
          description: The renamed node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeWrite'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/nodes/{node_id}/move:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/NodeId'
    post:
      tags: [nodes]
      operationId: moveNode
      summary: Move a node
      description: |
        Needs `manage` on the node and `edit` on the new parent. A folder cannot move into itself or
        its own subtree. Moves inside one tenant only. Writes `node.moved`.

        Children of typed nodes (step 2): a typed node accepts only the children its provider
        allows (`allowed_child_types` in the provider descriptor). A database node accepts only
        its own branches, which `createDatabaseBranch` makes. A move into a typed node, and a move of a
        database branch away from its source database, fail with `409 conflict`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveRequest'
      responses:
        '200':
          description: The moved node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeWrite'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/nodes/{node_id}/copy:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/NodeId'
    post:
      tags: [nodes]
      operationId: copyNode
      summary: Copy a node
      description: |
        Needs `view` on the node and `edit` on the new parent. A file copy gets one version with the
        head content (chunks are shared, no bytes are copied). A folder is copied with its live
        subtree; links are copied as links. Grants are not copied. Writes `node.copied` for the new
        root and `node.created` for each node in it.

        Typed nodes (step 2): the copy gets the head manifest, and the provider copies the
        content (hook `copied`). A database copies with real data (`full`) only when the caller
        is a person with `manage` on the source database; for everyone else (agents, and people
        with `view` or `edit` on the source) the copy holds `masked` data, as a masked branch. So
        a copy never gives its maker more than they could read in the source. A guest, or an
        agent of a guest, cannot copy a typed node while the tenant policy
        `guests_create_resources` is false (`403 permission_denied`), because the copy counts
        against the host tenant's plan. A copy of a database does not copy its branches (a copy
        is a new live database); a copy into a typed node fails with `409 conflict`. A Postgres
        database is copied on the same path as a branch (`createDatabaseBranch`: a short pause
        of the source while the engine takes the copy). A copy of a branch with `masked` or
        `schema_only` data keeps that branch's pseudonym key (decision 0004-25).

        Web apps (step 3, planned): a copy of a `webapp` node is a new app in `provisioning`
        with the live archive as its first preview, never live by itself; generated secrets get
        new values, entered secrets are not copied, app role grants and custom domains are not
        copied, and bindings resolve again at the copy's first deployment (a relative binding to
        a database copied in the same folder copy points to the copy). Issues copy as nodes;
        their error counts and report attachments (screenshots, attached visit records, the
        reporter's choices and revealed raw values) never copy: they stay with the source.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopyRequest'
      responses:
        '201':
          description: The new copy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeWrite'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/nodes/{node_id}/trash:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/NodeId'
    post:
      tags: [nodes]
      operationId: trashNode
      summary: Move a node to the trash
      description: |
        Needs `manage`. The node and its subtree leave the tree; the name becomes free. The trash
        keeps them for the plan's trash period (30 days), then they are purged. The root cannot be
        trashed. Writes `node.trashed`. A database goes with its branches (they are its children),
        and is suspended while it is in the trash.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: The trashed node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeWrite'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'

  /v1/nodes/{node_id}/restore:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/NodeId'
    post:
      tags: [nodes]
      operationId: restoreNode
      summary: Restore a node from the trash
      description: |
        Needs `manage`. Restores into the old parent, or into `parent_id` when given or when the old
        parent is gone. Writes `node.restored`. Within the trash period any caller with `manage`
        can restore; after it, until `admin_restore_days` (team plans), only tenant admins can.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreRequest'
      responses:
        '200':
          description: The restored node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeWrite'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'

  /v1/trash:
    get:
      tags: [nodes]
      operationId: listTrash
      summary: List the trash
      description: |
        The trashed roots (not their children) that the caller can manage, newest first, within
        the plan's trash period. With `all=true` a tenant admin also sees the roots after the
        trash period that are still inside `admin_restore_days` (team plans).
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: all
          in: query
          description: Tenant admins only.
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of trashed nodes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodePage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'

  /v1/trash/empty:
    post:
      tags: [nodes]
      operationId: emptyTrash
      summary: Empty the trash
      description: |
        Purges every trashed root (with its subtree) that the caller may purge (see `purgeNode`).
        Other roots stay. Writes `node.purged` for each purged root.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: What was purged.
          content:
            application/json:
              schema:
                type: object
                required: [purged, change]
                properties:
                  purged:
                    type: integer
                    description: The number of purged roots.
                  change:
                    description: The last change, or `null` if nothing was purged.
                    oneOf:
                      - $ref: '#/components/schemas/Change'
                      - type: 'null'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  # ---------------------------------------------------------------- uploads and content
  /v1/uploads:
    post:
      tags: [uploads]
      operationId: createUpload
      summary: Start a resumable upload
      description: |
        The client first gets the chunking parameters for the file from
        `GET /v1/uploads/params` (for example FastCDC with 1 MiB minimum, 2 MiB average, 4 MiB
        maximum; smaller chunks for small and text files), cuts the file into chunks, hashes each
        chunk and the whole content with BLAKE3, and sends the list with the `chunking` it used.
        The server refuses a `chunking` that it does not publish (`validation_failed`). The
        response says which chunks the server does not have yet; the client uploads only those,
        then calls `complete`. Needs `edit` on the target file, or on the parent folder for a new
        file. Fails with `quota_exceeded` or `payload_too_large` (largest file of the plan) before
        any byte is sent. The session expires after 24 hours.

        A `new_version` target that is a typed node (step 2: a database) fails with
        `409 conflict`: the content of a typed node is its manifest, which only the type's own
        operations change (`updateDatabaseManifest`, `confirmColumnClasses`, `restoreVersion`).
        A `new_file` target whose parent is a typed node fails with `409 conflict` too.

        Known risk (accepted for step 1, design section 5.1): `missing` tells a caller whether
        the tenant already stores a chunk, also one from a file the caller cannot read. A member
        with `edit` somewhere could test whether known content exists in the tenant. Dedup is per
        tenant, so this never crosses tenants.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUploadRequest'
      responses:
        '201':
          description: The upload session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upload'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/uploads/params:
    get:
      tags: [uploads]
      operationId: getChunkingParams
      summary: The chunking parameters for a file
      description: |
        The parameters that `POST /v1/uploads` accepts for a file of this size and type. They
        depend only on these two inputs and on the server version, so a client may cache them by
        `id`.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: size
          in: query
          required: true
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: content_type
          in: query
          schema:
            type: string
      responses:
        '200':
          description: The parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChunkingParams'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/uploads/{upload_id}:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/UploadId'
    get:
      tags: [uploads]
      operationId: getUpload
      summary: Get an upload and its missing chunks
      description: Use it to resume an upload after a break. Only the actor that started the upload can see it.
      responses:
        '200':
          description: The upload session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upload'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [uploads]
      operationId: abortUpload
      summary: Abort an upload
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Aborted. Uploaded chunks are collected later by garbage collection.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/uploads/{upload_id}/chunks/{hash}:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/UploadId'
      - name: hash
        in: path
        required: true
        description: The BLAKE3 hash of the chunk, 64 lowercase hex characters.
        schema:
          $ref: '#/components/schemas/Hash'
    put:
      tags: [uploads]
      operationId: putChunk
      summary: Upload one chunk
      description: |
        The body is the raw chunk. The server checks the hash and fails with `hash_mismatch` if it
        differs. A chunk that is not in the upload's list fails with `validation_failed`. Sending a
        chunk twice is safe.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              contentMediaType: application/octet-stream
      responses:
        '204':
          description: Stored.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/uploads/{upload_id}/complete:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/UploadId'
    post:
      tags: [uploads]
      operationId: completeUpload
      summary: Complete an upload
      description: |
        Checks that all chunks are stored and that the content hash matches, then makes the new
        version (and the file node, for a `new_file` target) in one transaction. Fails with
        `chunk_missing` (the hint lists how many) or `version_mismatch` if `base_version` is no longer
        the head. Writes `version.created` (and `node.created`).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The node and its new version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentWrite'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/nodes/{node_id}/content:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/NodeId'
    get:
      tags: [uploads]
      operationId: downloadContent
      summary: Download file content
      description: |
        Needs `view`. Returns the head version, or `version` when given. Supports one byte range
        (`Range: bytes=start-end`) and `HEAD`. The response always has
        `Content-Disposition: attachment` and a strict `Content-Security-Policy: sandbox`, so an
        uploaded HTML file cannot run as the platform. This API-origin download is for the CLI,
        agents and WebDAV. Browsers (downloads and previews in the web UI) use
        `getContentUrl`, which serves the bytes from the separate content domain (decision 1).
      parameters:
        - name: version
          in: query
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: Range
          in: header
          schema:
            type: string
            pattern: '^bytes=\d*-\d*$'
        - name: If-None-Match
          in: header
          schema:
            type: string
      responses:
        '200':
          description: The whole content.
          headers:
            ETag:
              $ref: '#/components/headers/ContentETag'
            Accept-Ranges:
              schema:
                type: string
                const: bytes
            Content-Length:
              schema:
                type: integer
            Content-Disposition:
              schema:
                type: string
            Ruum-Version:
              description: The ID of the version that is sent.
              schema:
                $ref: '#/components/schemas/Uuid'
          content:
            application/octet-stream:
              schema:
                type: string
                contentMediaType: application/octet-stream
                x-ruum-content-trust: untrusted
        '206':
          description: The requested range.
          headers:
            ETag:
              $ref: '#/components/headers/ContentETag'
            Content-Range:
              schema:
                type: string
            Content-Length:
              schema:
                type: integer
            Ruum-Version:
              schema:
                $ref: '#/components/schemas/Uuid'
          content:
            application/octet-stream:
              schema:
                type: string
                contentMediaType: application/octet-stream
                x-ruum-content-trust: untrusted
        '304':
          description: Not modified (the `If-None-Match` ETag matches).
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '416':
          $ref: '#/components/responses/RangeNotSatisfiable'
    put:
      tags: [uploads]
      operationId: putContent
      summary: Replace file content in one request
      description: |
        For small files (at most 32 MiB): the body is the whole new content, and the server chunks
        it. Needs `edit`. Use `If-Match` with the version ID (`"<version_id>"`) to avoid lost
        updates. Larger files use `POST /v1/uploads`. Writes `version.created`.
        `coalesce=false` always makes a new version (see the parameter).

        A typed node (step 2: a database) fails with `409 conflict`, also for an `edit` share
        link: the manifest of a typed node changes only through the type's own operations
        (`updateDatabaseManifest`, `confirmColumnClasses`, `restoreVersion`).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: If-Match
          in: header
          description: The expected head version, as `"<version_id>"`.
          schema:
            type: string
        - name: Content-Type
          in: header
          schema:
            type: string
        - name: coalesce
          in: query
          description: >-
            Whether the save may join the head version (C-8, decision 0003-6). With the default
            `true`, a save by the same actor within the coalescing window of the version policy
            (10 minutes) replaces the content of the head version, as for automatic saves. With
            `false` the save always makes a new version, so the content before it stays in the
            history; send it for an explicit "upload a new version".
          schema:
            type: boolean
            default: true
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              contentMediaType: application/octet-stream
      responses:
        '200':
          description: The node and its new version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentWrite'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'

  /v1/nodes/{node_id}/content-url:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/NodeId'
    get:
      tags: [uploads]
      operationId: getContentUrl
      summary: A short-lived URL of the content on the content domain
      description: |
        Needs `view`. Returns a signed URL on the user-content domain
        (`https://<tenant-id>.content.ruumapps.net/...`, decision 1 and design section 15) that
        serves one version for 5 minutes, without cookies. `disposition=inline` is for previews:
        the content domain sends a strict CSP sandbox and never runs the content as the
        platform. The URL supports `Range`.
      parameters:
        - name: version
          in: query
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: disposition
          in: query
          schema:
            type: string
            enum: [attachment, inline]
            default: attachment
      responses:
        '200':
          description: The URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentUrl'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------- versions
  /v1/nodes/{node_id}/versions:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/NodeId'
    get:
      tags: [versions]
      operationId: listVersions
      summary: List versions
      description: Newest first. Needs `view`.
      parameters:
        - name: actor_kind
          in: query
          description: Only versions by this kind of actor, for example `agent`.
          schema:
            $ref: '#/components/schemas/PrincipalKind'
        - name: labeled
          in: query
          description: Only named versions.
          schema:
            type: boolean
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of versions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/nodes/{node_id}/versions/{version_id}:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/NodeId'
      - $ref: '#/components/parameters/VersionId'
    get:
      tags: [versions]
      operationId: getVersion
      summary: Get a version
      description: Needs `view`. The content is at `GET /v1/nodes/{node_id}/content?version={version_id}`.
      responses:
        '200':
          description: The version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/nodes/{node_id}/versions/{version_id}/restore:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/NodeId'
      - $ref: '#/components/parameters/VersionId'
    post:
      tags: [versions]
      operationId: restoreVersion
      summary: Restore a version
      description: |
        Needs `edit`. Makes a new head version with the content of the old one (`restored_from` is
        set). History is never deleted. Writes `version.restored`.

        Typed nodes (step 2): restoring a manifest version follows the rules of the type's
        manifest update. For a database it needs `manage`, the old manifest must pass the
        manifest validation of today (`validation_failed`), and an agent may not restore a
        version whose `data_classes` differs from the current one (`validation_failed`, hint
        `suggestColumnClasses`). When a person restores other `data_classes`, that counts as a
        confirmation by that person (audit entry); keys that name no live column are dropped.
        The restore changes settings only, never data (`restoreDatabase` restores data).

        Web apps (step 3, planned): a version of a `webapp` node is one live deployment, so
        restoring it by a person is a rollback with the rules of `publishAppDeployment` (across
        a later migration it needs `publishAppDeployment` with `force`). An agent cannot restore
        an app version here (`403 permission_denied`, hint `publishAppDeployment`, with the
        deployment of that version in `error.details.deployment_id`): its rollback goes through
        `publishAppDeployment`, where it waits for a person.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The new head version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionWrite'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/nodes/{node_id}/versions/{version_id}/label:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/NodeId'
      - $ref: '#/components/parameters/VersionId'
    put:
      tags: [versions]
      operationId: setVersionLabel
      summary: Name a version
      description: Needs `edit`. A named version is kept forever and never merged. A `null` label removes the name. Writes `version.labeled`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabelRequest'
      responses:
        '200':
          description: The version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionWrite'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/nodes/{node_id}/diff:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/NodeId'
    get:
      tags: [versions]
      operationId: diffVersions
      summary: Compare two versions
      description: |
        Needs `view`. Runs the best matching diff plugin (or `plugin`) and returns the one change
        model of design section 5.4. The fallback chain ends with the binary plugin, so a diff
        always has a result. Results are cached by `(plugin, hash of from, hash of to)`.
      parameters:
        - name: from
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: to
          in: query
          description: Default is the head version.
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: plugin
          in: query
          description: A plugin name from `listDiffPlugins`, for example `text`.
          schema:
            type: string
      responses:
        '200':
          description: The changes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiffResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/nodes/{node_id}/diff/plugins:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/NodeId'
    get:
      tags: [versions]
      operationId: listDiffPlugins
      summary: Diff plugins that match a node
      description: Best first. The first one is the default.
      responses:
        '200':
          description: The plugins.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/DiffPluginInfo'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------- tags
  /v1/tags:
    get:
      tags: [tags]
      operationId: listTags
      summary: List tags
      description: The tags of the tenant. Any member can list them; guests see only tags on nodes they can see.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of tags.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [tags]
      operationId: createTag
      summary: Create a tag
      description: >-
        Any member (not guests). Names are unique in the tenant, case-insensitive. An agent
        needs a scope `max_role` of at least `edit`.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTagRequest'
      responses:
        '201':
          description: The tag.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagWrite'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/tags/{tag_id}:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/TagId'
    get:
      tags: [tags]
      operationId: getTag
      summary: Get a tag
      description: >-
        Members see every tag. Guests, and agents, see a tag only when they can see a node with
        it (inside the agent's scope); otherwise `404`.
      responses:
        '200':
          description: The tag.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [tags]
      operationId: updateTag
      summary: Change a tag
      description: >-
        Any member (not guests). An agent needs a scope `max_role` of at least `edit` and must
        see the tag (`getTag`).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTagRequest'
      responses:
        '200':
          description: The tag.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagWrite'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      tags: [tags]
      operationId: deleteTag
      summary: Delete a tag
      description: >-
        Tenant admins, or the creator of the tag. An agent needs a scope `max_role` of at least
        `edit` and must see the tag (`getTag`). Detaches the tag from all nodes (one
        `tag.detached` per node).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/tags/{tag_id}/nodes:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/TagId'
    get:
      tags: [tags]
      operationId: listNodesByTag
      summary: Nodes with a tag
      description: >-
        The live nodes with the tag that the caller can see. Who cannot see the tag (`getTag`)
        gets `404`.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of nodes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodePage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [tags]
      operationId: attachTagToNodes
      summary: Attach a tag to many nodes
      description: |
        Attaches the tag to 1 to 100 nodes (decision 0003-7). Each item is one `attachTag`: it
        needs `edit` on the node, attaching twice is a no-op, and each attach writes its own
        `tag.attached`.

        Not atomic. The items run in order, each on its own, and one item's error does not stop
        the others. The answer is `200` with one result per node, in the order of the request:
        `status` is the status that `attachTag` would answer for that node (`200`, `403`,
        `404`), with `change` on success or `error` on failure. Who cannot see the tag gets
        `404` in every item. The `Idempotency-Key` covers the whole call. A request with 0 or
        more than 100 nodes is `422 validation_failed`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachTagToNodesRequest'
      responses:
        '200':
          description: One result per node, in the order of the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/nodes/{node_id}/tags:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/NodeId'
    get:
      tags: [tags]
      operationId: listNodeTags
      summary: Tags of a node
      description: Needs `view` on the node.
      responses:
        '200':
          description: The tags.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Tag'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/nodes/{node_id}/tags/{tag_id}:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/NodeId'
      - $ref: '#/components/parameters/TagId'
    put:
      tags: [tags]
      operationId: attachTag
      summary: Attach a tag
      description: Needs `edit` on the node. Attaching twice is a no-op (no second journal entry). Writes `tag.attached`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Attached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeOnly'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [tags]
      operationId: detachTag
      summary: Detach a tag
      description: Needs `edit` on the node. Writes `tag.detached`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Detached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeOnly'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------- sharing
  /v1/nodes/{node_id}/grants:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/NodeId'
    get:
      tags: [sharing]
      operationId: listGrants
      summary: List grants
      description: The direct grants on the node and the inherited ones (with `inherited_from`). Needs `view`.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of grants.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [sharing]
      operationId: addGrant
      summary: Add a grant
      description: |
        Needs `share` on the node. Grants only add rights (decision 8). The caller grants at most
        its own role on the node: a caller who shares through `edit` (with `editors_can_share`)
        grants up to `edit`; a manager up to `manage`. An agent can never grant more than its own
        scope. Writes `grant.added`.

        A grant to a user by ID reaches only members and guests of this tenant. Any other user
        ID, unknown or a user of another tenant, fails with `404 not_found`. The answer is the
        same for both, so the call tells nothing about other tenants' users, and it never makes
        anyone a guest. To share with a person outside the tenant, grant to their email.

        A grant to an email (decision 0003-2):

        - (a) When the caller's user is a member, admin or owner (or the caller is an agent of
          one), and the email is the verified email of a member, admin, owner or guest of this
          tenant, the server stores a grant to that user and answers with a `GranteeUser`.
          These callers can list the members' emails anyway.
        - (a') When the caller's user is a guest (or the caller is an agent of a guest), the
          grant is always an email grant (`GranteeEmail`), whoever owns the email, so a guest
          cannot test whether an email belongs to the tenant.
        - (b) Any other email grant stays an email grant in storage and in every answer. It
          binds to a user, and the person becomes a guest of this tenant, when the person signs
          in with that email as a verified email of a trusted provider (`email_verified`), or
          calls `getMe` or `listSharedWithMe` with the session cookie of the web UI. Agent
          tokens, app passwords, share link tokens and bearer tokens never bind. An unverified
          email never claims an email grant. An admin invitation to that email
          (`createInvitation`) also binds it when it is accepted.
        - (c) A bind makes the person a guest only while the tenant policy has
          `allow_guests: true`; otherwise the grant stays an email grant.

        Anyone who may share the node may add an email grant, and so may cause a guest
        membership while `allow_guests` is true. The `grant.added` entry of an email grant has
        `may_add_guest: true`. When the tenant policy has `allow_guests: false`, a grant to a
        guest, or to an email that is not the verified email of a member, fails with
        `permission_denied`; a guest caller then gets `permission_denied` for every email.

        With `notify` (default `true`) the server queues a share email in the same transaction
        as the grant (decision 0003-3): `<Sharer> shared "<item>" with you`, the role in words,
        the optional `message` as plain text, and a link to the item in the web UI
        (`/t/<tenant_id>/files/<node_id>` for a folder, `/t/<tenant_id>/item/<node_id>`
        otherwise). The mail carries no token: the recipient opens the item by signing in with
        the address it was sent to. `notified` in the answer says whether a mail was queued
        (not whether it was delivered). No mail is queued for a grant to `tenant_members`, for
        a user without a verified email, to the caller's own email, when the same recipient got
        a mail for the node in the last 10 minutes, or over the mail limits (50 share mails per
        hour per sharing user and tenant, 500 per tenant). The grant is made in every case.

        Limits: 60 calls per 10 minutes per caller user (an agent counts against its user) and
        tenant, and 600 per tenant. Refused calls count too. Over the limit the call fails with
        `429 rate_limited`.

        A grant to `tenant_members` (everyone in the tenant) gives its role to every member,
        whatever their content role (decision 0003-1): a `view` member gets `edit` from an `edit`
        grant to everyone. Grants only add rights.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddGrantRequest'
      responses:
        '201':
          description: The grant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantWrite'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/nodes/{node_id}/grants/{grant_id}:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/NodeId'
      - $ref: '#/components/parameters/GrantId'
    patch:
      tags: [sharing]
      operationId: updateGrant
      summary: Change the role of a grant
      description: |
        Needs `share` on the node. Changes the role in one step (one journal entry,
        `grant.updated`). The caller sets at most its own role on the node, and changes a grant
        above its own role only when it has `manage`. An agent can never set a role above its own
        scope. Inherited grants are changed on the node that holds them.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  $ref: '#/components/schemas/Role'
      responses:
        '200':
          description: The grant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantWrite'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      tags: [sharing]
      operationId: removeGrant
      summary: Remove a grant
      description: Needs `share` on the node. Inherited grants are removed on the node that holds them. Writes `grant.removed`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeOnly'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/nodes/{node_id}/sharing:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/NodeId'
    patch:
      tags: [sharing]
      operationId: updateNodeSharing
      summary: Change the sharing settings of a node
      description: |
        Needs `manage`. Sets `editors_can_share` on the node: `true` or `false`, or `null` to
        inherit from the parent again. Children without their own value inherit it. Where the
        effective value is false, editors keep `edit` but lose the `share` permission; managers
        always share. Writes `node.sharing_updated`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNodeSharingRequest'
      responses:
        '200':
          description: The node with its new setting.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeWrite'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/nodes/{node_id}/share-links:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/NodeId'
    get:
      tags: [sharing]
      operationId: listShareLinks
      summary: List share links
      description: Needs `share`. Tokens are not shown again.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of share links.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareLinkPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [sharing]
      operationId: createShareLink
      summary: Create a share link
      description: |
        Needs `share`. Makes a secret link (`anyone_with_link`) with a role, an optional expiry and
        an optional password. The response has the token and URL once. The tenant policy
        (`TenantPolicy`) applies: without `allow_share_links` this fails with `permission_denied`;
        `edit` needs `allow_edit_links`; with `share_link_max_days` set, `expires_at` is required
        and at most that many days ahead (`validation_failed`). The link role is at most the
        caller's own role on the node, and never `manage`. Writes `share_link.created`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShareLinkRequest'
      responses:
        '201':
          description: The share link with its token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareLinkWrite'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/share-links/{link_id}:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/LinkId'
    delete:
      tags: [sharing]
      operationId: revokeShareLink
      summary: Revoke a share link
      description: Needs `share` on the node of the link. Writes `share_link.revoked`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeOnly'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/share-links/resolve:
    post:
      tags: [sharing]
      operationId: resolveShareLink
      summary: Open a share link
      description: |
        No sign-in needed. The token is in the body, not the URL, so it does not reach logs.
        Returns the node and a short-lived access token (`typ` `share_link`, see `bearerAuth`) for
        the link's role on that subtree. An expired, revoked or unknown link, or one that the
        tenant policy no longer allows, is `404`. A wrong password is `401`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveShareLinkRequest'
      responses:
        '200':
          description: The shared node and an access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolvedShareLink'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/shared-with-me:
    get:
      tags: [sharing]
      operationId: listSharedWithMe
      summary: Shared with me
      description: |
        The roots of grants to the caller's user (directly, or through `tenant#member`), across all
        tenants where the user is a member or guest. Newest first. No `Ruum-Tenant` header. For an
        agent, only items inside its scope.

        With the session cookie of the web UI, the call first binds the pending email grants of
        the user's verified email (see `addGrant`), at most once per session per 60 seconds;
        `check_email_grants=true` checks now. No other credential binds.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: check_email_grants
          in: query
          description: >-
            Check for email grants to bind now, also within 60 seconds of the last check. The
            item page of a share email sends it when the item answers `404`. Web sessions only;
            other credentials ignore it.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: One page of shared items.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  # ---------------------------------------------------------------- changes
  /v1/changes:
    get:
      tags: [changes]
      operationId: listChanges
      summary: The changes feed
      description: |
        The journal of the tenant, oldest first, after `cursor`. Sync clients keep `next_cursor`
        and call again. With `wait` the call waits up to that many seconds for new entries (long
        poll). A cursor older than the journal retention fails with `410 cursor_expired`; the
        client must then do a full listing.

        Visibility is checked against the state before and after each change. An entry is sent
        when the caller could see its node before the change or can see it after it (for agents:
        inside the scope, too). So a client learns that a node left its view: a `node.moved` to a
        folder it cannot see, `node.trashed`, `node.purged`, or a `grant.removed`. Entries on
        nodes that the caller never saw are left out. A tenant-level entry (`node_id` `null`) is
        sent to members only.

        A change can also change what the caller sees of a whole subtree without an entry per
        node: a grant added or removed (also through `tenant#member`), a member link added or
        removed, a node moved into or out of a visible folder, a restore. Then the page carries a
        marker in `resync`: the client lists that subtree again (`access: gained`) or drops it
        (`access: lost`), at the position `seq` of the marker. Clients order and dedupe entries
        by `seq`, and per node by `revision`.

        IDs in `data` may name nodes that the caller cannot see, also nodes that are gone (for
        example `old_parent_id` of a move); resolve them with `getNode`, which answers `404`.
        Names, paths and every other attribute of such a node never appear (decision 0003-8).
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: cursor
          in: query
          description: The `next_cursor` of the last call. Without it the feed starts at the oldest kept entry.
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
        - name: wait
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 30
            default: 0
        - name: node
          in: query
          description: Only changes inside this folder (at any depth).
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: actor
          in: query
          description: >-
            Only changes whose `actor.id` is this principal (a user or an agent). The filter
            applies after the visibility rules, so it never shows more. Entries that it leaves out
            also give no `resync` markers; a sync client does not use it.
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: since
          in: query
          description: Only changes at or after this time (`at`). Same rules as `actor`.
          schema:
            $ref: '#/components/schemas/Timestamp'
      responses:
        '200':
          description: One page of changes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangesPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '410':
          $ref: '#/components/responses/CursorExpired'

  /v1/changes/latest:
    get:
      tags: [changes]
      operationId: getLatestCursor
      summary: The newest cursor
      description: The cursor of the newest entry, so a client can start following from now.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
      responses:
        '200':
          description: The cursor.
          content:
            application/json:
              schema:
                type: object
                required: [cursor, seq]
                properties:
                  cursor:
                    type: string
                  seq:
                    type: integer
                    format: int64
        '401':
          $ref: '#/components/responses/Unauthenticated'

  # ---------------------------------------------------------------- search
  /v1/search:
    get:
      tags: [search]
      operationId: searchNodes
      summary: Search by name and type
      description: |
        Live nodes that the caller can see and that match every filter given. `q` matches names
        that contain it (case-insensitive), best match first. `type` matches `Node.type`
        (decision 0003-7). `q` may be left out when `type`, `tag` or `within` is given; the
        results are then ordered by name. With none of the four the answer is
        `422 validation_failed`.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: q
          in: query
          required: false
          description: Part of a node name. Required unless `type`, `tag` or `within` is given.
          schema:
            type: string
            minLength: 1
            maxLength: 255
        - name: kind
          in: query
          schema:
            $ref: '#/components/schemas/NodeKind'
        - name: type
          in: query
          description: |
            Matches `Node.type`, ignoring case: a whole type (`application/pdf`), or a prefix
            that ends in `/` (`image/` matches `image/png` and `image/jpeg`). `Node.type` is the
            MIME type of a file, and the type of a folder or a typed node (for example
            `database`), so the filter also finds typed nodes. To find "all PDFs", use
            `type=application/pdf`, not `q`: a name can lie.
          schema:
            type: string
            minLength: 1
            maxLength: 255
        - name: tag
          in: query
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: within
          in: query
          description: Only nodes inside this folder (at any depth).
          schema:
            $ref: '#/components/schemas/Uuid'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of hits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  # ================================================================== step 2: databases
  # DRAFT for review (docs/STEP2.md). Every operation names its work area in `x-ruum-area`.

  /v1/databases:
    post:
      tags: [databases]
      operationId: createDatabase
      x-ruum-area: databases
      summary: Create a database node
      description: |
        Creates a typed node of type `database` (design sections 7.1 and 8.1) under `parent_id`,
        with `manifest` as its first version (encoding `typed_manifest_v1`), and starts
        provisioning. Needs `edit` on the parent, and room in the plan (`plan_limit_reached`:
        the number of databases per engine, section 4.3). The manifest must be valid against
        `contracts/manifests/database.schema.json` and the provider's rules
        (`validation_failed`, with the JSON pointer of the problem in `hint`).

        The answer is `202`: the node exists at once, its `status.state` is `provisioning`
        until the engine has the database (`getDatabase`). Writes `node.created` (kind `typed`,
        type `database`) and `version.created`.

        With `source.kind: template` the database starts as a copy of a database node inside a
        template folder (design section 2.7: schema, migrations and masked sample data), taken
        on the same path as a branch (`createDatabaseBranch`).
        Agents may create databases inside their scope with `max_role` `edit` or higher.

        A database counts against the plan of the tenant that holds the folder. A guest, or an
        agent of a guest, may create one only while the tenant policy `guests_create_resources`
        is true (default false; `403 permission_denied` with the hint
        `guests_create_resources`). The same rule holds for `createDatabaseBranch`,
        `restoreDatabase` with `target: new_node`, and `copyNode` of a typed node (decision
        0002-2).
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDatabaseRequest'
      responses:
        '202':
          description: The new node; provisioning has started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseWrite'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/databases/{node_id}:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/NodeId'
    get:
      tags: [databases]
      operationId: getDatabase
      x-ruum-area: databases
      summary: Get a database node with its status
      description: |
        The node, the current manifest, the status (`provisioning`, `ready`, `failed` with a
        reason, ...), the size, the plan limits, the point-in-time window and what the caller
        may do (`my_permissions`). Needs `view`. A node that is not a database is `404`.
        Poll this after `createDatabase`, `updateDatabaseManifest` and `restoreDatabase`.
      responses:
        '200':
          description: The database.
          headers:
            ETag:
              $ref: '#/components/headers/NodeETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Database'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/databases/{node_id}/manifest:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/NodeId'
    put:
      tags: [databases]
      operationId: updateDatabaseManifest
      x-ruum-area: databases
      summary: Change the manifest (settings) of a database
      description: |
        Writes a new manifest version and applies it (the control loop of section 8.1). Needs
        `manage` (schema and settings). `engine` and `plan` cannot change in step 2
        (`validation_failed`). Only a person changes `data_classes`: when the caller is an agent
        and `data_classes` differs from the current manifest, the call fails with
        `validation_failed` (hint: `suggestColumnClasses`). Restoring an older manifest version
        (`restoreVersion`) applies the same rules. Writes `version.created`. A database in the
        trash cannot change (`409 conflict`; restore it first), so a suspended database never
        falls behind its manifest. In step 2 the extensions are fixed when the database is
        made (`validation_failed`, hint `/extensions`).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDatabaseManifestRequest'
      responses:
        '202':
          description: The new version is stored; the status shows `updating` until it is applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseWrite'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/databases/{node_id}/schema:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/NodeId'
    get:
      tags: [databases]
      operationId: getDatabaseSchema
      x-ruum-area: query
      summary: The tables, views and columns of a database
      description: |
        The catalog of the database: schemas, tables and views, columns with their SQL type,
        nullability and data class (effective and confirmed), primary and foreign keys. Needs
        `view`. This is the context an agent reads before it writes a query. Names and types
        only, never values. Use the names without the schema in `queryDatabase` (`plants`, not
        `public.plants`; see "Table names" there).
      responses:
        '200':
          description: The catalog.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseSchema'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/DatabaseNotReady'

  /v1/databases/{node_id}/query:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/NodeId'
    post:
      tags: [databases]
      operationId: queryDatabase
      x-ruum-area: query
      summary: Run one SQL statement (the HTTP query API)
      description: |
        Runs one statement with bound parameters (`$1`, `$2`, ... for Postgres; `?1`, `?2`,
        ... for SQLite) and returns the rows as JSON (design section 8.4). No driver and no
        connection pool needed.

        **Read-only by default.** `mode: read` (the default) runs in a read-only transaction and
        needs `view`. `mode: write` needs `edit`. Every query has a statement timeout and a row
        and size cap (the plan limits in `Database.limits`; the request may only lower them). A
        result over the cap is cut (`truncated: true`, `truncated_reason`). One statement per
        call; a second statement fails with `validation_failed`.

        **Agents** (section 8.5). For an agent without a `read_personal` grant, EVERY read of a
        `personal` or `secret` column sees the masked value, wherever the statement reads it:
        in the select list, `WHERE`, `JOIN`, `ORDER BY`, `GROUP BY`, `HAVING`, aggregates,
        subqueries, `RETURNING` and the source of an `INSERT ... SELECT`. The statement runs
        against masking views, not the tables (Postgres: views in the database that the agent's
        engine role is limited to; SQLite: per-connection views and an authorizer), so a filter
        such as `WHERE email LIKE 'a%'` compares the pseudonym, never the real value. A
        `personal` value reads as its pseudonym, the text `p_` plus 12 hex characters (the
        result shows `{"$ruum": "pseudonym", "id": "p_..."}`; the same value gives the same
        pseudonym in this tenant, so joins, grouping and counts of distinct values work). A
        `secret` value reads as `NULL` when it is `NULL` and as the hidden-value marker
        `{"$ruum": "hidden", "class": "secret"}` otherwise. A `read_personal` grant shows real
        `personal` values; `secret` values are never shown to an agent. An unclassified or
        unconfirmed column counts as `personal`.

        The class of a result column (`ResultColumn.data_class`) is the strictest class of the
        columns it reads, and `personal` when the server cannot tell; an expression that reads
        no column (a constant, a parameter) is `normal` and is never turned into a pseudonym.
        A masked `personal` column has the type `text` in the result, whatever its type in the
        table.

        **Agent writes.** `mode: write` by an agent works without a grant on a branch with
        `masked` or `schema_only` data; on a live database and on a branch with `full` data it
        needs a `write_live` grant. Checks run in this order: the right of the agent's user and
        the scope (`403 permission_denied` or `scope_exceeded`), then the `write_live` grant
        (`403 write_grant_required`), then the statement rules, and only then the approval of a
        destructive statement (`202`). An approval never replaces a `write_live` grant. A write
        statement (`INSERT`, `UPDATE`, `DELETE`, `MERGE`, also inside a `WITH`) of an agent
        without `read_personal` that reads or writes a `personal` or `secret` column anywhere
        (target column, `SET`, `WHERE`, a subquery, `RETURNING`, or the `SELECT` of an
        `INSERT`) fails with `403 class_read_required`, so a write can never copy a value into a
        column that the agent reads as `normal`, and never overwrites real values with
        pseudonyms. With `read_personal` the same holds for `secret` columns, and for people
        without `manage` for `secret` columns. Destructive statements (`DROP`, `TRUNCATE`, `DELETE` or `UPDATE`
        without `WHERE`, and schema changes outside a migration) from an agent never run at
        once: the answer is `202` with a pending `DatabaseApproval` that names the statement
        and the estimated number of rows; a person decides it (`decideDatabaseApproval`), and
        the agent sends the same statement again with `approval_id`.

        **Table names.** Write the names of the database's own tables and views without a schema
        (`plants`, not `public.plants`; SQLite: not `main.plants`). The statement runs against
        the caller's own view of the database (for agents and people without `manage`, masking
        views with the same names), which the server finds through the search path. A name
        qualified with `public` (Postgres) or `main` (SQLite) is refused for every caller with
        `422 statement_not_allowed` (hint `unqualified_names`: leave out the schema), so a
        statement works the same for every role and in both engines. The server never rewrites
        a name. `pg_catalog`, `information_schema` and `extensions` may be named.

        **Statements that never run** (`422 statement_not_allowed`, for people and agents, on
        both engines): role and session statements (`SET ROLE`, `RESET ROLE`, `SET SESSION
        AUTHORIZATION`, `set_config` of `role` or `session_authorization`,
        `CREATE`/`ALTER`/`DROP ROLE`, `GRANT`/`REVOKE` of roles, and `SET` (also `SET LOCAL`),
        `RESET` and `set_config` of any option, because connections are pooled and the
        platform's options hold the limits; options of one statement go in the request);
        transaction control (`BEGIN`, `START TRANSACTION`, `COMMIT`, `END`, `ROLLBACK`, `ABORT`,
        `SAVEPOINT`, `RELEASE`, `ROLLBACK TO`, `PREPARE TRANSACTION`, `COMMIT PREPARED`,
        `ROLLBACK PREPARED`; hint `remove_transaction_control`), because each request runs in a
        transaction of the platform that holds the options of the request (decision 0004-34 d);
        references to the platform's schemas (`ruum_*`); `public.` or `main.` before a table
        name (see "Table names"); writes to and schema changes of the system catalog (on
        Postgres a relation in `pg_catalog`, `information_schema` or another `pg_*` schema, or
        an unqualified name that starts with `pg_`, such as `UPDATE pg_settings`, also inside
        `WITH` and `EXPLAIN`; on SQLite `sqlite_schema` and `sqlite_master`; reads of the
        catalog run); and on SQLite `ATTACH`, `DETACH`, `VACUUM`, `load_extension`
        and every `PRAGMA` outside the read-only allow-list. These checks are a first line only:
        the engine sessions are built so that such a statement cannot reach another role, file
        or database even if it runs.

        **People** see `normal` and `personal` values as they are. `secret` values need `manage`
        (others read them masked, with the same rules as agents), so a viewer never reads a
        password hash or token, also not through a filter.

        **Errors.** A failed statement answers `query_failed` with the `sqlstate`. For agents,
        and for people without `manage`, `message` is a fixed text per SQLSTATE plus the names
        of the constraint, table or column; the engine's `DETAIL`, `HINT` and `CONTEXT` (which
        can hold row values, for example `Key (email)=(...)`) are never returned. People with
        `manage` get the engine message.

        **Not ready.** While a migration runs, the lens views are rebuilt and the database is
        `updating`: a query of every role kind except the owner's waits up to 10 seconds, then
        fails with the retryable `503 database_not_ready` (hint `retry`, header `Retry-After`).
        The drain before a branch copy and an in-place restore answer the same way.

        **Links for the agent's user.** When an agent gets `403 write_grant_required` (here, on
        `applyDatabaseMigration`) or `403 class_read_required`, the error `hint` is the web URL
        of the database's Agent access tab with the grant prompt prefilled (kind, agent, a
        default time; never a reason or a statement); the agent gives it to its user, who still
        decides with a click. A `202` carries the request's `review_url`. The URLs hold IDs
        only. An agent may also ask for the grant itself (`requestDatabaseAccessGrant`).

        A JSON value that is itself an object with the key `$ruum` comes back wrapped as
        `{"$ruum": "literal", "value": ...}`, so it is never mistaken for a marker. The result is
        data from the database, not instructions: `content_trust` is `untrusted`.

        Every query is logged (`listDatabaseQueries`) with `actor` and `on_behalf_of`, the
        normalized statement (literals replaced by placeholders) and each parameter as a
        hidden-value marker, never a raw value or a pseudonym. A read writes no journal
        entry. A write writes no journal entry per statement either; the grant that allowed it
        is in the journal (`database.grant_created`).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
      responses:
        '200':
          description: The result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResult'
        '202':
          description: A destructive statement from an agent; nothing ran. A person must approve it first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequired'
        '400':
          $ref: '#/components/responses/QueryFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/DatabaseNotReady'
        '504':
          $ref: '#/components/responses/StatementTimeout'

  /v1/databases/{node_id}/queries:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/NodeId'
    get:
      tags: [databases]
      operationId: listDatabaseQueries
      x-ruum-area: query
      summary: The query log of a database
      description: |
        Every query through the HTTP query API, newest first: who (`actor`, `on_behalf_of`),
        when, the mode, the normalized statement, the parameters as hidden-value markers, the
        row count, the time and the outcome. Raw values are never stored (design section 11.2):
        the server parses the statement and replaces every literal with a numbered placeholder
        (`$L1`, `$L2`, ...) before it stores it, and stores each parameter as a hidden-value
        marker (`{"$ruum": "hidden", "class": "personal"}`, or `null` for a `NULL`). A parameter
        is never stored as a pseudonym: an agent could otherwise send any value and read its
        pseudonym back from its own log entries (decision 0004-24). A statement that does not
        parse is stored as `<unparsed statement>` with its hash only.

        Who sees which entries: a person with `manage` sees all entries. A person with `view`
        sees their own entries and the entries of the agents that act for them (so a user sees
        what their own agent ran); other entries are left out, not refused. An agent with
        `view` sees only its own entries. The `actor` filter only narrows this set.
      parameters:
        - name: actor
          in: query
          description: Only queries by this principal (an agent ID or a user ID).
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: mode
          in: query
          schema:
            $ref: '#/components/schemas/QueryMode'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of log entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseQueryPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/databases/{node_id}/columns:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/NodeId'
