openapi: 3.1.0
info:
  title: Ruum API
  version: 0.1.0
  summary: Files, versions, tags, sharing, agents and the change journal of Ruum (step 1, Core).
  description: |
    The REST API of Ruum (`ruum.space`). Everything is a node in a tree, and one permission
    system protects all nodes. This contract covers step 1 (Core) of `docs/DESIGN.md`, section 16.

    ## Authentication
    - **Web UI**: the server runs the OIDC code flow with Zitadel (`/v1/auth/login`,
      `/v1/auth/callback`) and sets the HttpOnly cookie `ruum_session`. A cookie-authenticated
      request that changes state must also send the header `Ruum-Csrf` with the value of the
      cookie `ruum_csrf` (double submit). The value is bound to the session: a value that the
      server did not issue for this session fails with `403 permission_denied`, also when the
      header and the cookie are equal.
    - **Native clients and the CLI**: `Authorization: Bearer <token>` with a platform token.
    - **Agents, first choice (decision 3)**: OAuth 2.1. MCP clients find the authorization server
      through `/.well-known/oauth-protected-resource`, register with dynamic client registration
      (`POST /v1/oauth/register`, RFC 7591), send the user to `GET /v1/oauth/authorize` and get
      tokens from `POST /v1/oauth/token` (`authorization_code` with PKCE, then `refresh_token`).
      The user signs in (Zitadel) and approves the client in a consent screen of the web UI. The
      consent creates an agent, or binds the client to an existing agent of the user, with an
      `AgentScope`. Ruum is the authorization server for agent tokens and signs them itself;
      Zitadel only signs the user in.
    - **Agents, scripts**: exchange an API key (`ruum_agent_...`) for a short-lived access token at
      `POST /v1/oauth/token` (token exchange), then send it as a bearer token. The key itself is
      never a bearer token.
    - **Share links**: `POST /v1/share-links/resolve` returns a short-lived bearer token for the
      link (see `bearerAuth` for the claims).
    - **WebDAV** (a separate host, `https://dav.<domain>/`, that never sets or reads cookies;
      not part of this REST contract): HTTP Basic with the user's email and an app password
      (`ruum_app_...`, see `createAppPassword`), or a bearer agent token. An app password is the
      user, bound to one tenant: writes through it record the user as `actor`. The REST API
      does not accept app passwords, and the platform origin does not serve WebDAV.

    ## Roles and the share permission
    Roles follow Google Drive: `view < comment < edit < manage` (`Role`). `share` (change grants
    and share links) is a permission, not a role: `manage` always has it; `edit` has it while the
    node's effective `editors_can_share` setting is true (the default; see `updateNodeSharing`).
    In a team tenant, members manage the team tree, and share there only while the tenant policy
    `members_can_share` is true. Share links never have `manage` or `share`. A caller grants at
    most its own role on the node. Node responses carry `my_role` and `my_can_share`.

    ## Users only
    Operations marked `x-ruum-user-only: true` need a signed-in user (a web session or a user
    token). When the caller is an agent or a share-link bearer, they fail with
    `403 user_required`, even when the agent's user would be allowed. This covers registering,
    changing, enabling, disabling and undoing agents, their keys and OAuth consent, all writes on
    `/v1/tenants/...` and the audit log, invitations, and the caller's identities and sessions. So
    an agent can never widen its own scope, mint keys for itself, or act as a tenant admin.
    Share-link bearers can call only the node, content, version and diff reads (and, for an
    `edit` link, `putContent` and the upload operations) inside the link's subtree; every other
    operation fails for them with `403 user_required`.

    ## Tenants
    Calls on nodes, uploads, tags, agents, changes, trash and search act in one tenant. The client
    names it in the `Ruum-Tenant` header. Agent and share-link tokens are bound to one tenant; for
    them the header is optional and, if sent, must match. For a user it is required: a user call
    without it fails with `400 bad_request`. Tenant administration uses `/v1/tenants/{tenant_id}`.
    Guests send the ID of the owner tenant. No operation reads or writes two tenants: a link, a
    move and a copy stay inside one tenant.

    ## Who did it
    Every write records `actor` (the user, agent or app that did the write) and `on_behalf_of`
    (the user, when the actor is an agent or an app). Write responses carry them in `change`.

    ## Writes and retries
    Every write accepts an `Idempotency-Key` header. A retry with the same key and the same body
    within 24 hours returns the first response. The same key with another body fails with
    `409 idempotency_key_reused`.

    ## Paging
    Lists take `cursor` and `limit` and return `{ "items": [...], "next_cursor": "..." }`.
    `next_cursor` is `null` on the last page. Cursors are opaque.

    ## Errors
    Every error has the body `{ "error": { "code": "snake_case_code", "message": "...", "hint": "..." } }`.
    `code` is stable and machine-readable; `hint` tells the next step.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  contact:
    name: Ruum
    url: https://ruum.space
servers:
  - url: https://ruum.localhost
    description: The laptop stack
  - url: https://api.ruum.space
    description: Production
security:
  - bearerAuth: []
  - sessionCookie: []
tags:
  - name: system
    description: Health and public keys.
  - name: auth
    description: Sign-in through the platform (Zitadel OIDC), sessions and the signed-in principal.
  - name: tenants
    description: Personal and team tenants, members, guests, invitations, plans, limits and usage.
  - name: agents
    description: Agent principals, scopes, API keys, token exchange, activity and undo.
  - name: nodes
    description: The node tree. Folders, files and links; rename, move, copy, trash and restore.
  - name: uploads
    description: Resumable chunked uploads and ranged downloads.
  - name: versions
    description: Version history, restore, labels and diffs.
  - name: tags
    description: Tenant tags on nodes.
  - name: sharing
    description: Grants, share links and Shared with me.
  - name: changes
    description: The change journal as a feed for sync clients and agents.
  - name: search
    description: Search by name.
  - name: audit
    description: The audit log of a tenant.

paths:
  /healthz:
    get:
      tags: [system]
      operationId: health
      summary: Liveness check
      security: []
      responses:
        '200':
          description: The service is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /.well-known/jwks.json:
    get:
      tags: [system]
      operationId: getJwks
      summary: Public keys of the Ruum token issuer
      description: |
        The keys that verify Ruum access tokens (agents, users of native clients and share links),
        as a JWKS. The same issuer signs other token types later (provider and app tokens); they
        have another `aud` and `typ`, and the API refuses them (see `bearerAuth`).
      security: []
      responses:
        '200':
          description: The JWKS document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jwks'

  /.well-known/oauth-protected-resource:
    get:
      tags: [system]
      operationId: getProtectedResourceMetadata
      summary: OAuth protected resource metadata (RFC 9728)
      description: |
        Tells OAuth and MCP clients which authorization server issues tokens for this API. A `401`
        from the API or from `/mcp` has `WWW-Authenticate: Bearer resource_metadata="<this URL>"`.
      security: []
      responses:
        '200':
          description: The metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProtectedResourceMetadata'

  /.well-known/oauth-authorization-server:
    get:
      tags: [system]
      operationId: getAuthorizationServerMetadata
      summary: OAuth authorization server metadata (RFC 8414)
      description: |
        Ruum is the authorization server for agent tokens. The endpoints are
        `/v1/oauth/authorize`, `/v1/oauth/token` and `/v1/oauth/register`. Only the
        `authorization_code` (with PKCE `S256`), `refresh_token` and token exchange grants exist.
      security: []
      responses:
        '200':
          description: The metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationServerMetadata'

  # ---------------------------------------------------------------- auth
  /v1/auth/login:
    get:
      tags: [auth]
      operationId: loginStart
      summary: Start OIDC sign-in
      description: |
        Redirects the browser to Zitadel (authorization code flow with PKCE). The server keeps the
        state, nonce and PKCE verifier in the short-lived cookie `ruum_login`.
      security: []
      parameters:
        - name: return_to
          in: query
          description: A relative path in the web UI to go to after sign-in. Absolute URLs are refused.
          schema:
            type: string
            pattern: '^/[^/\\]'
            default: /
        - name: idp
          in: query
          description: A hint for the identity provider (decision 6).
          schema:
            type: string
            enum: [google, microsoft, passkey]
      responses:
        '302':
          description: Redirect to the identity provider.
          headers:
            Location:
              schema:
                type: string
                format: uri
            Set-Cookie:
              description: The `ruum_login` state cookie.
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'

  /v1/auth/callback:
    get:
      tags: [auth]
      operationId: loginCallback
      summary: OIDC callback
      description: |
        Exchanges the code, verifies the ID token, finds or makes the user (a new user gets a
        personal tenant) and starts a session. Identities are linked only by an explicit action or
        by a verified email from a trusted provider.
      security: []
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: error
          in: query
          description: Set by the identity provider when sign-in failed.
          schema:
            type: string
      responses:
        '302':
          description: Redirect to `return_to`, with the session cookie set.
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              description: '`ruum_session` (HttpOnly, Secure, SameSite=Lax) and `ruum_csrf`.'
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Sign out
      description: >-
        Ends the caller's web session, clears the cookies and returns the end-session URL of the
        identity provider. A caller with a bearer token (a user or an agent token) has no
        session: the call ends nothing and answers `200`; the token stays valid until it
        expires.
      responses:
        '200':
          description: Signed out.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /v1/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: The signed-in principal
      description: Who the caller is. For an agent token, the agent, its user and its scope.
      responses:
        '200':
          description: The principal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /v1/me/identities:
    get:
      tags: [auth]
      operationId: listMyIdentities
      x-ruum-user-only: true
      summary: Linked identities of the signed-in user
      description: Users only (agents and share links get `user_required`).
      responses:
        '200':
          description: The identities.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Identity'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'

  /v1/me/sessions:
    get:
      tags: [auth]
      operationId: listMySessions
      x-ruum-user-only: true
      summary: Web sessions of the signed-in user
      description: Users only (agents and share links get `user_required`).
      responses:
        '200':
          description: The sessions.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'

  /v1/me/sessions/{session_id}:
    delete:
      tags: [auth]
      operationId: endSession
      x-ruum-user-only: true
      summary: End one web session
      description: Users only (agents and share links get `user_required`).
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: The session is ended.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/me/app-passwords:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
    get:
      tags: [auth]
      operationId: listAppPasswords
      x-ruum-user-only: true
      summary: App passwords of the signed-in user
      description: |
        Users only (agents and share links get `user_required`). The caller's app passwords for
        the tenant of `Ruum-Tenant`, also revoked and expired ones. Secrets are not shown again.
      responses:
        '200':
          description: The app passwords.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AppPassword'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [auth]
      operationId: createAppPassword
      x-ruum-user-only: true
      summary: Create an app password
      description: |
        Users only (agents and share links get `user_required`). Makes an app password for
        WebDAV clients (Finder, Windows Explorer, rclone) on the WebDAV host (`dav_url` in the
        answer, not the platform origin) in the tenant of `Ruum-Tenant`; the
        caller must be a member or a guest there. The client signs in with HTTP Basic: the
        caller's email and the password. The password acts as the caller (`actor` is the user,
        not an agent) with the caller's rights in that one tenant. The secret is in this response
        only; the server stores its SHA-256. Members and guests who leave the tenant lose their
        app passwords (`removeMember`).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAppPasswordRequest'
      responses:
        '201':
          description: The app password with its secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppPasswordCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/me/app-passwords/{app_password_id}:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/AppPasswordId'
    delete:
      tags: [auth]
      operationId: revokeAppPassword
      x-ruum-user-only: true
      summary: Revoke an app password
      description: |
        Users only (agents and share links get `user_required`). Only the user who made it; the
        app passwords of other people answer `404`. WebDAV clients that use it fail at once.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Revoked.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------- tenants
  /v1/tenants:
    get:
      tags: [tenants]
      operationId: listTenants
      summary: Tenants of the signed-in user
      description: The personal tenant, the team tenants and the tenants where the user is a guest.
      responses:
        '200':
          description: The tenants with the user's role in each.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/TenantMembership'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [tenants]
      operationId: createTenant
      x-ruum-user-only: true
      summary: Create a team tenant
      description: Users only (agents and share links get `user_required`). The caller becomes the owner.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenantRequest'
      responses:
        '201':
          description: The new tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/tenants/{tenant_id}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [tenants]
      operationId: getTenant
      summary: Get a tenant
      responses:
        '200':
          description: The tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [tenants]
      operationId: updateTenant
      x-ruum-user-only: true
      summary: Rename a tenant or change its policy
      description: |
        Users only (agents get `user_required`). Needs the tenant role `admin` or `owner`. A change
        of `policy` applies at once to new grants, links and invitations; existing share links
        that the new policy forbids stop working (`allow_share_links`, `allow_edit_links`).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTenantRequest'
      responses:
        '200':
          description: The tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/tenants/{tenant_id}/members:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [tenants]
      operationId: listMembers
      summary: List members and guests
      description: >-
        Members, admins and owners (and their agents). Guests get `permission_denied`: the list
        holds the emails of everybody in the tenant.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of members.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/tenants/{tenant_id}/members/{user_id}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/UserId'
    patch:
      tags: [tenants]
      operationId: updateMember
      x-ruum-user-only: true
      summary: Change the role of a member
      description: Users only (agents get `user_required`). Needs `admin`. Only an `owner` can make or remove owners. A tenant keeps at least one owner. A member made `guest` loses `tenant#member` and keeps only direct grants.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  $ref: '#/components/schemas/MemberRole'
      responses:
        '200':
          description: The member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [tenants]
      operationId: removeMember
      x-ruum-user-only: true
      summary: Remove a member
      description: |
        Users only (agents get `user_required`). Needs `admin`, or the member removes themselves.
        In one transaction the server:
        - removes the membership (and so `tenant#member` and `tenant#administer`);
        - removes every direct grant to the user on nodes of this tenant (`grant.removed` for
          each), so the user does not stay a silent guest. To keep the person as a guest, an admin
          invites them again with role `guest` and grants again;
        - revokes the share links that the user or the user's agents made in this tenant
          (`share_link.revoked` for each), because the user may still hold their URLs;
        - disables the user's agents in this tenant (`owner_left`) and ends their OAuth grants;
        - revokes the user's app passwords for this tenant.
        Grants and member links that the user made for other people stay: they were made for the
        tenant. The actor of these entries is the caller.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Removed.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/tenants/{tenant_id}/invitations:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [tenants]
      operationId: listInvitations
      x-ruum-user-only: true
      summary: List open invitations
      description: Users only (agents get `user_required`). Needs `admin`.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of invitations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
    post:
      tags: [tenants]
      operationId: createInvitation
      x-ruum-user-only: true
      summary: Invite a person
      description: >-
        Users only (agents get `user_required`). Needs `admin`. Sends an email with the accept link. Fails with `plan_limit_reached` at the member limit, and with `permission_denied` for role `guest` when the tenant policy has `allow_guests: false`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
      responses:
        '201':
          description: The invitation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/tenants/{tenant_id}/invitations/{invitation_id}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/InvitationId'
    delete:
      tags: [tenants]
      operationId: revokeInvitation
      x-ruum-user-only: true
      summary: Revoke an invitation
      description: Users only (agents get `user_required`). Needs `admin`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Revoked.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/invitations/accept:
    post:
      tags: [tenants]
      operationId: acceptInvitation
      x-ruum-user-only: true
      summary: Accept an invitation
      description: |
        Users only (agents and share links get `user_required`). The signed-in user joins the tenant
        with the role of the invitation. The token binds the invitation to the user who presents
        it; the email of the user does not have to match. Email grants (`addGrant` with an email)
        to this invitation's email become grants to this user.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: The secret token from the invitation email.
      responses:
        '200':
          description: The new membership.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/tenants/{tenant_id}/limits:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [tenants]
      operationId: getLimits
      summary: Plan limits and usage
      description: The limits of the plan (design section 4.3) and the current usage. Any member can read them.
      responses:
        '200':
          description: The limits and the usage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LimitsAndUsage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/tenants/{tenant_id}/audit:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [audit]
      operationId: listAudit
      x-ruum-user-only: true
      summary: The audit log of a tenant
      description: |
        Users only (agents get `user_required`). Newest first. Needs the tenant role `admin`. With `Accept: application/x-ndjson` the server
        streams all matching entries as one JSON object per line (export).
      parameters:
        - name: since
          in: query
          schema:
            $ref: '#/components/schemas/Timestamp'
        - name: until
          in: query
          schema:
            $ref: '#/components/schemas/Timestamp'
        - name: actor
          in: query
          description: Only entries by this user, agent or app.
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: action
          in: query
          description: Only entries whose action starts with this prefix, for example `agent.`.
          schema:
            type: string
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
            application/x-ndjson:
              schema:
                $ref: '#/components/schemas/AuditEntry'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'

  # ---------------------------------------------------------------- agents
  /v1/agents:
    get:
      tags: [agents]
      operationId: listAgents
      summary: List agents
      description: >-
        The caller's agents. Tenant admins see all agents of the tenant. An agent caller sees
        only itself.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: owner
          in: query
          description: Only agents of this user (admins only).
          schema:
            $ref: '#/components/schemas/Uuid'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of agents.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [agents]
      operationId: registerAgent
      x-ruum-user-only: true
      summary: Register an agent
      description: |
        Users only (agents get `user_required`). Registers an agent that acts for the signed-in user
        (no team agents in step 1). Members and guests may register agents. A guest's live agents
        count against a per-guest limit (one member's allowance), not against the tenant's agent
        limit; each limit fails with `plan_limit_reached`. A guest gets `permission_denied` while
        the tenant policy has `allow_guests: false`. The agents of a guest who leaves or is
        removed are disabled (`owner_left`).
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterAgentRequest'
      responses:
        '201':
          description: The agent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/agents/{agent_id}:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/AgentId'
    get:
      tags: [agents]
      operationId: getAgent
      summary: Get an agent
      responses:
        '200':
          description: The agent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [agents]
      operationId: updateAgent
      x-ruum-user-only: true
      summary: Change an agent's name or scope
      description: >-
        Users only (agents get `user_required`, also for their own record). Only the owner of the agent. A new scope applies at once to every request: the API reads the scope of the agent row on each request, not from the token.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAgentRequest'
      responses:
        '200':
          description: The agent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/agents/{agent_id}/disable:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/AgentId'
    post:
      tags: [agents]
      operationId: disableAgent
      x-ruum-user-only: true
      summary: Disable an agent
      description: Users only (agents get `user_required`). The owner or a tenant admin. Key exchange, refresh and all requests of the agent fail with `agent_disabled`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The agent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/agents/{agent_id}/enable:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/AgentId'
    post:
      tags: [agents]
      operationId: enableAgent
      x-ruum-user-only: true
      summary: Enable an agent
      description: Users only (agents get `user_required`). Only the owner. An agent that was disabled because its user left the tenant cannot be enabled.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The agent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/agents/{agent_id}/keys:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/AgentId'
    get:
      tags: [agents]
      operationId: listAgentKeys
      x-ruum-user-only: true
      summary: List the API keys of an agent
      description: Users only (agents get `user_required`). The owner or a tenant admin. Metadata only. The secret is never shown again after creation.
      responses:
        '200':
          description: The keys.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AgentKey'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [agents]
      operationId: createAgentKey
      x-ruum-user-only: true
      summary: Create an API key
      description: |
        Users only (agents get `user_required`, so an agent cannot mint keys for itself). Only the
        owner of the agent. The response has the secret once. The server stores only a hash. Keys
        always expire (default 90 days, at most 1 year).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentKeyRequest'
      responses:
        '201':
          description: The key and its secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentKeyCreated'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/agents/{agent_id}/keys/{key_id}:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/AgentId'
      - $ref: '#/components/parameters/KeyId'
    delete:
      tags: [agents]
      operationId: revokeAgentKey
      x-ruum-user-only: true
      summary: Revoke an API key
      description: Users only (agents get `user_required`). The owner or a tenant admin. Access tokens from this key stop working within their lifetime (at most 15 minutes).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Revoked.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/agents/{agent_id}/activity:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/AgentId'
    get:
      tags: [agents]
      operationId: listAgentActivity
      summary: Changes made by an agent
      description: >-
        The journal entries where the agent is the actor, newest first. The owner of the agent or
        a tenant admin. Agents (also the agent itself) get `403` or `404`.
      parameters:
        - name: since
          in: query
          schema:
            $ref: '#/components/schemas/Timestamp'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of changes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/agents/{agent_id}/undo:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/AgentId'
    post:
      tags: [agents]
      operationId: undoAgent
      x-ruum-user-only: true
      summary: Undo what an agent did
      description: |
        Users only (agents get `user_required`). Only the owner of the agent or a tenant admin.
        Reverts the journal entries of the agent between `since` and `until` (or only the entries
        in `seqs`), newest first. With `dry_run` nothing changes. The undo itself is a set of new
        changes by the caller. Every event type has an inverse:

        | Event | Inverse |
        |---|---|
        | `node.created`, `node.copied` | trash the node |
        | `node.renamed` | rename back |
        | `node.moved` | move back to the old parent and name |
        | `node.trashed` | restore |
        | `node.restored` | trash again |
        | `node.purged` | none: skipped with reason `irreversible` |
        | `version.created`, `version.restored` | restore the version before it (a new head) |
        | `version.labeled` | set the old label |
        | `tag.attached` / `tag.detached` | detach / attach |
        | `grant.added` | remove the grant |
        | `grant.updated` | set the old role |
        | `grant.removed` | add the grant again |
        | `share_link.created` | revoke the link |
        | `share_link.revoked` | none: skipped with reason `irreversible` (the token is gone) |
        | `node.sharing_updated` | set the old `editors_can_share` |

        An entry whose node another actor changed later is skipped with reason
        `changed_later`, and an entry whose inverse the caller may not do is skipped with reason
        `permission_denied`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UndoRequest'
      responses:
        '200':
          description: What was (or would be) reverted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UndoReport'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/oauth/register:
    post:
      tags: [agents]
      operationId: registerOAuthClient
      summary: Register an OAuth client (RFC 7591)
      description: |
        Dynamic client registration for MCP clients. No sign-in needed. Only public clients with
        PKCE (`token_endpoint_auth_method: none`). Redirect URIs must be `https`, or `http` on a
        loopback address (`127.0.0.1`, `[::1]`, `localhost`) for native clients. A registration
        gives no access: access needs the consent of a user (`POST /v1/oauth/consent`). Unused
        registrations are deleted after 30 days. Errors use the OAuth error body (`OAuthError`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthClientRegistration'
      responses:
        '201':
          description: The registered client.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthClient'
        '400':
          description: '`invalid_redirect_uri` or `invalid_client_metadata`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/oauth/clients/{client_id}:
    parameters:
      - name: client_id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [agents]
      operationId: getOAuthClient
      summary: Get a registered OAuth client
      description: The public metadata of a client, for the consent screen. Users only.
      x-ruum-user-only: true
      responses:
        '200':
          description: The client.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthClient'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/oauth/authorize:
    get:
      tags: [agents]
      operationId: oauthAuthorize
      summary: Start an OAuth authorization (RFC 6749, PKCE)
      description: |
        The browser comes here from the OAuth client. The server checks `client_id`,
        `redirect_uri` (an exact match with a registered URI) and the PKCE challenge (`S256`
        only). Then it redirects to the consent screen of the web UI,
        `/oauth/consent?request=<request>`, through sign-in when there is no session. `request`
        is a signed, short-lived (10 minutes) value that holds the checked parameters; the server
        keeps no row for it. An unknown client or a wrong redirect URI is a `400` page, never a
        redirect. Other errors redirect to `redirect_uri` with `error` and `state` (RFC 6749,
        section 4.1.2.1).
      security: []
      parameters:
        - name: response_type
          in: query
          required: true
          schema:
            type: string
            const: code
        - name: client_id
          in: query
          required: true
          schema:
            type: string
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
            format: uri
        - name: code_challenge
          in: query
          required: true
          schema:
            type: string
            minLength: 43
            maxLength: 128
        - name: code_challenge_method
          in: query
          required: true
          schema:
            type: string
            const: S256
        - name: state
          in: query
          schema:
            type: string
        - name: scope
          in: query
          description: Ignored in step 1 except for `offline_access`. The user picks the `AgentScope` in the consent screen.
          schema:
            type: string
        - name: resource
          in: query
          description: RFC 8707. Must be the API origin or its `/mcp` URL; it becomes the `aud` of the tokens.
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: Redirect to the consent screen, to sign-in, or back to the client with an error.
          headers:
            Location:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'

  /v1/oauth/consent:
    post:
      tags: [agents]
      operationId: oauthConsent
      summary: Approve or deny an OAuth authorization
      description: |
        Users only (agents get `user_required`). The consent screen of the web UI calls it with the
        `request` value from `oauthAuthorize`. On approval the server creates a new agent of the
        user in `tenant_id` with `new_agent` (the rules of `registerAgent` apply: the agent limits,
        and a guest gets `permission_denied` while the tenant policy has `allow_guests: false`),
        or binds the client to the existing agent `agent_id` of the user, and stores the binding
        (table `agent_oauth_grants`). It returns the client's `redirect_uri` with a one-time code
        (valid 60 seconds). On denial it returns the `redirect_uri` with `error=access_denied`.
        Writes the audit entry `agent.oauth_approved` or `agent.oauth_denied`.
      x-ruum-user-only: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthConsentRequest'
      responses:
        '200':
          description: Where the browser goes next.
          content:
            application/json:
              schema:
                type: object
                required: [redirect_to]
                properties:
                  redirect_to:
                    type: string
                    format: uri
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/oauth/token:
    post:
      tags: [agents]
      operationId: exchangeToken
      summary: Get an access token
      description: |
        The OAuth token endpoint. Ruum signs all agent access tokens itself (15 minutes, bound to
        the agent's tenant; see `bearerAuth`). Three grants:
        - `authorization_code`: the code from the consent, with the PKCE `code_verifier`,
          `client_id` and the same `redirect_uri`. Returns an access token and a refresh token.
        - `refresh_token`: a refresh token rotates on each use (the old one stops working; reuse
          of an old one ends the whole grant). Refresh tokens live 30 days from the last use, and
          stop when the agent is disabled or its grant is ended.
        - token exchange (RFC 8693 shape): the `subject_token` is an agent API key
          (`ruum_agent_...`), for scripts and the CLI. No refresh token.

        Errors use the OAuth error body (`OAuthError`, RFC 6749 section 5.2) with the Ruum code in
        `ruum_code`: `invalid_grant` (unknown, used, revoked or expired code, key or refresh
        token; `ruum_code` `unauthenticated` or `agent_disabled`), `invalid_client`,
        `invalid_request`, `unsupported_grant_type`.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: The access token.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: The OAuth error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '401':
          description: '`invalid_client`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '429':
          $ref: '#/components/responses/RateLimited'

  # ---------------------------------------------------------------- nodes
  /v1/nodes/root:
    get:
      tags: [nodes]
      operationId: getRoot
      summary: The root folder of the tenant
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
      responses:
        '200':
          description: The root folder.
          headers:
            ETag:
              $ref: '#/components/headers/NodeETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'

  /v1/nodes:
    post:
      tags: [nodes]
      operationId: createNode
      summary: Create a folder, an empty file or a link
      description: |
        Needs `edit` on the parent. Typed nodes come in step 2; `kind: typed` fails with
        `validation_failed`.

        Links (design section 2.3): the target must be a node of the same tenant as the link
        (the `Ruum-Tenant` of the call). A target in another tenant, or one that the caller cannot
        see, fails with `404 not_found`; the database checks it too. So "Add to my drive" of a
        node that another tenant shared with you is not a link in step 1. A `member` link also
        needs `share` on the target. A member link acts like a grant of `view` made by its
        creator: it stays when the creator later loses `share`, and it ends when the link is
        trashed or the target leaves the tenant. Whoever can view the folder that holds the link
        can view the target, so sharing that folder (to guests, or by a share link) shares the
        target too, under the same tenant policy (`TenantPolicy`) as any other grant.
        To create a file with content, use `POST /v1/uploads` with a `new_file` target, or create
        an empty file and `PUT /v1/nodes/{node_id}/content`.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNodeRequest'
      responses:
        '201':
          description: The new node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeWrite'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/nodes/by-path/{path}:
    get:
      tags: [nodes]
      operationId: getNodeByPath
      summary: Get a node by its path
      description: |
        Resolves a path from the tenant root, for example `/v1/nodes/by-path/Projects/Garden`.
        The `path` parameter spans the rest of the URL and may contain `/`; each name is
        percent-encoded. Trashed nodes are not found. A link is returned as the link, not its target.
        Needs `view` on the target, as `getNode`; the caller need not see the folders on the way
        (a guest with a grant on `Projects/Garden` resolves `Projects/Garden`).
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: path
          in: path
          required: true
          description: Names separated by `/`, each percent-encoded.
          schema:
            type: string
      responses:
        '200':
          description: The node.
          headers:
            ETag:
              $ref: '#/components/headers/NodeETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/nodes/{node_id}:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/NodeId'
    get:
      tags: [nodes]
      operationId: getNode
      summary: Get a node
      description: |
        Needs `view`. A node that the caller cannot see is `404`, not `403`, so IDs do not leak.
        Node responses carry `my_role`, the caller's effective role on the node (after the agent
        scope), so clients know what they may do.
      responses:
        '200':
          description: The node.
          headers:
            ETag:
              $ref: '#/components/headers/NodeETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [nodes]
      operationId: purgeNode
      summary: Delete a trashed node permanently
      description: |
        Only for a trashed root (a live node fails with `409 conflict`; trash it first). Needs
        `manage`. On a plan with `admin_restore_days` greater than `trash_days` (team plans), it
        also needs the tenant role `admin`, so a member cannot cut the admin restore window short.
        Deletes the subtree and its versions; chunks go to garbage collection. Links to purged
        nodes stay as broken links. Writes `node.purged`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Purged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeOnly'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/nodes/{node_id}/children:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/NodeId'
    get:
      tags: [nodes]
      operationId: listChildren
      summary: List the children of a folder
      description: The live children that the caller can see. Folders come first when sorted by name.
      parameters:
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, updated_at, size]
            default: name
        - name: kind
          in: query
          schema:
            $ref: '#/components/schemas/NodeKind'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of children.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodePage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/nodes/{node_id}/rename:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/NodeId'
    post:
      tags: [nodes]
      operationId: renameNode
      summary: Rename a node
      description: Needs `edit` on the node. Writes `node.renamed`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameRequest'
      responses:
        '200':
          description: The renamed node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeWrite'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/nodes/{node_id}/move:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/NodeId'
    post:
      tags: [nodes]
      operationId: moveNode
      summary: Move a node
      description: |
        Needs `manage` on the node and `edit` on the new parent. A folder cannot move into itself or
        its own subtree. Moves inside one tenant only. Writes `node.moved`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveRequest'
      responses:
        '200':
          description: The moved node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeWrite'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/nodes/{node_id}/copy:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/NodeId'
    post:
      tags: [nodes]
      operationId: copyNode
      summary: Copy a node
      description: |
        Needs `view` on the node and `edit` on the new parent. A file copy gets one version with the
        head content (chunks are shared, no bytes are copied). A folder is copied with its live
        subtree; links are copied as links. Grants are not copied. Writes `node.copied` for the new
        root and `node.created` for each node in it.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopyRequest'
      responses:
        '201':
          description: The new copy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeWrite'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/nodes/{node_id}/trash:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/NodeId'
    post:
      tags: [nodes]
      operationId: trashNode
      summary: Move a node to the trash
      description: |
        Needs `manage`. The node and its subtree leave the tree; the name becomes free. The trash
        keeps them for the plan's trash period (30 days), then they are purged. The root cannot be
        trashed. Writes `node.trashed`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: The trashed node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeWrite'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'

  /v1/nodes/{node_id}/restore:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/NodeId'
    post:
      tags: [nodes]
      operationId: restoreNode
      summary: Restore a node from the trash
      description: |
        Needs `manage`. Restores into the old parent, or into `parent_id` when given or when the old
        parent is gone. Writes `node.restored`. Within the trash period any caller with `manage`
        can restore; after it, until `admin_restore_days` (team plans), only tenant admins can.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreRequest'
      responses:
        '200':
          description: The restored node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeWrite'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'

  /v1/trash:
    get:
      tags: [nodes]
      operationId: listTrash
      summary: List the trash
      description: |
        The trashed roots (not their children) that the caller can manage, newest first, within
        the plan's trash period. With `all=true` a tenant admin also sees the roots after the
        trash period that are still inside `admin_restore_days` (team plans).
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: all
          in: query
          description: Tenant admins only.
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of trashed nodes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodePage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'

  /v1/trash/empty:
    post:
      tags: [nodes]
      operationId: emptyTrash
      summary: Empty the trash
      description: |
        Purges every trashed root (with its subtree) that the caller may purge (see `purgeNode`).
        Other roots stay. Writes `node.purged` for each purged root.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: What was purged.
          content:
            application/json:
              schema:
                type: object
                required: [purged, change]
                properties:
                  purged:
                    type: integer
                    description: The number of purged roots.
                  change:
                    description: The last change, or `null` if nothing was purged.
                    oneOf:
                      - $ref: '#/components/schemas/Change'
                      - type: 'null'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  # ---------------------------------------------------------------- uploads and content
  /v1/uploads:
    post:
      tags: [uploads]
      operationId: createUpload
      summary: Start a resumable upload
      description: |
        The client first gets the chunking parameters for the file from
        `GET /v1/uploads/params` (for example FastCDC with 1 MiB minimum, 2 MiB average, 4 MiB
        maximum; smaller chunks for small and text files), cuts the file into chunks, hashes each
        chunk and the whole content with BLAKE3, and sends the list with the `chunking` it used.
        The server refuses a `chunking` that it does not publish (`validation_failed`). The
        response says which chunks the server does not have yet; the client uploads only those,
        then calls `complete`. Needs `edit` on the target file, or on the parent folder for a new
        file. Fails with `quota_exceeded` or `payload_too_large` (largest file of the plan) before
        any byte is sent. The session expires after 24 hours.

        Known risk (accepted for step 1, design section 5.1): `missing` tells a caller whether
        the tenant already stores a chunk, also one from a file the caller cannot read. A member
        with `edit` somewhere could test whether known content exists in the tenant. Dedup is per
        tenant, so this never crosses tenants.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUploadRequest'
      responses:
        '201':
          description: The upload session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upload'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/uploads/params:
    get:
      tags: [uploads]
      operationId: getChunkingParams
      summary: The chunking parameters for a file
      description: |
        The parameters that `POST /v1/uploads` accepts for a file of this size and type. They
        depend only on these two inputs and on the server version, so a client may cache them by
        `id`.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: size
          in: query
          required: true
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: content_type
          in: query
          schema:
            type: string
      responses:
        '200':
          description: The parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChunkingParams'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/uploads/{upload_id}:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/UploadId'
    get:
      tags: [uploads]
      operationId: getUpload
      summary: Get an upload and its missing chunks
      description: Use it to resume an upload after a break. Only the actor that started the upload can see it.
      responses:
        '200':
          description: The upload session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upload'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [uploads]
      operationId: abortUpload
      summary: Abort an upload
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Aborted. Uploaded chunks are collected later by garbage collection.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/uploads/{upload_id}/chunks/{hash}:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/UploadId'
      - name: hash
        in: path
        required: true
        description: The BLAKE3 hash of the chunk, 64 lowercase hex characters.
        schema:
          $ref: '#/components/schemas/Hash'
    put:
      tags: [uploads]
      operationId: putChunk
      summary: Upload one chunk
      description: |
        The body is the raw chunk. The server checks the hash and fails with `hash_mismatch` if it
        differs. A chunk that is not in the upload's list fails with `validation_failed`. Sending a
        chunk twice is safe.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              contentMediaType: application/octet-stream
      responses:
        '204':
          description: Stored.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/uploads/{upload_id}/complete:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/UploadId'
    post:
      tags: [uploads]
      operationId: completeUpload
      summary: Complete an upload
      description: |
        Checks that all chunks are stored and that the content hash matches, then makes the new
        version (and the file node, for a `new_file` target) in one transaction. Fails with
        `chunk_missing` (the hint lists how many) or `version_mismatch` if `base_version` is no longer
        the head. Writes `version.created` (and `node.created`).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The node and its new version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentWrite'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/nodes/{node_id}/content:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/NodeId'
    get:
      tags: [uploads]
      operationId: downloadContent
      summary: Download file content
      description: |
        Needs `view`. Returns the head version, or `version` when given. Supports one byte range
        (`Range: bytes=start-end`) and `HEAD`. The response always has
        `Content-Disposition: attachment` and a strict `Content-Security-Policy: sandbox`, so an
        uploaded HTML file cannot run as the platform. This API-origin download is for the CLI,
        agents and WebDAV. Browsers (downloads and previews in the web UI) use
        `getContentUrl`, which serves the bytes from the separate content domain (decision 1).
      parameters:
        - name: version
          in: query
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: Range
          in: header
          schema:
            type: string
            pattern: '^bytes=\d*-\d*$'
        - name: If-None-Match
          in: header
          schema:
            type: string
      responses:
        '200':
          description: The whole content.
          headers:
            ETag:
              $ref: '#/components/headers/ContentETag'
            Accept-Ranges:
              schema:
                type: string
                const: bytes
            Content-Length:
              schema:
                type: integer
            Content-Disposition:
              schema:
                type: string
            Ruum-Version:
              description: The ID of the version that is sent.
              schema:
                $ref: '#/components/schemas/Uuid'
          content:
            application/octet-stream:
              schema:
                type: string
                contentMediaType: application/octet-stream
        '206':
          description: The requested range.
          headers:
            ETag:
              $ref: '#/components/headers/ContentETag'
            Content-Range:
              schema:
                type: string
            Content-Length:
              schema:
                type: integer
            Ruum-Version:
              schema:
                $ref: '#/components/schemas/Uuid'
          content:
            application/octet-stream:
              schema:
                type: string
                contentMediaType: application/octet-stream
        '304':
          description: Not modified (the `If-None-Match` ETag matches).
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '416':
          $ref: '#/components/responses/RangeNotSatisfiable'
    put:
      tags: [uploads]
      operationId: putContent
      summary: Replace file content in one request
      description: |
        For small files (at most 32 MiB): the body is the whole new content, and the server chunks
        it. Needs `edit`. Use `If-Match` with the version ID (`"<version_id>"`) to avoid lost
        updates. Larger files use `POST /v1/uploads`. Writes `version.created`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: If-Match
          in: header
          description: The expected head version, as `"<version_id>"`.
          schema:
            type: string
        - name: Content-Type
          in: header
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              contentMediaType: application/octet-stream
      responses:
        '200':
          description: The node and its new version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentWrite'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'

  /v1/nodes/{node_id}/content-url:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/NodeId'
    get:
      tags: [uploads]
      operationId: getContentUrl
      summary: A short-lived URL of the content on the content domain
      description: |
        Needs `view`. Returns a signed URL on the user-content domain
        (`https://<tenant-id>.content.ruumapps.net/...`, decision 1 and design section 15) that
        serves one version for 5 minutes, without cookies. `disposition=inline` is for previews:
        the content domain sends a strict CSP sandbox and never runs the content as the
        platform. The URL supports `Range`.
      parameters:
        - name: version
          in: query
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: disposition
          in: query
          schema:
            type: string
            enum: [attachment, inline]
            default: attachment
      responses:
        '200':
          description: The URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentUrl'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------- versions
  /v1/nodes/{node_id}/versions:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/NodeId'
    get:
      tags: [versions]
      operationId: listVersions
      summary: List versions
      description: Newest first. Needs `view`.
      parameters:
        - name: actor_kind
          in: query
          description: Only versions by this kind of actor, for example `agent`.
          schema:
            $ref: '#/components/schemas/PrincipalKind'
        - name: labeled
          in: query
          description: Only named versions.
          schema:
            type: boolean
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of versions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/nodes/{node_id}/versions/{version_id}:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/NodeId'
      - $ref: '#/components/parameters/VersionId'
    get:
      tags: [versions]
      operationId: getVersion
      summary: Get a version
      description: Needs `view`. The content is at `GET /v1/nodes/{node_id}/content?version={version_id}`.
      responses:
        '200':
          description: The version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/nodes/{node_id}/versions/{version_id}/restore:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/NodeId'
      - $ref: '#/components/parameters/VersionId'
    post:
      tags: [versions]
      operationId: restoreVersion
      summary: Restore a version
      description: |
        Needs `edit`. Makes a new head version with the content of the old one (`restored_from` is
        set). History is never deleted. Writes `version.restored`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The new head version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionWrite'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/nodes/{node_id}/versions/{version_id}/label:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/NodeId'
      - $ref: '#/components/parameters/VersionId'
    put:
      tags: [versions]
      operationId: setVersionLabel
      summary: Name a version
      description: Needs `edit`. A named version is kept forever and never merged. A `null` label removes the name. Writes `version.labeled`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabelRequest'
      responses:
        '200':
          description: The version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionWrite'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/nodes/{node_id}/diff:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/NodeId'
    get:
      tags: [versions]
      operationId: diffVersions
      summary: Compare two versions
      description: |
        Needs `view`. Runs the best matching diff plugin (or `plugin`) and returns the one change
        model of design section 5.4. The fallback chain ends with the binary plugin, so a diff
        always has a result. Results are cached by `(plugin, hash of from, hash of to)`.
      parameters:
        - name: from
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: to
          in: query
          description: Default is the head version.
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: plugin
          in: query
          description: A plugin name from `listDiffPlugins`, for example `text`.
          schema:
            type: string
      responses:
        '200':
          description: The changes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiffResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/nodes/{node_id}/diff/plugins:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/NodeId'
    get:
      tags: [versions]
      operationId: listDiffPlugins
      summary: Diff plugins that match a node
      description: Best first. The first one is the default.
      responses:
        '200':
          description: The plugins.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/DiffPluginInfo'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------- tags
  /v1/tags:
    get:
      tags: [tags]
      operationId: listTags
      summary: List tags
      description: The tags of the tenant. Any member can list them; guests see only tags on nodes they can see.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of tags.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [tags]
      operationId: createTag
      summary: Create a tag
      description: >-
        Any member (not guests). Names are unique in the tenant, case-insensitive. An agent
        needs a scope `max_role` of at least `edit`.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTagRequest'
      responses:
        '201':
          description: The tag.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagWrite'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/tags/{tag_id}:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/TagId'
    get:
      tags: [tags]
      operationId: getTag
      summary: Get a tag
      description: >-
        Members see every tag. Guests, and agents, see a tag only when they can see a node with
        it (inside the agent's scope); otherwise `404`.
      responses:
        '200':
          description: The tag.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [tags]
      operationId: updateTag
      summary: Change a tag
      description: >-
        Any member (not guests). An agent needs a scope `max_role` of at least `edit` and must
        see the tag (`getTag`).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTagRequest'
      responses:
        '200':
          description: The tag.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagWrite'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      tags: [tags]
      operationId: deleteTag
      summary: Delete a tag
      description: >-
        Tenant admins, or the creator of the tag. An agent needs a scope `max_role` of at least
        `edit` and must see the tag (`getTag`). Detaches the tag from all nodes (one
        `tag.detached` per node).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/tags/{tag_id}/nodes:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/TagId'
    get:
      tags: [tags]
      operationId: listNodesByTag
      summary: Nodes with a tag
      description: >-
        The live nodes with the tag that the caller can see. Who cannot see the tag (`getTag`)
        gets `404`.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of nodes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodePage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/nodes/{node_id}/tags:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/NodeId'
    get:
      tags: [tags]
      operationId: listNodeTags
      summary: Tags of a node
      description: Needs `view` on the node.
      responses:
        '200':
          description: The tags.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Tag'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/nodes/{node_id}/tags/{tag_id}:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/NodeId'
      - $ref: '#/components/parameters/TagId'
    put:
      tags: [tags]
      operationId: attachTag
      summary: Attach a tag
      description: Needs `edit` on the node. Attaching twice is a no-op (no second journal entry). Writes `tag.attached`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Attached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeOnly'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [tags]
      operationId: detachTag
      summary: Detach a tag
      description: Needs `edit` on the node. Writes `tag.detached`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Detached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeOnly'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------- sharing
  /v1/nodes/{node_id}/grants:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/NodeId'
    get:
      tags: [sharing]
      operationId: listGrants
      summary: List grants
      description: The direct grants on the node and the inherited ones (with `inherited_from`). Needs `view`.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of grants.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [sharing]
      operationId: addGrant
      summary: Add a grant
      description: |
        Needs `share` on the node. Grants only add rights (decision 8). The caller grants at most
        its own role on the node: a caller who shares through `edit` (with `editors_can_share`)
        grants up to `edit`; a manager up to `manage`. An agent can never grant more than its own
        scope. Writes `grant.added`.

        A grant to a user by ID reaches only members and guests of this tenant. Any other user
        ID, unknown or a user of another tenant, fails with `404 not_found`. The answer is the
        same for both, so the call tells nothing about other tenants' users, and it never makes
        anyone a guest. To share with a person outside the tenant, grant to their email. It stays
        an email grant (no user) and sends an invitation with a secret token. It becomes a grant
        to a user, and the person a guest of this tenant, only when (a) a signed-in user accepts
        that invitation token, or (b) a user signs in with that email as a verified email of a
        trusted provider (`email_verified`). An unverified email never claims an email grant.
        When the tenant policy has `allow_guests: false`, a grant to a guest, or to an email that
        is not the verified email of a member, fails with `permission_denied`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddGrantRequest'
      responses:
        '201':
          description: The grant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantWrite'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/nodes/{node_id}/grants/{grant_id}:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/NodeId'
      - $ref: '#/components/parameters/GrantId'
    patch:
      tags: [sharing]
      operationId: updateGrant
      summary: Change the role of a grant
      description: |
        Needs `share` on the node. Changes the role in one step (one journal entry,
        `grant.updated`). The caller sets at most its own role on the node, and changes a grant
        above its own role only when it has `manage`. An agent can never set a role above its own
        scope. Inherited grants are changed on the node that holds them.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  $ref: '#/components/schemas/Role'
      responses:
        '200':
          description: The grant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantWrite'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      tags: [sharing]
      operationId: removeGrant
      summary: Remove a grant
      description: Needs `share` on the node. Inherited grants are removed on the node that holds them. Writes `grant.removed`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeOnly'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/nodes/{node_id}/sharing:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/NodeId'
    patch:
      tags: [sharing]
      operationId: updateNodeSharing
      summary: Change the sharing settings of a node
      description: |
        Needs `manage`. Sets `editors_can_share` on the node: `true` or `false`, or `null` to
        inherit from the parent again. Children without their own value inherit it. Where the
        effective value is false, editors keep `edit` but lose the `share` permission; managers
        always share. Writes `node.sharing_updated`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNodeSharingRequest'
      responses:
        '200':
          description: The node with its new setting.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeWrite'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/nodes/{node_id}/share-links:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/NodeId'
    get:
      tags: [sharing]
      operationId: listShareLinks
      summary: List share links
      description: Needs `share`. Tokens are not shown again.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of share links.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareLinkPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [sharing]
      operationId: createShareLink
      summary: Create a share link
      description: |
        Needs `share`. Makes a secret link (`anyone_with_link`) with a role, an optional expiry and
        an optional password. The response has the token and URL once. The tenant policy
        (`TenantPolicy`) applies: without `allow_share_links` this fails with `permission_denied`;
        `edit` needs `allow_edit_links`; with `share_link_max_days` set, `expires_at` is required
        and at most that many days ahead (`validation_failed`). The link role is at most the
        caller's own role on the node, and never `manage`. Writes `share_link.created`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShareLinkRequest'
      responses:
        '201':
          description: The share link with its token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareLinkWrite'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/share-links/{link_id}:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/LinkId'
    delete:
      tags: [sharing]
      operationId: revokeShareLink
      summary: Revoke a share link
      description: Needs `share` on the node of the link. Writes `share_link.revoked`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeOnly'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/share-links/resolve:
    post:
      tags: [sharing]
      operationId: resolveShareLink
      summary: Open a share link
      description: |
        No sign-in needed. The token is in the body, not the URL, so it does not reach logs.
        Returns the node and a short-lived access token (`typ` `share_link`, see `bearerAuth`) for
        the link's role on that subtree. An expired, revoked or unknown link, or one that the
        tenant policy no longer allows, is `404`. A wrong password is `401`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveShareLinkRequest'
      responses:
        '200':
          description: The shared node and an access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolvedShareLink'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/shared-with-me:
    get:
      tags: [sharing]
      operationId: listSharedWithMe
      summary: Shared with me
      description: |
        The roots of grants to the caller's user (directly, or through `tenant#member`), across all
        tenants where the user is a member or guest. Newest first. No `Ruum-Tenant` header. For an
        agent, only items inside its scope.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of shared items.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  # ---------------------------------------------------------------- changes
  /v1/changes:
    get:
      tags: [changes]
      operationId: listChanges
      summary: The changes feed
      description: |
        The journal of the tenant, oldest first, after `cursor`. Sync clients keep `next_cursor`
        and call again. With `wait` the call waits up to that many seconds for new entries (long
        poll). A cursor older than the journal retention fails with `410 cursor_expired`; the
        client must then do a full listing.

        Visibility is checked against the state before and after each change. An entry is sent
        when the caller could see its node before the change or can see it after it (for agents:
        inside the scope, too). So a client learns that a node left its view: a `node.moved` to a
        folder it cannot see, `node.trashed`, `node.purged`, or a `grant.removed`. Entries on
        nodes that the caller never saw are left out. A tenant-level entry (`node_id` `null`) is
        sent to members only.

        A change can also change what the caller sees of a whole subtree without an entry per
        node: a grant added or removed (also through `tenant#member`), a member link added or
        removed, a node moved into or out of a visible folder, a restore. Then the page carries a
        marker in `resync`: the client lists that subtree again (`access: gained`) or drops it
        (`access: lost`), at the position `seq` of the marker. Clients order and dedupe entries
        by `seq`, and per node by `revision`.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: cursor
          in: query
          description: The `next_cursor` of the last call. Without it the feed starts at the oldest kept entry.
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
        - name: wait
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 30
            default: 0
        - name: node
          in: query
          description: Only changes inside this folder (at any depth).
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: One page of changes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangesPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '410':
          $ref: '#/components/responses/CursorExpired'

  /v1/changes/latest:
    get:
      tags: [changes]
      operationId: getLatestCursor
      summary: The newest cursor
      description: The cursor of the newest entry, so a client can start following from now.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
      responses:
        '200':
          description: The cursor.
          content:
            application/json:
              schema:
                type: object
                required: [cursor, seq]
                properties:
                  cursor:
                    type: string
                  seq:
                    type: integer
                    format: int64
        '401':
          $ref: '#/components/responses/Unauthenticated'

  # ---------------------------------------------------------------- search
  /v1/search:
    get:
      tags: [search]
      operationId: searchNodes
      summary: Search by name
      description: Live nodes whose name contains `q` (case-insensitive) that the caller can see. Best match first.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 255
        - name: kind
          in: query
          schema:
            $ref: '#/components/schemas/NodeKind'
        - name: tag
          in: query
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: within
          in: query
          description: Only nodes inside this folder (at any depth).
          schema:
            $ref: '#/components/schemas/Uuid'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of hits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationFailed'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A platform access token, or a Ruum access token (`POST /v1/oauth/token`,
        `POST /v1/share-links/resolve`). Ruum access tokens are JWTs signed with the keys of
        `/.well-known/jwks.json`. Their claims:

        | Claim | Value |
        |---|---|
        | `iss` | the Ruum issuer, for example `https://api.ruum.space` |
        | `aud` | the API origin (`https://api.ruum.space`; `https://ruum.localhost` on the laptop) |
        | `typ` | `agent`, `user` or `share_link` |
        | `sub` | the actor: the agent ID, the user ID, or the share link ID |
        | `tid` | the tenant the token is bound to (all agent and share-link tokens) |
        | `obo` | the user an agent acts for; absent for users and share links |
        | `agent` | the agent ID (`typ` `agent`) |
        | `share_link` | the share link ID (`typ` `share_link`) |
        | `scope` | for `share_link`: `{ subtree, max_role, expires_at }` of the link |
        | `iat`, `exp`, `jti` | as in RFC 7519 |

        The API accepts a Ruum token only when `aud` is its own origin and `typ` is one of the three
        above. Tokens for providers (step 2) and apps (step 3) have another `aud` and `typ`, so they
        cannot be replayed against the API. An agent token carries no scope: the API reads the
        agent row (scope, disabled) on each request.
    sessionCookie:
      type: apiKey
      in: cookie
      name: ruum_session
      description: The web UI session. State-changing requests also need the `Ruum-Csrf` header.

  parameters:
    TenantHeader:
      name: Ruum-Tenant
      in: header
      required: false
      description: |
        The tenant of the call. Required for users (`400 bad_request` without it). Optional for
        agent and share-link tokens, which are bound to one tenant; if sent, it must match.
      schema:
        $ref: '#/components/schemas/Uuid'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        A client-chosen unique key (for example a UUID) that makes the write safe to retry. The
        server keeps the first response for 24 hours per tenant, actor and key.
      schema:
        type: string
        minLength: 8
        maxLength: 255
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: The node ETag (`"<revision>"`). The write fails with `412 precondition_failed` if the node changed.
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      description: The `next_cursor` of the previous page.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
    TenantId:
      name: tenant_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    InvitationId:
      name: invitation_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    AgentId:
      name: agent_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    KeyId:
      name: key_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    NodeId:
      name: node_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    UploadId:
      name: upload_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    VersionId:
      name: version_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    TagId:
      name: tag_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    GrantId:
      name: grant_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    LinkId:
      name: link_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    AppPasswordId:
      name: app_password_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'

  headers:
    NodeETag:
      description: The node revision as `"<revision>"`. Send it in `If-Match`.
      schema:
        type: string
    ContentETag:
      description: The content hash of the version as `"<blake3 hex>"`.
      schema:
        type: string

  responses:
    BadRequest:
      description: The request is malformed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: No valid credentials (`unauthenticated`, `token_expired`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PermissionDenied:
      description: The caller lacks the right (`permission_denied`, `scope_exceeded`, `user_required`, `agent_disabled`, `plan_limit_reached`, `quota_exceeded`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found, or not visible to the caller (`not_found`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: A conflict (`conflict`, `name_taken`, `version_mismatch`, `idempotency_key_reused`, `chunk_missing`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    CursorExpired:
      description: The cursor is older than the journal retention (`cursor_expired`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PreconditionFailed:
      description: '`If-Match` did not match (`precondition_failed`).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: The body or file is too large for the plan (`payload_too_large`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RangeNotSatisfiable:
      description: The range is outside the content (`range_not_satisfiable`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationFailed:
      description: The body or a parameter is not valid (`validation_failed`, `hash_mismatch`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Too many requests (`rate_limited`).
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    # ------------------------------------------------------------ basics
    Uuid:
      type: string
      format: uuid
      description: A UUIDv7.
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339, UTC.
    Hash:
      type: string
      pattern: '^[0-9a-f]{64}$'
      description: A BLAKE3 hash as 64 lowercase hex characters.
    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          const: ok
        version:
          type: string
    Jwks:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: object
            additionalProperties: true

    ErrorCode:
      type: string
      description: Stable, machine-readable error codes.
      enum:
        - bad_request
        - validation_failed
        - unauthenticated
        - token_expired
        - permission_denied
        - scope_exceeded
        - user_required
        - not_found
        - conflict
        - name_taken
        - version_mismatch
        - idempotency_key_reused
        - precondition_failed
        - payload_too_large
        - range_not_satisfiable
        - cursor_expired
        - quota_exceeded
        - plan_limit_reached
        - rate_limited
        - agent_disabled
        - chunk_missing
        - hash_mismatch
        - not_implemented
        - internal
        - unavailable
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              description: A short sentence for people.
            hint:
              type: string
              description: The next step, for people and agents.
      example:
        error:
          code: name_taken
          message: a node named "plan.txt" already exists in this folder
          hint: choose another name, or send on_conflict=rename

    # ------------------------------------------------------------ principals and changes
    PrincipalKind:
      type: string
      description: '`share_link` is the bearer of a share link (an edit link can upload versions).'
      enum: [user, group, app, agent, share_link]
    PrincipalRef:
      type: object
      required: [kind, id]
      properties:
        kind:
          $ref: '#/components/schemas/PrincipalKind'
        id:
          $ref: '#/components/schemas/Uuid'
        display_name:
          type: string
          description: Filled in responses when known.
    ActorPair:
      type: object
      description: Who did a change, and for whom (design section 3.4).
      required: [actor, on_behalf_of]
      properties:
        actor:
          $ref: '#/components/schemas/PrincipalRef'
        on_behalf_of:
          description: The user for whom the actor acts. `null` when the actor is the user.
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
    Change:
      type: object
      description: The change that a write made.
      required: [seq, actor, on_behalf_of, at]
      properties:
        seq:
          description: The journal sequence number, or `null` if the write made no journal entry.
          oneOf:
            - type: integer
              format: int64
            - type: 'null'
        actor:
          $ref: '#/components/schemas/PrincipalRef'
        on_behalf_of:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        at:
          $ref: '#/components/schemas/Timestamp'
    ChangeOnly:
      type: object
      required: [change]
      properties:
        change:
          $ref: '#/components/schemas/Change'
    Role:
      type: string
      description: |
        The roles of design section 3.2 (the Google Drive model), from lowest to highest. A higher
        role includes the lower ones. `share` is a permission, not a role: `manage` always has it,
        `edit` has it while the node's effective `editors_can_share` is true.
      enum: [view, comment, edit, manage]

    # ------------------------------------------------------------ auth
    LogoutResult:
      type: object
      required: [logout_url]
      properties:
        logout_url:
          type: string
          format: uri
          description: The end-session URL at the identity provider. The browser goes there next.
    User:
      type: object
      required: [id, home_tenant_id, email, email_verified, display_name, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        home_tenant_id:
          $ref: '#/components/schemas/Uuid'
        email:
          type: string
          format: email
        email_verified:
          type: boolean
          description: |
            True when a trusted provider verified the email. Only a verified email is unique
            among users, and only a verified email claims email grants and invitations.
        display_name:
          type: string
        avatar_url:
          type: [string, 'null']
          format: uri
        created_at:
          $ref: '#/components/schemas/Timestamp'
    Me:
      type: object
      required: [actor, on_behalf_of, user]
      properties:
        actor:
          $ref: '#/components/schemas/PrincipalRef'
        on_behalf_of:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        user:
          $ref: '#/components/schemas/User'
          description: The user whose rights apply (the agent's owner for an agent).
        agent:
          description: Set when the caller is an agent.
          oneOf:
            - $ref: '#/components/schemas/Agent'
            - type: 'null'
        bound_tenant_id:
          description: The tenant the token is bound to (agent tokens).
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
    Identity:
      type: object
      required: [id, issuer, subject, email_verified, linked_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        issuer:
          type: string
        subject:
          type: string
        provider:
          type: string
          description: A display name such as `google`, `microsoft`, `passkey`.
        email:
          type: [string, 'null']
        email_verified:
          type: boolean
        linked_at:
          $ref: '#/components/schemas/Timestamp'
    Session:
      type: object
      required: [id, created_at, expires_at, last_seen_at, current]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        last_seen_at:
          $ref: '#/components/schemas/Timestamp'
        user_agent:
          type: [string, 'null']
        current:
          type: boolean
          description: True for the session of this request.
    AppPassword:
      type: object
      description: |
        A password for WebDAV clients, made by a user for one tenant. It is the user: writes
        through it record the user as `actor`.
      required: [id, tenant_id, name, prefix, created_at, expires_at, last_used_at, revoked_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        tenant_id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          examples: [Finder on my laptop]
        prefix:
          type: string
          description: The first characters of the password, to recognise it.
          examples: [ruum_app_7hQ2]
        created_at:
          $ref: '#/components/schemas/Timestamp'
        expires_at:
          description: '`null` means no expiry.'
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        last_used_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        revoked_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    CreateAppPasswordRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        expires_at:
          $ref: '#/components/schemas/Timestamp'
          description: Optional. Without it the password does not expire.
    AppPasswordCreated:
      type: object
      required: [app_password, secret]
      properties:
        app_password:
          $ref: '#/components/schemas/AppPassword'
        secret:
          type: string
          description: The app password. Shown only once.
          pattern: '^ruum_app_[A-Za-z0-9_-]{43}$'
        dav_url:
          type: string
          format: uri
          description: >-
            The URL to mount in a WebDAV client: the root of the WebDAV host, for example
            `https://dav.ruum.space/`. Guests and agents with a scope mount the folder they can
            see below it.
          examples: ['https://dav.ruum.space/']

    # ------------------------------------------------------------ tenants
    TenantKind:
      type: string
      enum: [personal, team]
    Plan:
      type: string
      enum: [free, personal, team]
    MemberRole:
      type: string
      description: The role in a tenant. A guest sees only what is shared with them.
      enum: [guest, member, admin, owner]
    TenantPolicy:
      type: object
      description: |
        What the tenant allows (design section 4.1). Stored in `tenants.settings`. Allowed
        identity providers and retention overrides come later.
      properties:
        allow_share_links:
          type: boolean
          default: true
          description: Share links may be made. When it turns off, existing links stop working.
        allow_edit_links:
          type: boolean
          default: false
          description: Share links may have the role `edit`.
        share_link_max_days:
          type: [integer, 'null']
          minimum: 1
          default: null
          description: When set, every share link needs an expiry at most this many days ahead.
        allow_guests:
          type: boolean
          default: true
          description: Grants and invitations to people outside the tenant are allowed.
        members_can_share:
          type: boolean
          default: true
          description: |
            Team tenants: members manage the team tree through the team root, and while this is
            true they also have the `share` permission there (the tuple
            `tenant:<id>#members_can_share@user:*`). When false, members share only where a grant
            gives them `manage`, or `edit` with `editors_can_share`; owners and admins always share.
    Tenant:
      type: object
      required: [id, name, kind, plan, region, root_node_id, policy, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        kind:
          $ref: '#/components/schemas/TenantKind'
        plan:
          $ref: '#/components/schemas/Plan'
        region:
          type: string
          examples: [hel1]
        root_node_id:
          $ref: '#/components/schemas/Uuid'
        policy:
          $ref: '#/components/schemas/TenantPolicy'
        created_at:
          $ref: '#/components/schemas/Timestamp'
    TenantMembership:
      type: object
      required: [tenant, role]
      properties:
        tenant:
          $ref: '#/components/schemas/Tenant'
        role:
          $ref: '#/components/schemas/MemberRole'
    CreateTenantRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
    UpdateTenantRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        policy:
          $ref: '#/components/schemas/TenantPolicy'
          description: Fields that are left out keep their value.
    Member:
      type: object
      required: [tenant_id, user_id, email, display_name, role, joined_at]
      properties:
        tenant_id:
          $ref: '#/components/schemas/Uuid'
        user_id:
          $ref: '#/components/schemas/Uuid'
        email:
          type: string
        display_name:
          type: string
        role:
          $ref: '#/components/schemas/MemberRole'
        joined_at:
          $ref: '#/components/schemas/Timestamp'
    MemberPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Member'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
    CreateInvitationRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum: [guest, member, admin]
        message:
          type: string
          maxLength: 1000
    Invitation:
      type: object
      required: [id, tenant_id, email, role, invited_by, created_at, expires_at, accepted_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        tenant_id:
          $ref: '#/components/schemas/Uuid'
        email:
          type: string
        role:
          $ref: '#/components/schemas/MemberRole'
        invited_by:
          $ref: '#/components/schemas/ActorPair'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        accepted_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    InvitationPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Invitation'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
    Limits:
      type: object
      description: The limits of the plan (design section 4.3). `null` means no limit.
      required: [storage_bytes, max_file_bytes, version_days, version_count, trash_days, admin_restore_days, agents, members]
      properties:
        storage_bytes:
          type: integer
          format: int64
        max_file_bytes:
          type: integer
          format: int64
        version_days:
          type: [integer, 'null']
        version_count:
          type: [integer, 'null']
        trash_days:
          type: integer
          description: How long members see a node in the trash and can restore it.
        admin_restore_days:
          type: integer
          description: How long tenant admins can restore a trashed node (60 on team plans; equal to `trash_days` otherwise). The node is purged after this.
        agents:
          type: integer
        members:
          type: [integer, 'null']
    Usage:
      type: object
      required: [storage_bytes, nodes, agents, members]
      properties:
        storage_bytes:
          type: integer
          format: int64
        nodes:
          type: integer
          format: int64
        agents:
          type: integer
        members:
          type: integer
    LimitsAndUsage:
      type: object
      required: [plan, limits, usage]
      properties:
        plan:
          $ref: '#/components/schemas/Plan'
        limits:
          $ref: '#/components/schemas/Limits'
        usage:
          $ref: '#/components/schemas/Usage'

    # ------------------------------------------------------------ agents
    Budget:
      type: object
      description: A budget with a hard stop (design section 11). `null` means the plan default.
      properties:
        max_storage_bytes:
          type: [integer, 'null']
          format: int64
        max_writes_per_hour:
          type: [integer, 'null']
    AgentScope:
      type: object
      description: |
        What the agent may touch. The agent's right is the user's right intersected with this
        scope: inside `subtree` only, roles up to `max_role`, until `expires_at`.
      required: [subtree, max_role]
      properties:
        subtree:
          description: The folder the agent may touch. `null` means everything the user can reach in the tenant.
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        max_role:
          $ref: '#/components/schemas/Role'
          description: |
            The highest role the agent may use. The `share` permission follows it: with `manage`
            the agent shares where its user may; with `edit` only where its user may and the
            node's effective `editors_can_share` is true; below `edit` never.
        expires_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        budget:
          $ref: '#/components/schemas/Budget'
    Agent:
      type: object
      required: [id, tenant_id, owner_id, name, description, scope, disabled_at, created_at, last_used_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        tenant_id:
          $ref: '#/components/schemas/Uuid'
        owner_id:
          $ref: '#/components/schemas/Uuid'
          description: The user the agent acts for.
        name:
          type: string
        description:
          type: [string, 'null']
        scope:
          $ref: '#/components/schemas/AgentScope'
        disabled_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        disabled_reason:
          type: [string, 'null']
          enum: [by_owner, by_admin, owner_left, null]
        created_at:
          $ref: '#/components/schemas/Timestamp'
        last_used_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    AgentPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Agent'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
    RegisterAgentRequest:
      type: object
      required: [name, scope]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        scope:
          $ref: '#/components/schemas/AgentScope'
    UpdateAgentRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: [string, 'null']
          maxLength: 1000
        scope:
          $ref: '#/components/schemas/AgentScope'
    AgentKey:
      type: object
      required: [id, agent_id, name, prefix, created_at, expires_at, last_used_at, revoked_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        agent_id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: [string, 'null']
        prefix:
          type: string
          description: The first characters of the key, to recognise it.
          examples: [ruum_agent_3fK9]
        created_at:
          $ref: '#/components/schemas/Timestamp'
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        last_used_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        revoked_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    CreateAgentKeyRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        expires_at:
          $ref: '#/components/schemas/Timestamp'
          description: Default 90 days from now; at most 1 year.
    AgentKeyCreated:
      type: object
      required: [key, secret]
      properties:
        key:
          $ref: '#/components/schemas/AgentKey'
        secret:
          type: string
          description: The API key. Shown only once.
          pattern: '^ruum_agent_[A-Za-z0-9_-]{43}$'
    TokenRequest:
      description: The body of the token endpoint, by `grant_type`.
      oneOf:
        - $ref: '#/components/schemas/AuthorizationCodeGrant'
        - $ref: '#/components/schemas/RefreshTokenGrant'
        - $ref: '#/components/schemas/TokenExchangeRequest'
      discriminator:
        propertyName: grant_type
        mapping:
          authorization_code: '#/components/schemas/AuthorizationCodeGrant'
          refresh_token: '#/components/schemas/RefreshTokenGrant'
          urn:ietf:params:oauth:grant-type:token-exchange: '#/components/schemas/TokenExchangeRequest'
    AuthorizationCodeGrant:
      type: object
      required: [grant_type, code, code_verifier, client_id, redirect_uri]
      properties:
        grant_type:
          type: string
          const: authorization_code
        code:
          type: string
        code_verifier:
          type: string
          minLength: 43
          maxLength: 128
        client_id:
          type: string
        redirect_uri:
          type: string
          format: uri
        resource:
          type: string
          format: uri
    RefreshTokenGrant:
      type: object
      required: [grant_type, refresh_token, client_id]
      properties:
        grant_type:
          type: string
          const: refresh_token
        refresh_token:
          type: string
        client_id:
          type: string
        resource:
          type: string
          format: uri
    TokenExchangeRequest:
      type: object
      required: [grant_type, subject_token, subject_token_type]
      properties:
        grant_type:
          type: string
          const: urn:ietf:params:oauth:grant-type:token-exchange
        subject_token:
          type: string
          description: The agent API key.
        subject_token_type:
          type: string
          const: urn:ruum:params:oauth:token-type:api-key
    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          description: Seconds. 900 by default.
        refresh_token:
          type: string
          description: Only for `authorization_code` and `refresh_token`. Opaque; stored as a hash.
        issued_token_type:
          type: string
          const: urn:ietf:params:oauth:token-type:access_token
          description: Only for token exchange.
        scope:
          type: string
    OAuthError:
      type: object
      description: The OAuth error body (RFC 6749 section 5.2, RFC 7591 section 3.2.2), used only by the OAuth endpoints.
      required: [error]
      properties:
        error:
          type: string
          examples: [invalid_grant, invalid_client, invalid_request, unsupported_grant_type, invalid_redirect_uri, invalid_client_metadata]
        error_description:
          type: string
        ruum_code:
          $ref: '#/components/schemas/ErrorCode'
    OAuthClientRegistration:
      type: object
      required: [client_name, redirect_uris]
      properties:
        client_name:
          type: string
          minLength: 1
          maxLength: 100
        redirect_uris:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: string
            format: uri
        grant_types:
          type: array
          items:
            type: string
            enum: [authorization_code, refresh_token]
          default: [authorization_code, refresh_token]
        response_types:
          type: array
          items:
            type: string
            const: code
        token_endpoint_auth_method:
          type: string
          const: none
          default: none
        client_uri:
          type: string
          format: uri
        logo_uri:
          type: string
          format: uri
        software_id:
          type: string
        software_version:
          type: string
    OAuthClient:
      type: object
      required: [client_id, client_id_issued_at, client_name, redirect_uris, grant_types, response_types, token_endpoint_auth_method]
      properties:
        client_id:
          type: string
        client_id_issued_at:
          type: integer
          format: int64
          description: Seconds since the epoch.
        client_name:
          type: string
        redirect_uris:
          type: array
          items:
            type: string
            format: uri
        grant_types:
          type: array
          items:
            type: string
        response_types:
          type: array
          items:
            type: string
        token_endpoint_auth_method:
          type: string
          const: none
        client_uri:
          type: [string, 'null']
          format: uri
        logo_uri:
          type: [string, 'null']
          format: uri
    OAuthConsentRequest:
      type: object
      description: Give `agent_id` to bind an existing agent, or `new_agent` to create one; not both. Only `approve` and `request` are needed for a denial.
      required: [request, approve]
      properties:
        request:
          type: string
          description: The `request` value of the consent screen URL.
        approve:
          type: boolean
        tenant_id:
          $ref: '#/components/schemas/Uuid'
        agent_id:
          $ref: '#/components/schemas/Uuid'
        new_agent:
          $ref: '#/components/schemas/RegisterAgentRequest'
    ProtectedResourceMetadata:
      type: object
      description: RFC 9728.
      required: [resource, authorization_servers]
      properties:
        resource:
          type: string
          format: uri
          examples: [https://api.ruum.space]
        authorization_servers:
          type: array
          items:
            type: string
            format: uri
        bearer_methods_supported:
          type: array
          items:
            type: string
        resource_documentation:
          type: string
          format: uri
    AuthorizationServerMetadata:
      type: object
      description: RFC 8414.
      required: [issuer, authorization_endpoint, token_endpoint, registration_endpoint, response_types_supported, grant_types_supported, code_challenge_methods_supported, token_endpoint_auth_methods_supported]
      properties:
        issuer:
          type: string
          format: uri
        authorization_endpoint:
          type: string
          format: uri
        token_endpoint:
          type: string
          format: uri
        registration_endpoint:
          type: string
          format: uri
        jwks_uri:
          type: string
          format: uri
        response_types_supported:
          type: array
          items:
            type: string
        grant_types_supported:
          type: array
          items:
            type: string
        code_challenge_methods_supported:
          type: array
          items:
            type: string
        token_endpoint_auth_methods_supported:
          type: array
          items:
            type: string
        scopes_supported:
          type: array
          items:
            type: string
    UndoRequest:
      type: object
      description: Give `since` (and optionally `until`), or `seqs`.
      required: [dry_run]
      properties:
        since:
          $ref: '#/components/schemas/Timestamp'
        until:
          $ref: '#/components/schemas/Timestamp'
          description: Default is now.
        seqs:
          type: array
          description: Only these journal entries of the agent (partial undo).
          minItems: 1
          maxItems: 1000
          items:
            type: integer
            format: int64
        dry_run:
          type: boolean
          description: When true, only report what would be reverted.
    UndoItem:
      type: object
      required: [seq, node_id, type, reason]
      properties:
        seq:
          type: integer
          format: int64
        node_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        type:
          $ref: '#/components/schemas/EventType'
        reason:
          type: [string, 'null']
          enum: [changed_later, irreversible, permission_denied, null]
          description: Why the change was skipped. `null` for reverted entries.
    UndoReport:
      type: object
      required: [dry_run, reverted, skipped, change]
      properties:
        dry_run:
          type: boolean
        reverted:
          type: array
          items:
            $ref: '#/components/schemas/UndoItem'
        skipped:
          type: array
          items:
            $ref: '#/components/schemas/UndoItem'
        change:
          description: The last change of the undo. `null` for a dry run.
          oneOf:
            - $ref: '#/components/schemas/Change'
            - type: 'null'

    # ------------------------------------------------------------ nodes
    NextCursor:
      description: The cursor of the next page, or `null` on the last page.
      type: [string, 'null']
    NodeKind:
      type: string
      enum: [folder, file, link, typed]
    LinkKind:
      type: string
      description: '`shortcut` gives no access; `member` gives `view` to people who can see the folder that holds the link.'
      enum: [shortcut, member]
    OnConflict:
      type: string
      description: What to do when the name is taken. `rename` adds " (2)", " (3)", ... before the extension.
      enum: [fail, rename]
      default: fail
    NodeName:
      type: string
      minLength: 1
      maxLength: 255
      description: |
        The server stores names in Unicode NFC, and `maxLength` counts characters (code points)
        after NFC, in every layer. Names are case-preserving but unique case-insensitively among
        the live children of a folder (`Plan.txt` and `plan.txt` clash), as WebDAV, macOS and
        Windows clients expect. No `/`, no NUL, not `.` or `..`, no leading or trailing spaces.
    Node:
      type: object
      required: [id, tenant_id, parent_id, name, kind, type, link_kind, link_target, head_version, owner_id, size_bytes, revision, trashed_at, created_at, updated_at, created_by, updated_by]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        tenant_id:
          $ref: '#/components/schemas/Uuid'
        parent_id:
          description: '`null` only for the root folder.'
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        name:
          type: string
        kind:
          $ref: '#/components/schemas/NodeKind'
        type:
          type: [string, 'null']
          description: The MIME type of a file; `album`, `project`, ... for a folder; the provider type of a typed node.
        link_kind:
          oneOf:
            - $ref: '#/components/schemas/LinkKind'
            - type: 'null'
        link_target:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        head_version:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        owner_id:
          $ref: '#/components/schemas/Uuid'
          description: The user who created the node (for the owner of a personal tree, the owner). Only for display and accounting; it gives no rights.
        size_bytes:
          type: integer
          format: int64
        revision:
          type: integer
          format: int64
          description: Grows on each change of the node. The ETag is `"<revision>"`.
        trashed_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        created_by:
          $ref: '#/components/schemas/ActorPair'
        updated_by:
          $ref: '#/components/schemas/ActorPair'
        my_role:
          description: |
            The caller's effective role on this node (after the agent or link scope), so the UI and
            agents know what they may do. Set in responses of node reads and writes when known.
          oneOf:
            - $ref: '#/components/schemas/Role'
            - type: 'null'
        my_can_share:
          type: boolean
          description: |
            Whether the caller has the `share` permission on this node (after the agent or link
            scope): may change grants and share links. Set when `my_role` is set.
        editors_can_share:
          type: [boolean, 'null']
          description: |
            The sharing setting of this node: whether editors may share it (Google Drive:
            "Editors can change permissions and share"). `null` inherits the value of the parent;
            the root inherits the default, `true`. Changed with `updateNodeSharing`.
        editors_can_share_effective:
          type: boolean
          description: The value of `editors_can_share` after inheritance. Set in node reads when known.
    NodePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Node'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
    NodeWrite:
      type: object
      required: [node, change]
      properties:
        node:
          $ref: '#/components/schemas/Node'
        change:
          $ref: '#/components/schemas/Change'
    CreateNodeRequest:
      type: object
      required: [parent_id, name, kind]
      properties:
        parent_id:
          $ref: '#/components/schemas/Uuid'
        name:
          $ref: '#/components/schemas/NodeName'
        kind:
          type: string
          enum: [folder, file, link]
        type:
          type: string
          description: A MIME type for a file, or a folder type such as `album` or `project`.
        link:
          description: Required when `kind` is `link`. The target must be in the same tenant.
          type: object
          required: [kind, target]
          properties:
            kind:
              $ref: '#/components/schemas/LinkKind'
            target:
              $ref: '#/components/schemas/Uuid'
        on_conflict:
          $ref: '#/components/schemas/OnConflict'
    RenameRequest:
      type: object
      required: [name]
      properties:
        name:
          $ref: '#/components/schemas/NodeName'
        on_conflict:
          $ref: '#/components/schemas/OnConflict'
    MoveRequest:
      type: object
      required: [parent_id]
      properties:
        parent_id:
          $ref: '#/components/schemas/Uuid'
        name:
          $ref: '#/components/schemas/NodeName'
          description: A new name at the same time. Default is the current name.
        on_conflict:
          $ref: '#/components/schemas/OnConflict'
    CopyRequest:
      type: object
      required: [parent_id]
      properties:
        parent_id:
          $ref: '#/components/schemas/Uuid'
        name:
          $ref: '#/components/schemas/NodeName'
        on_conflict:
          $ref: '#/components/schemas/OnConflict'
    RestoreRequest:
      type: object
      properties:
        parent_id:
          $ref: '#/components/schemas/Uuid'
          description: Where to restore when the old parent is gone or trashed.
        on_conflict:
          $ref: '#/components/schemas/OnConflict'

    # ------------------------------------------------------------ uploads
    ChunkRef:
      type: object
      required: [hash, size]
      properties:
        hash:
          $ref: '#/components/schemas/Hash'
        size:
          type: integer
          minimum: 1
          maximum: 4194304
    ChunkingParams:
      type: object
      required: [id, algorithm, min_size, avg_size, max_size]
      properties:
        id:
          type: string
          description: A stable name of this parameter set.
          examples: [fastcdc-2020-1m-2m-4m, fastcdc-2020-16k-32k-64k]
        algorithm:
          type: string
          const: fastcdc-2020
        min_size:
          type: integer
          examples: [1048576]
        avg_size:
          type: integer
          examples: [2097152]
        max_size:
          type: integer
          examples: [4194304]
    UploadTarget:
      description: Where the upload goes.
      oneOf:
        - $ref: '#/components/schemas/UploadTargetNewVersion'
        - $ref: '#/components/schemas/UploadTargetNewFile'
      discriminator:
        propertyName: target
        mapping:
          new_version: '#/components/schemas/UploadTargetNewVersion'
          new_file: '#/components/schemas/UploadTargetNewFile'
    UploadTargetNewVersion:
      type: object
      description: A new version of an existing file.
      required: [target, node_id]
      properties:
        target:
          type: string
          const: new_version
        node_id:
          $ref: '#/components/schemas/Uuid'
        base_version:
          description: Fail with `version_mismatch` at completion if the head is no longer this version.
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
    UploadTargetNewFile:
      type: object
      description: A new file in a folder.
      required: [target, parent_id, name]
      properties:
        target:
          type: string
          const: new_file
        parent_id:
          $ref: '#/components/schemas/Uuid'
        name:
          $ref: '#/components/schemas/NodeName'
        on_conflict:
          $ref: '#/components/schemas/OnConflict'
    CreateUploadRequest:
      allOf:
        - $ref: '#/components/schemas/UploadTarget'
        - type: object
          required: [size, content_hash, chunking, chunks]
          properties:
            content_type:
              type: string
            chunking:
              type: string
              description: The `id` of the chunking parameters the client used (from `getChunkingParams`).
            size:
              type: integer
              format: int64
              minimum: 0
            content_hash:
              $ref: '#/components/schemas/Hash'
            chunks:
              type: array
              description: The chunks in order. Empty for an empty file.
              items:
                $ref: '#/components/schemas/ChunkRef'
    Upload:
      allOf:
        - $ref: '#/components/schemas/UploadTarget'
        - type: object
          required: [id, tenant_id, size, content_hash, chunks, missing, status, chunking, expires_at, created_by]
          properties:
            id:
              $ref: '#/components/schemas/Uuid'
            tenant_id:
              $ref: '#/components/schemas/Uuid'
            content_type:
              type: [string, 'null']
            size:
              type: integer
              format: int64
            content_hash:
              $ref: '#/components/schemas/Hash'
            chunks:
              type: array
              items:
                $ref: '#/components/schemas/ChunkRef'
            missing:
              type: array
              description: The chunk hashes that the server does not have yet. Upload only these.
              items:
                $ref: '#/components/schemas/Hash'
            status:
              type: string
              enum: [open, completed, aborted, expired]
            chunking:
              $ref: '#/components/schemas/ChunkingParams'
            expires_at:
              $ref: '#/components/schemas/Timestamp'
            created_by:
              $ref: '#/components/schemas/ActorPair'
    ContentUrl:
      type: object
      required: [url, expires_at, version_id]
      properties:
        url:
          type: string
          format: uri
          examples: ['https://0190b6c4-5f3e-7cc1-9a4b-1f2e3d4c5b6a.content.ruumapps.net/c/eyJhbGciOi...']
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        version_id:
          $ref: '#/components/schemas/Uuid'
    ContentWrite:
      type: object
      required: [node, version, change]
      properties:
        node:
          $ref: '#/components/schemas/Node'
        version:
          $ref: '#/components/schemas/Version'
        change:
          $ref: '#/components/schemas/Change'

    # ------------------------------------------------------------ versions
    Version:
      type: object
      required: [id, tenant_id, node_id, size_bytes, content_hash, content_type, restored_from, label, actor, on_behalf_of, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        tenant_id:
          $ref: '#/components/schemas/Uuid'
        node_id:
          $ref: '#/components/schemas/Uuid'
        size_bytes:
          type: integer
          format: int64
        content_hash:
          $ref: '#/components/schemas/Hash'
        content_type:
          type: [string, 'null']
        restored_from:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        label:
          type: [string, 'null']
          description: The name of a named version, for example "Before import". Kept forever.
        actor:
          $ref: '#/components/schemas/PrincipalRef'
        on_behalf_of:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
    VersionPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Version'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
    VersionWrite:
      type: object
      required: [version, change]
      properties:
        version:
          $ref: '#/components/schemas/Version'
        change:
          $ref: '#/components/schemas/Change'
    LabelRequest:
      type: object
      required: [label]
      properties:
        label:
          type: [string, 'null']
          minLength: 1
          maxLength: 200
    DiffChangeKind:
      type: string
      enum: [insert, delete, modify, move, format, replace]
    DiffChange:
      type: object
      description: One change. `path` is stable inside a format, so comments can point at it.
      required: [kind]
      properties:
        kind:
          $ref: '#/components/schemas/DiffChangeKind'
        path:
          type: string
          examples: ['body/p[14]', 'lines/120-124', '$.dependencies.serde']
        label:
          type: string
          description: A label for people, for example "Section 4.2, paragraph 3".
        old:
          type: string
        new:
          type: string
        change:
          type: string
          description: A description of a format change, for example "bold on".
        detail:
          type: array
          items:
            $ref: '#/components/schemas/DiffChange'
    DiffSummary:
      type: object
      required: [inserted, deleted, modified, moved]
      properties:
        inserted:
          type: integer
        deleted:
          type: integer
        modified:
          type: integer
        moved:
          type: integer
    DiffResult:
      type: object
      description: The one change model of all diff plugins (design section 5.4).
      required: [plugin, summary, changes, truncated]
      properties:
        plugin:
          type: string
          description: '`name@version` of the plugin.'
          examples: [text@1.0.0]
        from:
          $ref: '#/components/schemas/Uuid'
        to:
          $ref: '#/components/schemas/Uuid'
        summary:
          $ref: '#/components/schemas/DiffSummary'
        changes:
          type: array
          items:
            $ref: '#/components/schemas/DiffChange'
        render:
          type: object
          properties:
            html:
              type: string
              description: A URL of a rendered HTML view of the diff.
        truncated:
          type: boolean
          description: True when the plugin stopped early because of size or time limits.
      example:
        plugin: text@1.0.0
        summary: { inserted: 1, deleted: 0, modified: 1, moved: 0 }
        changes:
          - kind: modify
            path: lines/14
            old: Payment within 30 days.
            new: Payment within 14 days.
            detail:
              - { kind: replace, old: '30', new: '14' }
        truncated: false
    DiffPluginInfo:
      type: object
      required: [name, version, priority]
      properties:
        name:
          type: string
          examples: [text, json, xml, image, binary]
        version:
          type: string
        priority:
          type: integer

    # ------------------------------------------------------------ tags
    TagColor:
      type: string
      pattern: '^#[0-9a-fA-F]{6}$'
    Tag:
      type: object
      required: [id, tenant_id, name, color, created_by, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        tenant_id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        color:
          oneOf:
            - $ref: '#/components/schemas/TagColor'
            - type: 'null'
        created_by:
          $ref: '#/components/schemas/ActorPair'
        created_at:
          $ref: '#/components/schemas/Timestamp'
    TagPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
    TagWrite:
      type: object
      required: [tag, change]
      properties:
        tag:
          $ref: '#/components/schemas/Tag'
        change:
          $ref: '#/components/schemas/Change'
    CreateTagRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        color:
          $ref: '#/components/schemas/TagColor'
    UpdateTagRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        color:
          oneOf:
            - $ref: '#/components/schemas/TagColor'
            - type: 'null'

    # ------------------------------------------------------------ sharing
    Grantee:
      description: Who gets the role.
      oneOf:
        - $ref: '#/components/schemas/GranteeUser'
        - $ref: '#/components/schemas/GranteeEmail'
        - $ref: '#/components/schemas/GranteeTenantMembers'
      discriminator:
        propertyName: type
        mapping:
          user: '#/components/schemas/GranteeUser'
          email: '#/components/schemas/GranteeEmail'
          tenant_members: '#/components/schemas/GranteeTenantMembers'
    GranteeUser:
      type: object
      description: A user by ID (a member or a guest).
      required: [type, id]
      properties:
        type:
          type: string
          const: user
        id:
          $ref: '#/components/schemas/Uuid'
        display_name:
          type: string
          description: Filled in responses.
        email:
          type: string
          description: Filled in responses.
    GranteeEmail:
      type: object
      description: >-
        A person by email. A person who is not a member becomes a guest only when the invitation
        is accepted or the verified email claims it (see `addGrant`).
      required: [type, email]
      properties:
        type:
          type: string
          const: email
        email:
          type: string
          format: email
    GranteeTenantMembers:
      type: object
      description: Everybody in the tenant of the node (`tenant#member`).
      required: [type]
      properties:
        type:
          type: string
          const: tenant_members
    Grant:
      type: object
      required: [id, node_id, grantee, role, inherited_from, created_by, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        node_id:
          $ref: '#/components/schemas/Uuid'
        grantee:
          $ref: '#/components/schemas/Grantee'
        role:
          $ref: '#/components/schemas/Role'
        inherited_from:
          description: The ancestor that holds the grant, or `null` for a direct grant.
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        created_by:
          $ref: '#/components/schemas/ActorPair'
        created_at:
          $ref: '#/components/schemas/Timestamp'
    GrantPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Grant'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
    AddGrantRequest:
      type: object
      required: [grantee, role]
      properties:
        grantee:
          $ref: '#/components/schemas/Grantee'
        role:
          $ref: '#/components/schemas/Role'
        notify:
          type: boolean
          default: true
          description: Send an email to the grantee.
        message:
          type: string
          maxLength: 1000
    GrantWrite:
      type: object
      required: [grant, change]
      properties:
        grant:
          $ref: '#/components/schemas/Grant'
        change:
          $ref: '#/components/schemas/Change'
    UpdateNodeSharingRequest:
      type: object
      required: [editors_can_share]
      properties:
        editors_can_share:
          type: [boolean, 'null']
          description: '`true`, `false`, or `null` to inherit from the parent.'
    ShareLink:
      type: object
      required: [id, node_id, role, expires_at, has_password, created_by, created_at, revoked_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        node_id:
          $ref: '#/components/schemas/Uuid'
        role:
          $ref: '#/components/schemas/ShareLinkRole'
        token:
          type: string
          description: The secret. Only in the create response; stored as a hash.
        url:
          type: string
          format: uri
          description: The link to give to people. Only in the create response.
        expires_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        has_password:
          type: boolean
        created_by:
          $ref: '#/components/schemas/ActorPair'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        revoked_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    CreateShareLinkRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/ShareLinkRole'
          description: '`edit` only when the tenant policy has `allow_edit_links`.'
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        password:
          type: string
          minLength: 8
          maxLength: 200
    ShareLinkRole:
      type: string
      description: The roles a share link can have. Never `manage`, and a link never has the `share` permission.
      enum: [view, comment, edit]
    ShareLinkPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ShareLink'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
    ShareLinkWrite:
      type: object
      required: [share_link, change]
      properties:
        share_link:
          $ref: '#/components/schemas/ShareLink'
        change:
          $ref: '#/components/schemas/Change'
    ResolveShareLinkRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
        password:
          type: string
    ResolvedShareLink:
      type: object
      required: [tenant_id, node, role, access_token, expires_in]
      properties:
        tenant_id:
          $ref: '#/components/schemas/Uuid'
        node:
          $ref: '#/components/schemas/Node'
        role:
          $ref: '#/components/schemas/ShareLinkRole'
        access_token:
          type: string
          description: A bearer token for this node and its subtree with `role`.
        expires_in:
          type: integer
    SharedItem:
      type: object
      required: [node, role, shared_by, shared_at]
      properties:
        node:
          $ref: '#/components/schemas/Node'
        role:
          $ref: '#/components/schemas/Role'
        shared_by:
          $ref: '#/components/schemas/ActorPair'
        shared_at:
          $ref: '#/components/schemas/Timestamp'
    SharedPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SharedItem'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'

    # ------------------------------------------------------------ journal
    EventType:
      type: string
      description: The journal event types of step 1. Payloads are in `contracts/events/`.
      enum:
        - node.created
        - node.renamed
        - node.moved
        - node.copied
        - node.trashed
        - node.restored
        - node.purged
        - version.created
        - version.restored
        - version.labeled
        - tag.attached
        - tag.detached
        - grant.added
        - grant.updated
        - grant.removed
        - share_link.created
        - share_link.revoked
        - node.sharing_updated
    JournalEntry:
      type: object
      description: One change. The envelope is `contracts/events/journal-entry.schema.json`; `data` follows `contracts/events/<type>.schema.json`.
      required: [tenant_id, seq, node_id, revision, type, actor, on_behalf_of, at, data]
      properties:
        tenant_id:
          $ref: '#/components/schemas/Uuid'
        seq:
          type: integer
          format: int64
        node_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        revision:
          description: The revision of the node after the change, or `null` when the entry has no node or the node is purged.
          oneOf:
            - type: integer
              format: int64
            - type: 'null'
        type:
          $ref: '#/components/schemas/EventType'
        actor:
          $ref: '#/components/schemas/PrincipalRef'
        on_behalf_of:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        at:
          $ref: '#/components/schemas/Timestamp'
        data:
          type: object
          additionalProperties: true
    JournalPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/JournalEntry'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
    ResyncMarker:
      type: object
      description: The caller's access to a subtree changed at `seq`, without one entry per node.
      required: [seq, node_id, access]
      properties:
        seq:
          type: integer
          format: int64
          description: The entry that caused the change. Apply the marker after the entries up to this `seq`.
        node_id:
          $ref: '#/components/schemas/Uuid'
          description: The root of the subtree.
        access:
          type: string
          enum: [gained, lost]
          description: '`gained`: list the subtree again. `lost`: drop it from the local copy.'
    ChangesPage:
      type: object
      required: [items, resync, next_cursor, has_more]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/JournalEntry'
        resync:
          type: array
          description: Per-caller markers for this page, ordered by `seq`. Often empty.
          items:
            $ref: '#/components/schemas/ResyncMarker'
        next_cursor:
          type: string
          description: Always set. Keep it and pass it to the next call, also when `items` is empty.
        has_more:
          type: boolean
          description: True when more entries are ready now.

    # ------------------------------------------------------------ audit
    AuditEntry:
      type: object
      required: [id, action, actor, on_behalf_of, target_type, target_id, at, data]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        action:
          type: string
          description: A dotted action name.
          examples: [auth.login, agent.key_created, member.removed, grant.added]
        actor:
          $ref: '#/components/schemas/PrincipalRef'
        on_behalf_of:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        target_type:
          type: [string, 'null']
        target_id:
          type: [string, 'null']
        ip:
          type: [string, 'null']
        user_agent:
          type: [string, 'null']
        at:
          $ref: '#/components/schemas/Timestamp'
        data:
          type: object
          additionalProperties: true
    AuditPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'

    # ------------------------------------------------------------ search
    SearchHit:
      type: object
      required: [node, path]
      properties:
        node:
          $ref: '#/components/schemas/Node'
        path:
          type: string
          examples: [/Projects/Garden/plan.txt]
    SearchPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SearchHit'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
