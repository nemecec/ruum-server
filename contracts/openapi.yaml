      description: |
        The secrets that the live manifest and the open previews name, with their kind
        (`generated`, `entered`; `connection` later, design 9.9), whether a value is set, and
        when it was set or rotated. Values are write-only (OpenBao): no operation returns them.
        Needs `edit`.
      responses:
        '200':
          description: The secrets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppSecretList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
