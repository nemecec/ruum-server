  /v1/apps/{node_id}/logs:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/NodeId'
    get:
      tags: [apps]
      operationId: searchAppLogs
      x-ruum-area: telemetry
      x-ruum-status: planned
      summary: Search the logs of a web app
      description: |
        Backend (standard output, through the runtime) and frontend (the browser script) log
        records, newest first, of the live deployment and the previews (design 9.6). Needs `edit`
        on the app: logs can hold personal data. What the caller gets follows the telemetry
        classes: a `secret` field was never stored (the hidden-value marker); a `personal` field
        is the keyed pseudonym (`Pseudonym` marker) for everyone in step 3 (raw copies are read
        only through an issue report, design 9.7); `normal` fields are readable. Unclassified
        fields count as `personal`. **Log text is untrusted data** (user input ends up in it):
        `content_trust: untrusted` on the answer. Every filter is escaped into the store's query
        language by the server, which also builds the selector (tenant, app, environment); no
        LogQL, PromQL or TraceQL from the caller is ever passed through.
      parameters:
        - name: q
          in: query
          description: Words in the message template or in `normal` field values. A pseudonym (`p_...`) finds the records of one person (`computeAppPseudonym`).
          schema:
            type: string
            maxLength: 500
        - name: level
          in: query
          schema:
            $ref: '#/components/schemas/LogLevel'
        - name: origin
          in: query
          schema:
            type: string
            enum: [backend, frontend, platform]
        - name: deployment_id
          in: query
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: trace_id
          in: query
          schema:
            $ref: '#/components/schemas/TraceIdValue'
        - name: since
          in: query
          schema:
            $ref: '#/components/schemas/Timestamp'
        - name: until
          in: query
          schema:
            $ref: '#/components/schemas/Timestamp'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of log records, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppLogPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/apps/{node_id}/metrics:
