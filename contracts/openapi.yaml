          $ref: '#/components/schemas/TemplateKind'
        source:
          type: string
          enum: [gallery, tenant]
        name:
          x-ruum-content-trust: untrusted
          type: string
        description:
          x-ruum-content-trust: untrusted
          type: string
        version:
          type: string
          description: The template version (a gallery release such as `1.2.0`, or the version ID of the tenant template's `template.yaml`).
        node_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        manifest:
          type: object
          description: The parsed `template.yaml` (`contracts/manifests/template.schema.json`).
          additionalProperties: true
    TemplatePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Template'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
    TemplateWrite:
      type: object
      required: [template, change]
      properties:
        template:
          $ref: '#/components/schemas/Template'
        change:
          $ref: '#/components/schemas/Change'
    CreateTemplateRequest:
      type: object
      required: [parent_id, name, kind]
      properties:
        parent_id:
          $ref: '#/components/schemas/Uuid'
        name:
          $ref: '#/components/schemas/NodeName'
        kind:
          $ref: '#/components/schemas/TemplateKind'
        description:
          type: string
          maxLength: 1000
        source_id:
          description: '`project`: the project folder to save as a template.'
