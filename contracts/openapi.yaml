          description: The decided approval.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppApproval'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
