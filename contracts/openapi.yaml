              id:
                $ref: '#/components/schemas/Uuid'
              fields:
                type: array
                items:
                  type: object
                  required: [field, state]
                  properties:
                    field:
                      type: string
                    state:
                      type: string
                      enum: [pending, allowed, refused]
              reason:
                type: string
              created_at:
                $ref: '#/components/schemas/Timestamp'
        raw_copy_until:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    DecideIssueRevealRequest:
      type: object
      required: [token, fields]
      properties:
        token:
          type: string
          minLength: 20
          maxLength: 200
        request_id:
          description: The request answered; missing when the reporter changes an earlier choice.
