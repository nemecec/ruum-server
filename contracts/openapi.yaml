  /v1/apps/{node_id}/secrets/{secret_name}:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/NodeId'
      - $ref: '#/components/parameters/SecretName'
    put:
      tags: [apps]
      operationId: setAppSecret
      x-ruum-area: apps
      x-ruum-status: planned
      x-ruum-user-only: true
      summary: Enter the value of a secret (write-only)
      description: |
        Stores the value of an `entered` secret in OpenBao (design 9.9, kind 3: only when there
        is no other way). Needs `manage`. Users only: an agent never handles a secret value in
        step 3 (decision 0006-7). The value is never returned, logged or put in the journal; the
        running app gets it at its next start (the platform restarts the live deployment within a
        minute). A secret of kind `generated` cannot be set (`409 conflict`, hint
        `rotateAppSecret`). `preview: true` lets previews of this app get the live value of this
        entered secret (stored state; the manifest cannot ask for it, decision 0006-5); a call
        may change only `preview`. The log shipper of the app redacts the current and the
        previous value by exact match before anything is stored. Writes `app.secret_changed`
        (name and action only).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetAppSecretRequest'
      responses:
        '204':
          description: The value is stored.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/apps/{node_id}/secrets/{secret_name}/rotate:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/NodeId'
      - $ref: '#/components/parameters/SecretName'
    post:
      tags: [apps]
      operationId: rotateAppSecret
      x-ruum-area: apps
      x-ruum-status: planned
      summary: Rotate a generated secret now
      description: |
        Makes a new value for a `generated` secret (as its schedule `rotate` would) and restarts
        the live deployment with it. The old value stays valid for `overlap` (default 24 hours) so
        sessions signed with it survive, when the manifest says `overlap`. Needs `manage`; agents
        within their scope with `max_role: manage`. An `entered` secret cannot be rotated here
        (`409 conflict`, hint `setAppSecret`). Writes `app.secret_changed`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The secret's new state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppSecret'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

