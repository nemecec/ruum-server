              schema:
                $ref: '#/components/schemas/DatabaseWrite'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/databases/{node_id}/migrations:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/NodeId'
    get:
      tags: [databases]
      operationId: listDatabaseMigrations
      x-ruum-area: databases
      x-ruum-status: planned
      summary: The migrations of a database
      description: |
        Applied, failed and rolled back migrations, newest first. Needs `view`. For agents and
        for people without `manage`, `error` holds the statement number, the SQLSTATE and the
        sanitized message only (as for `query_failed`), never the engine's `DETAIL`.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of migrations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseMigrationPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [databases]
      operationId: applyDatabaseMigration
      x-ruum-area: databases
      x-ruum-status: planned
      summary: Apply a schema migration
      description: |
        Schema changes are migrations (decision 19). The platform records a restore point, runs
        `up` in one transaction (Postgres) or with a file copy first (SQLite), and rolls back
        when a statement fails (`422 migration_failed`, the database is as before). A name runs
        once: the same name with the same checksum answers the stored result, with another
        checksum `409 conflict`.

        **Statements that never run in `up`.** Each statement of `up` is checked before anything
        runs. The statements that `queryDatabase` never runs are refused here too (role and
        session statements, `SET`, `SET LOCAL`, `RESET` and `set_config` of any option, the
        platform's schemas, `public.` or `main.` before a table name, the SQLite statements),
        transaction control included: the platform runs `up` in one transaction that it opens
        and ends, and rolls it back on failure, so write `up` without `BEGIN` and `COMMIT` (hint
        `remove_transaction_control`). A refused migration answers `422 statement_not_allowed`,
        and `message` names the statement by its number in `up`; nothing ran, and no restore
        point, migration row or journal entry is written. Before each statement of `up`, the
        platform sets its own options (`statement_timeout`, `lock_timeout`) again, so a
        statement cannot change the limits of the next.

        **What `up` may create.** A migration runs as the owner of the tables in the schema
        `public` (Postgres): tables, views, functions and types go there. It cannot create a
        schema or an extension; extensions come from the manifest (`extensions`,
        `updateDatabaseManifest`), in the schema `extensions`, which every statement can use.
        While the migration runs, the database is `updating`, and queries of other callers wait
        or get `503 database_not_ready` (see `queryDatabase`).

        Who: on a branch with `masked` or `schema_only` data, `edit`. On a live database and on
        a branch with `full` data, `manage`; an agent also needs a `write_live` grant, and its
        migration always waits for a person: the first call answers `202` with a pending
        approval (reason `migration`), and the agent sends the same migration again with
        `approval_id` (a migration runs with the rights of the schema owner, so a person reads
        it before it touches real data). `data_classes` carries the author's classification of
        the columns that the migration adds (section 8.5); from an agent it is stored as
        suggestions, and a person confirms them with `confirmColumnClasses` (the classes of a
        migration by a person with `manage` count as confirmed). Until then the new columns
        count as `personal`.

        Classes follow the identity of a column, not its name. A column that the migration
        renames or retypes, every column of a table that it renames, swaps or rebuilds, and a
        column that is dropped and added again under the same name return to unconfirmed
        (`personal`), whatever the old class was. So a rename never moves a confirmed `normal`
        class onto `personal` or `secret` data. The same holds for schema changes outside a
        migration.

        `dry_run: true` runs the migration and rolls it back, and reports the new columns. A dry
        run runs as the schema owner and takes the same locks as the migration, so an agent may
        dry-run only on a branch with `masked` or `schema_only` data: an agent's dry run on a
        live database or on a branch with `full` data fails with `403 user_required` (hint
        `dry_run_on_draft_branch`) before anything runs, and no approval is made (decision
        0004-26). A person dry-runs with the same rights as for the migration. For
        agents and for people without `manage`, `error` is sanitized (see
        `listDatabaseMigrations`). Writes `database.migration_applied` or
        `database.migration_failed`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyDatabaseMigrationRequest'
      responses:
        '200':
          description: Applied (or the dry run passed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseMigrationWrite'
        '202':
          description: A migration of an agent on real data; nothing ran. A person must approve it first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequired'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/DatabaseNotReady'
        '504':
          $ref: '#/components/responses/StatementTimeout'

  /v1/databases/{node_id}/branches:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/NodeId'
    get:
      tags: [databases]
      operationId: listDatabaseBranches
      x-ruum-area: databases
      summary: The branches of a database
      description: The live child databases of this database. Needs `view`.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of branches.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabasePage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [databases]
      operationId: createDatabaseBranch
      x-ruum-area: databases
      summary: Make a branch of a database
      description: |
        A copy of the database for tests, previews, or for an agent to try a migration (section
        8.4; decision 18: small databases only). The branch is a child node of type `database`
        (`branch_of` = this node), so it inherits the grants, and it is trashed and purged like
        any node. A branch of a branch is refused (`409 conflict`): branches are flat children of
        a live database in step 2.

        **The copy (Postgres).** The engine makes the branch with `CREATE DATABASE ... TEMPLATE`.
        PostgreSQL refuses that while any session is connected to the source, idle ones
        included, so the engine drains the source first (decision 0004-27): it stops handing
        out sessions of the source and sets `ALLOW_CONNECTIONS false` on it; it closes every
        pooled connection of the source, of every role kind (also the app pools of step 3);
        it waits up to 5 seconds for running statements, then cancels them and ends the
        remaining sessions; it takes the copy; then it allows connections again and reopens
        the pools (the reconciler also does this after a crash in the middle). During the pause,
        a new request on the source waits up to 10 seconds, then fails with the retryable error
        `503 database_not_ready` (hint `retry`, header `Retry-After`; a branch request on a
        source that is draining or `updating` answers the same); a cancelled statement fails the same way and
        commits nothing. Branches are for small databases only (decision 18, the plan's branch
        limit), so the pause is a few seconds. `copyNode` of a database and `createDatabase`
        with `source.kind: template` take their copy the same way. SQLite copies the file with
        the online backup API, without a pause.

        `data` is `masked` by default: `personal` columns become pseudonyms and non-empty
        `secret` values become `NULL`, so a preview never copies real personal data.
        `schema_only` copies no rows. `full` copies real data and needs a person with `manage`
        (an agent gets `403 user_required`). A source larger than the plan's branch limit fails
        with `422 database_too_large`. Needs `edit`. A branch is always taken from the current
        state of the source; a branch from an earlier time is a restore into a new database
        (`restoreDatabase`, `target: new_node`) followed by a branch of it.

        **What a branch keeps.** The branch gets the source's column classes (confirmed classes
        included) and its applied migrations, so a preview does not count every column as
        unconfirmed again and does not run the source's migrations a second time. The classes
        stay as they are: a `personal` column of a masked branch holds pseudonyms and still
        counts as `personal`, so an agent without `read_personal` reads a pseudonym of the
        pseudonym (consistent within the branch, never the real value). The copied column rows
        take their identity (relation, column number, type) from the branch's own catalog after
        the copy and the masking, matched by schema, table and column name; the retype of the
        masking does not reset a confirmed class (decision 0004-28).

        **The branch's pseudonym key.** An agent may write rows and run migrations on a branch
        with `masked` or `schema_only` data without a person's approval. So the lens of such a
        branch uses a pseudonym key of its own, derived from the tenant key and the branch's
        node ID, never the tenant key: a value that an agent writes into a branch never gives
        the pseudonym that the same value has in a live database (decision 0004-25). The masking
        of the copy itself computes the pseudonyms with the key of the source, so the branch's
        tables hold the same pseudonyms that a masked read of the source shows. A copy or a
        restore of such a branch keeps the branch's key. A branch with `full` data uses the
        tenant key, like its source; agents need `write_live` there.

        **Restore window.** The point-in-time window of a branch starts when it became `ready`:
        a masked branch holds no real value from then on, and a restore to an earlier time
        fails with `422 validation_failed`.

        **Masking by type** (`masked` data). A `personal` column becomes `text` holding the
        pseudonym, whatever its type (`int`, `date`, `uuid`, ...); the branch's
        `getDatabaseSchema` shows the new type. A `secret` column keeps its type and holds
        `NULL`; its `NOT NULL` constraint is dropped in the branch. `CHECK` constraints that read
        a masked column are dropped. Primary keys, `UNIQUE` constraints, indexes and foreign keys
        on masked columns are built again after the copy (both sides of a foreign key hold the
        pseudonym of the same value, so it still holds); one that fails (two values with the
        same pseudonym) is left out, and the branch's `status.message` names it (names only,
        never values). Triggers are copied but disabled during the copy.
        Guests and their agents need the tenant policy `guests_create_resources`. Writes
        `node.created`, `version.created` and `database.branch_created`.

        Agents write without a grant only on a branch with `masked` or `schema_only` data (the
        branch gets the `draft_branch` mark). On a branch with `full` data an agent needs a
        `write_live` grant, as on a live database.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDatabaseBranchRequest'
      responses:
        '202':
          description: The branch node; it is `provisioning` until the copy is done.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseWrite'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/DatabaseNotReady'

  /v1/databases/{node_id}/restore-points:
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/NodeId'
    get:
      tags: [databases]
      operationId: listDatabaseRestorePoints
      x-ruum-area: databases
      x-ruum-status: planned
      summary: Restore points and the point-in-time window
      description: |
        The named and automatic restore points inside the backup window (7 days, decision 17)
        and the window itself. Automatic points are made before each granted write session,
        each migration and each in-place restore. These are the provider versions of a database
        (design section 5.3); the manifest versions stay in `listVersions`. Needs `view`.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of restore points, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestorePointPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [databases]
      operationId: createDatabaseRestorePoint
      x-ruum-area: databases
      x-ruum-status: planned
      summary: Name the current point in time
      description: |
        Records a named restore point ("Before import"). Needs `edit`. It lives as long as the
        backup window; a restore point is not a copy.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
