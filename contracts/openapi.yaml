      operationId: listDatabaseColumns
      x-ruum-area: classes
      summary: The data class of every column
      description: |
        Every column of the database with its effective class, its confirmed class and the
        newest suggestion (section 8.5). A column that no person confirmed counts as
        `personal`. Needs `view`. `unconfirmed=true` lists only the columns that wait for a
        person; this is the short pre-filled list of the approval.
      parameters:
        - name: unconfirmed
          in: query
