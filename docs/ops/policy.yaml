# Ruum operations policy (design 19.3)
#
# Status: draft: awaiting the person's approval.
# Drafted by the architect panel's proposer on 2026-11-10. Revised on 2026-11-10 after the guard
# review (panel review-ops: B-1 to B-9, S-1 to S-14, N-1 to N-8). Not signed. Not in force.
#
# This file classifies every action type of the planned operations API. The policy engine reads it
# and decides, for each request, which class applies: green (the acting agent decides), amber (two
# independent agents, the guard included), red (a person). See docs/ops/README.md for how the engine
# evaluates this file, and docs/ops/runbooks/ for one runbook per green and amber action.
#
# Rules that hold for the whole file:
#   - Unlisted means red. An action type that is not in `actions` is red. A file path that is not in
#     `path_classes` is red in production.
#   - Rules only raise a class (green -> amber -> red). Only the per-action `staging_class` field
#     lowers a class, and only on staging.
#   - The engine computes every context fact itself (section `context`). A value that the acting
#     agent sends is never trusted for a decision. A fact that the engine cannot compute counts as
#     the worst value (fail closed). A condition that cannot be written over the facts is red.
#   - The engine computes the class again just before the action runs, and before each step of a
#     multi-step action (`defaults.recheck_at_execution`). An approval binds to one exact request
#     (section `approvals`).
#   - Every deletion passes through the engine: as an action, or as a layer-1 lifecycle that this
#     file declares (section `lifecycles`).
#   - Agents cannot change this file. A change is a pull request, and approving it is red
#     (action `policy.change`).

policy:
  id: ruum-ops
  version: 0.2.0-draft
  status: draft                    # draft | approved; the engine refuses to load a draft in production
  drafted: 2026-11-10
  drafted_by: architect panel (proposer)
  revised: 2026-11-10              # after the guard review (review-ops)
  owner: the person                # the only one who approves and signs
  approved: null
  signature: null                  # detached signature of this file by the person's key; set at approval
  applies_to: [staging, production]
  design: docs/DESIGN.md section 19.3

# What each class means. The engine attaches the class to the request; the operations API enforces it.
classes:
  green:
    decides: the acting agent
    needs: [policy check, all limits within bounds, just-in-time credentials]
    record: audit log entry
  amber:
    decides: two independent agents
    needs:
      - the acting agent's request with its diagnosis
      - an "agree" from an independent guard (section `approvals`, rule guard-independence), bound
        to the request (rule binding)
      - the guard sees the request, the computed context, the acting agent's last 24 h of actions
        on all targets, the last hour of actions in the target's cell, and the current counts of
        every aggregate limit
    record: audit log entry with both decisions and the guard's reason
    when_guard_unavailable: red    # no guard answer in 10 min -> the request goes to a person
  red:
    decides: a person
    needs:
      - a push notification that shows the engine's facts apart from the agent's text (section
        `approvals`, rule notification)
      - the person's signed approval from the person's own device (rule person-signature)
    record: audit log entry with the person's decision and signature
    expires_after: 24h             # an unanswered red request is rejected, never approved by silence

# What an approval is (review B-6). The engine and the operations API enforce each rule.
approvals:
  binding:
    rule: >-
      Every decision (a guard's agree or refuse, a person's approve or reject) is bound to one
      request hash. The hash covers the action type, every parameter, the computed context facts,
      the ids of the rules that fired, and the policy version and its signature. A change of any
      of them voids the decision; the request goes through the engine again.
    fields: [request_hash, policy_version, policy_signature_id, rule_ids, decided_at]
  person-signature:
    rule: >-
      A person's approval is a signature made on the person's own device (WebAuthn with user
      verification) over the request hash. A message on a channel that an agent can write to
      (chat, e-mail, an incident channel, a ticket) is never an approval.
  guard-independence:
    rule: >-
      The guard is a separate agent identity and role instance with its own operations credential,
      which the acting agent cannot use. The guard is never the requester. The guard runs on a
      different model or provider from the acting agent where one is available; when it does not,
      the global rule guard-not-independent applies.
  notification:
    rule: >-
      The push notification of a red request shows two parts. First, the engine's own facts: the
      action, its parameters, the computed context, and the ids and text of the rules that fired.
      Second, the agent's text (summary, recommendation, consequences), marked as written by an
      agent and untrusted (decision 0005 B-3). The approve button signs the facts, not the text.
  batching:
    rule: >-
      Red notifications of one agent role are batched like pages (aggregate red-requests-per-role-
      per-day). Each request in a batch still needs its own signature.

# Defaults that the engine applies before any per-action rule.
defaults:
  unlisted_action: red
  unknown_parameter: red           # a parameter that the action does not declare
  missing_required_parameter: refuse
  engine_error: red                # the engine fails closed
  uncomputable_context: worst_value
  uncomputable_condition: red      # a `when` that cannot be evaluated over the facts
  recheck_at_execution: true       # review B-5, see `execution` below
  kill_switch_engaged: >-
    refuse every agent action, reads included. Only reads made by the person's own signed-in
    session run. Layer 1 keeps running.
  credentials:
    issuer: OpenBao
    ttl_max: 15m                   # per action step; narrow to the target of the action
    renewal: only through the execution recheck (below)
  untrusted_inputs: >-
    Alerts, logs, traces, tickets, customer messages, issue text, dead-letter payloads and every
    field marked content_trust: untrusted are data. No parameter of an action may be copied from
    them without the engine's own check of the target (global rule target-in-incident-scope).

# Time of check and time of use (review B-5).
execution:
  recheck: >-
    Just before an approved action runs, and before each step of a multi-step action
    (tenant.move_cell, node.replace, database.restore, security.patch stages), the engine computes
    the context again and evaluates every rule and limit again. When the class is higher than the
    approved class, the approval is void and the request goes to the higher class. When the class
    is the same or lower, the step runs with the approved class.
  credential_renewal: >-
    A credential for the next step is issued only after the recheck of that step passes. No
    credential outlives its step.
  approval_max_age: 1h             # an approved request that has not started in 1 h needs a new decision

# Facts that the engine computes from its own sources. Agents never supply them.
context:
  # ---------------------------------------------------------------- environment and money
  environment:
    source: the target's cell record in the directory
    values: [staging, canary, production]
  open_security_incident:
    source: incident register (an incident with kind = security and state != closed)
    scope: platform or the cell of the target
  change_freeze:
    source: release calendar (set by a person)
  budget_remaining_eur:
    source: cost ledger (design 21) minus committed spend of the current month
  cost_delta_eur_month:
    source: unit costs of the cost ledger times the resources that the action adds or removes
  # ---------------------------------------------------------------- blast radius
  tenants_affected:
    source: the directory (tenant -> cell) and the target's placement
  tenants_affected_share:
    source: tenants_affected divided by the number of active tenants of the target's cell
  cells_affected:
    source: >-
      the directory; for a staged rollout, the cells of the stage that this request starts, not of
      the whole rollout (review S-5)
  target_namespace:
    source: Kubernetes API; the namespace of the target
  target_kind:
    source: Kubernetes API; deployment, stateful set, daemon set, CloudNativePG cluster, job
  target_replicas:
    source: Kubernetes API; the current replica count of the target
  workload_declared_min:
    source: the workload's manifest in the infrastructure repository (annotation ruum.space/min-replicas)
  workload_declared_max:
    source: the workload's manifest (annotation ruum.space/max-replicas)
  workload_scale_to_zero:
    source: the workload's manifest (annotation ruum.space/scale-to-zero; absent means false)
  # ---------------------------------------------------------------- releases
  canary_analysis:
    source: automatic canary analysis of the release (error rate, latency, saturation)
    values: [passed, inconclusive, failed, not_run]
  release_ci_passed:
    source: CI of the release's commit (every required job)
  release_panel_approved:
    source: the review panel record of the release (unanimous approve)
  release_migrations:
    source: >-
      the release manifest and the migrations between the running and the target version. The
      migration check of CI classifies each migration; the release takes the worst value.
    values: [none, additive, irreversible]
    note: irreversible means a drop, a type change that loses values, a data rewrite, or a migration without a tested down step (review B-2)
  release_path_class:
    source: the files that the release changes, mapped by `path_classes.application`
  rollback_reverts_advisory:
    source: >-
      release history; true when a release between the running and the target version was rolled
      out by security.patch (it carries an advisory), or when a GitOps revert lowers an image
      digest that a security.patch raised (review B-3)
  rollback_crosses_migration:
    source: release_migrations of the releases between the target and the running version
    values: [none, additive, irreversible]
  last_known_good_age:
    source: release history; the age of the version that a rollback would deploy
  is_previous_release:
    source: release history; true when to_version is the release just before the running one
  # ---------------------------------------------------------------- nodes and capacity
  target_restarts_30m:
    source: Kubernetes events of the target
  ready_nodes_after:
    source: Kubernetes API; the ready nodes of the pool if the action succeeds
  nodes_cordoned_by_agents:
    source: Kubernetes API and the audit log; nodes of the same cluster cordoned by an agent and not uncordoned
  quorum_safe:
    source: CloudNativePG and the etcd of Talos; true when the action keeps quorum and one replica
  node_holds_volume:
    source: the storage layer; true when a local volume on the node holds the only or the newest copy of any data
  # ---------------------------------------------------------------- databases and backups
  data_loss_window_s:
    source: backup catalogue and WAL archive; the time between the chosen restore point and the
      last write that the restore would discard. 0 when the restore discards nothing.
  replica_lag_bytes:
    source: CloudNativePG; the replication lag of the instance to promote
  primary_reachable:
    source: CloudNativePG and the node's health; true when the current primary still answers
  backup_age:
    source: backup catalogue; the age of the newest verified backup of the target
  cluster_holds_tenant_data:
    source: the directory; true for a tenant database host and for any cluster that stores tenant rows
  restore_region:
    source: the infrastructure code; the region where the new or scratch cluster would run
  target_cell_region:
    source: the directory; the region of the target's cell
  job_kind:
    source: the job registry (media, index, webhooks, gc_check, gc_sweep, trash_purge, retention, backup, ...)
  job_deletes_data:
    source: the job registry; true for gc_sweep, trash_purge, retention and every kind marked deletes
  job_failures_24h:
    source: the job history of the same job
  stream_consumers_call_out:
    source: >-
      the stream registry; true when a consumer of the stream calls an external system
      (outgoing webhooks, e-mail, a provider API) (review N-3)
  # ---------------------------------------------------------------- tenants, apps, people
  tenant_plan:
    source: the billing record of the tenant (free, paid)
  evidence_kind:
    source: the evidence record; own_scan (Ruum's scanners) or third_party_report
  app_active_users_30d:
    source: the app's usage counters
  app_is_only_public_custom_domain:
    source: the directory; true when the app is the tenant's only public app with a custom domain
  block_made_by:
    source: the audit entry of the block; person or agent
  estimated_write_downtime_s:
    source: the engine's estimate from the tenant size and the measured export and import rates
  move_back_reuses_old_copy:
    source: >-
      true when a tenant.move_cell back to the tenant's previous cell would switch the directory
      to the read-only old copy instead of exporting the current copy (review S-13)
  new_cell_checks_passed:
    source: the isolation suite, the count checks and the synthetic checks of the tenant in its new cell
  directory_entry_age:
    source: the directory; how long the tenant's entry has pointed to its current cell
  principal_is_platform_admin:
    source: Zitadel and the platform role table
  principal_is_ops_agent:
    source: the operations agent registry; true for an operations agent, with its role
  team_owner_with_live_credential_after:
    source: >-
      the directory and the session store; the number of owners of each affected team that keep a
      live credential after this revoke, counting every revoke in the last 24 h (review S-12)
  account_recent_security_event:
    source: >-
      the account's audit log; true when, in the last 7 days, the password or e-mail changed, a new
      passkey was added, a session started from a new country, or any token.revoke touched the
      account (review B-8)
  identity_verified:
    source: the platform's own check that the requester is the signed-in account owner
  requester_is_data_subject:
    source: the request record and the directory
  export_covers_unowned_team:
    source: the directory; true when the export covers a team space that the requester does not own
  consent:
    source: support ticket record; a customer's consent for this ticket, with its scope and expiry
  reader_role:
    source: the operations agent registry; the role of the agent that reads (on_call, support, security, ...)
  query_mode:
    source: >-
      the parsed query of diagnostics.read; filtered (through the privacy filter) or raw. The
      operations API has no raw path for diagnostics.read, so raw comes only from diagnostics.read_raw.
  # ---------------------------------------------------------------- incidents and alerts
  incident_kind:
    source: incident register; the kind of the incident, never lower than incident_kind_floor
  incident_kind_floor:
    source: >-
      the labels of the alerts linked to the incident; an alert labelled security makes the floor
      security, data_integrity or backup makes it data (review S-3)
  incident_has_alerts:
    source: incident register; true when at least one alert is linked
  target_in_incident_scope:
    source: the alerts linked to the incident; true when the target is the alert's subject or in its cell and namespace
  incident_data_risk:
    source: >-
      computed, never filled in by an agent; true when the incident kind is data or security and
      any of these hold: a linked alert has label data_integrity, backup or security; a linked
      diagnostics.read_raw or data incident exists; a token.revoke with evidence of downloads is
      linked; the incident links a database.restore with data_loss_window_s > 0 (review S-2)
  alert_labels:
    source: the alert rule's labels in the alert rules repository
  silence_minutes_24h:
    source: the alert manager; minutes of silence of the same alert rule in the last 24 h, including this request
  # ---------------------------------------------------------------- secrets, certificates, DNS
  rotation_due:
    source: the rotation calendar in OpenBao's metadata; true when the secret is due (review B-4)
  secret_encrypts_data_at_rest:
    source: the secret registry; true for pseudonym keys, vault keys, backup and blob encryption keys (review N-7)
  secret_root_of_trust:
    source: the secret registry; true for the policy signing key, CA keys, OpenBao unseal and root keys, DKIM keys
  newer_version_from_emergency:
    source: OpenBao metadata and the audit log; true when the current version came from a rotation that was not due
  certificate_ca_change:
    source: the certificate's issuer and key type now and after the renewal
  dns_record_type:
    source: the zone; the record's type
  dns_record_role:
    source: >-
      the zone registry; sign_in (apex, auth host), app_domain (apex and wildcard of the public app
      domain), api, webdav, mail, verification, other
  dns_record_is_wildcard:
    source: the record's name
  dns_ttl_after_s:
    source: the record's TTL after the change
  # ---------------------------------------------------------------- the operations swarm
  guard_available:
    source: guard agent health check
  guard_shares_provider:
    source: the agents' configuration; true when the guard and any acting role run on the same provider (review S-10)
  provider_listed:
    source: >-
      the provider list in the infrastructure repository (path class security); a provider is
      listed only with a data processing agreement and an EU region (decision 17-5, design 21)
  provider_is_primary_or_named_fallback:
    source: the provider list
  agent_identity:
    source: >-
      the operations credential that made the request; an identity is one role plus one credential
      issued to it by the operations API (review S-8)
  path_class:
    source: the files that a GitOps pull request changes, mapped by `path_classes.infrastructure`

# File paths by risk (review B-1, B-2). The class of a change is the class of its most severe file.
# A path that matches no list is red in production and amber on staging.
path_classes:
  unlisted_path: {production: red, staging: amber}
  infrastructure:                  # the infrastructure repository; used by gitops.merge
    security:                      # red: a security control, an access right or a safety mechanism
      equivalent_actions: [security_control.disable, access.grant]
      paths:
        - policy/**                # this policy and its signature
        - "**/rbac/**"
        - "**/networkpolicies/**"  # Cilium policies
        - "**/openbao/**"
        - "**/zitadel/**"
        - "**/spicedb/**"
        - "**/privacy/**"          # privacy filter and telemetry pipeline processors
        - "**/runtimeclass*"       # gVisor
        - "**/firewall/**"
        - "**/egress*/**"          # egress proxy and its allow-list
        - "**/cert-manager/**"     # issuers
        - "**/talos/**"            # machine configuration
        - "**/alerts/**"           # alert rules; deleting or weakening one is security_control.disable
        - "**/alertmanager/**"     # routes and receivers
        - "**/audit/**"            # audit log pipeline
        - "**/ops-api/**"
        - "**/policy-engine/**"
        - "**/guard/**"
        - "**/kill-switch/**"
        - "**/agents/**"           # agent allow-lists, roles and the AI provider list
    deletes:                       # red: retention and lifecycle settings; a shorter value deletes data
      equivalent_actions: [backup.delete, data.delete, queue.purge]
      paths:
        - "**/backups/**/retention*"
        - "**/cnpg/**/backup*"     # CloudNativePG backup and retention settings
        - "**/loki/**/retention*"
        - "**/jetstream/**"        # stream max_age, max_msgs, max_bytes
        - "**/object-store/**/lifecycle*"
    data:                          # amber on purpose: placement and sizing of stored data
      paths:
        - "**/cnpg/**"
        - "**/backups/**"
        - "**/storage/**"
        - "**/dns/**"
        - "**/loki/**"
    config:                        # amber on purpose: workload settings that touch no data and no control
      paths:
        - "**/workloads/**"
        - "**/autoscaling/**"
        - "**/dashboards/**"
    routine:                       # green: image digests and versions that passed every CI gate
      paths:
        - "**/images.lock"
        - "**/charts/*/version"
  application:                     # this repository (ruum-server); used by release.promote and security.patch
    security:
      equivalent_actions: [security_control.disable, access.grant]
      paths:
        - contracts/authz/**                   # SpiceDB schema and its tests
        - crates/ruum-core/src/authz/**
        - crates/ruum-core/src/privacy/**      # privacy filter
        - crates/ruum-core/src/identity/**
        - crates/ruum-core/src/audit/**
        - crates/ruum-core/src/tenants/**      # tenant isolation
        - crates/ruum-dbengine/src/role.rs     # database roles and the masking of decision 0005 B-2
        - crates/ruum-dbengine/src/key.rs
        - crates/ruum-dbengine/src/postgres/** # masking, session settings, copies
        - crates/ruum-testkit/src/isolation.rs # the isolation, permission and privacy suites
        - crates/ruum-testkit/src/permissions.rs
        - crates/ruum-testkit/src/privacy.rs
        - crates/ruum-testkit/mutations/**
        - .github/workflows/**                 # the CI gates themselves
        - .gitleaks.toml
    migrations:
      rule: >-
        migrations/** is classified by the fact release_migrations, not by path. A migration that
        creates, changes or drops a row level security policy, a role or a grant is security.
      paths: [migrations/**]
    routine:
      paths:
        - web/**
        - docs/**
    # Any other path of this repository is class `release`: green for release.promote, because CI
    # and the review panel gate every release. `unlisted_path` applies to the infrastructure
    # repository only.

# Deletions that layer 1 does on a schedule (review S-1, B-7). Each one is declared here, runs its
# check first, and counts in the deletions limit. When a check fails or a limit is passed, the
# lifecycle waits and a red request goes to the person.
lifecycles:
  - id: restored-copy-expiry
    deletes: a cluster made by database.restore with mode new_cluster, or by backup.restore_test
    after: 72h for database.restore; at the end of the action for backup.restore_test
    check_first: the cluster gets no traffic and is not named in an open incident as evidence
    on_check_failure: red request (a person keeps or deletes the copy)
    tags: [deletes]
  - id: old-secret-version-revoke
    deletes: the previous version of a secret after a rotation
    after: 24h
    check_first: >-
      secret_encrypts_data_at_rest is false (those are red to rotate and the person plans the
      re-encryption), and no user of the secret read the old version in the last hour
    on_check_failure: red request
    tags: [deletes]
  - id: egress-block-expiry
    deletes: an egress block at its expires_in
    after: expires_in
    check_first: none (ending a block deletes no data)
    tags: []
  - id: ratelimit-expiry
    deletes: a tightened rate limit at its expires_in
    after: expires_in
    check_first: none
    tags: []
  # The old server of node.replace and the old copy of tenant.move_cell are not lifecycles: they are
  # removed only through the actions node.return and tenant.drop_old_copy.

# Rules that apply to every action, after its own rules. They only raise a class.
global_rules:
  - id: security-incident-raises
    when: open_security_incident
    effect: raise_to amber
    for_tags: [raises_in_security_incident]
    why: During an open security incident a second agent checks even routine actions (design 19.3).
  - id: change-freeze
    when: change_freeze
    effect: raise_to red
    for_tags: [deploys_change]
  - id: many-tenants
    when: tenants_affected_share > 0.5 and tenants_affected > 10
    effect: raise_one
    why: >-
      The blast radius is large, even for a routine action. A share of the cell, not a count, so
      that every cell-wide action does not turn amber once a cell grows (review N-8).
  - id: more-than-one-cell
    when: cells_affected > 1
    effect: raise_to red
    except_actions: [release.promote, release.pause, swarm.pause, incident.open, incident.page_person,
                     diagnostics.read, ai_provider.failover]
    why: >-
      Cells limit the blast radius (design 14). One action touches one cell. security.patch and
      gitops.merge start only their first stage; later stages are release.promote requests with
      its canary rules (review S-5).
  - id: guard-down
    when: class == amber and not guard_available
    effect: raise_to red
  - id: guard-not-independent
    when: class == amber and guard_shares_provider
    effect: raise_to red
    why: An amber decision needs two independent agents; on one provider they are not (review S-10).
  - id: target-in-incident-scope
    when: the action has an incident reason and not target_in_incident_scope
    effect: raise_to amber
    why: A parameter copied from untrusted text must stay inside the scope of the alert (review S-3).
  - id: reason-needs-alerts
    when: the action is not tagged read_only, has an incident reason, and not incident_has_alerts
    effect: raise_to amber
    why: An agent cannot make its own justification with an incident that no alert backs (review S-3).

# Totals over time ("no splitting", design 19.3).
#
# Semantics (review S-6):
#   - Every window slides: the count is over the last `window` before the request, not a calendar hour.
#   - Every request that reached the engine counts, also those that the engine raised or refused and
#     those that a guard or a person rejected, so probing is visible. A count is per request, not per
#     success.
#   - A spend limit sums the positive cost_delta_eur_month of the requests; a scale-down gives no
#     budget back within the window.
#   - When a request would pass a limit, the engine applies `then` to that request and to every later
#     one in the window.
#   - Scope "per acting agent" is per agent_identity; "per role" sums every identity of one role.
#   - The guard sees every count in its review of an amber request.
aggregate_limits:
  - id: deletions-per-hour
    counts: [actions and lifecycles tagged deletes]
    window: 1h
    max: 10
    scope: all agents and layer 1
    then: red
    why: >-
      Most actions tagged deletes are red already. The amber ones (node.return,
      tenant.drop_old_copy) and the lifecycles count here, so a burst still reaches a person.
  - id: capacity-removed-per-hour
    counts: [actions tagged removes_capacity]
    window: 1h
    max: 5
    scope: all agents, per cell
    then: red
    why: Many small scale-downs or drains add up to an outage (no splitting).
  - id: disruptive-per-cell-per-hour
    counts: [actions tagged removes_capacity or deploys_change, workload.restart, alert.silence, ratelimit.tighten, queue.redeliver]
    window: 1h
    max: 20
    then: amber
    then_at: {40: red}
    scope: all agents, per cell
    why: Each type has its own counter; a mix of types under every limit can still take a cell down (review S-7).
  - id: restarts-fleet
    counts: [workload.restart]
    window: 1h
    max: 30
    scope: all agents, per cell
    then: amber
  - id: restarts-one-target
    counts: [workload.restart]
    window: 30m
    max: 3
    scope: per target
    then: amber                    # a restart loop needs a diagnosis, not a fourth restart
  - id: rollbacks-per-day
    counts: [workload.rollback]
    window: 24h
    max: 10
    scope: per cell
    then: amber
  - id: scale-spend-per-day
    counts: [cost_delta_eur_month of workload.scale, disk.expand, node.replace, capacity.add_cell, database.restore, backup.restore_test]
    window: 24h
    max_sum_eur: 200
    scope: all agents
    then: red
  - id: disk-expands-per-day
    counts: [disk.expand]
    window: 24h
    max: 5
    scope: all agents, per cell
    then: amber
  - id: restores-per-day
    counts: [database.restore, backup.restore_test]
    window: 24h
    max: 2
    scope: all agents, per cell
    then: amber
    why: Each restore is a copy of data (review B-7).
  - id: amber-per-day
    counts: [every amber action]
    window: 24h
    max: 20
    scope: all agents
    then: red
    why: Many amber actions in a day mean something larger is wrong; a person looks.
  - id: red-requests-per-role-per-day
    counts: [every request that ends red]
    window: 24h
    max: 5
    scope: per role
    then: swarm.pause of that role and one summary page
    why: A flood of red requests leads to approval without reading (review S-9).
  - id: tokens-revoked-per-hour
    counts: [principals in token.revoke]
    window: 1h
    max: 25
    scope: all agents
    then: red
  - id: apps-blocked-per-day
    counts: [app.block, egress.block]
    window: 24h
    max: 10
    scope: all agents
    then: red
  - id: ratelimit-tightenings-per-target
    counts: [ratelimit.tighten]
    window: 24h
    max: 2
    scope: per target
    then: amber
    why: A chain of 24 h limits is a quiet block (review B-9).
  - id: ratelimit-tightenings-total
    counts: [ratelimit.tighten]
    window: 24h
    max: 20
    scope: all agents
    then: amber
  - id: redelivered-messages-per-day
    counts: [max_messages of queue.redeliver]
    window: 24h
    max_sum: 2000
    scope: all agents, per stream
    then: amber
  - id: job-reruns-per-day
    counts: [job.rerun]
    window: 24h
    max: 30
    scope: all agents, per cell
    then: amber
  - id: secret-rotations-per-day
    counts: [secret.rotate, secret.pin_previous]
    window: 24h
    max: 5
    scope: all agents
    then: amber
  - id: certificate-renewals-per-day
    counts: [certificate.renew]
    window: 24h
    max: 10
    scope: all agents
    then: amber
  - id: exports-per-day
    counts: [gdpr.export]
    window: 24h
    max: 20
    scope: all agents
    then: red
    why: After a takeover the export is the attacker's first request (review B-8).
  - id: incidents-opened-per-hour
    counts: [incident.open]
    window: 1h
    max: 10
    scope: all agents
    then: amber
  - id: diagnostics-tenants-per-agent-per-hour
    counts: [distinct tenants in diagnostics.read]
    window: 1h
    max: 10
    scope: per acting agent
    then: amber
    why: Pseudonyms are stable per tenant and linkable; bulk reads are an exposure (review S-4).
  - id: diagnostics-volume-per-agent-per-hour
    counts: [rows returned by diagnostics.read]
    window: 1h
    max_sum: 50000
    scope: per acting agent
    then: amber
  - id: silences-open
    counts: [active alert.silence]
    window: now
    max: 5
    scope: all agents
    then: amber
  - id: actions-per-agent-per-hour
    counts: [every non-read action]
    window: 1h
    max: 60
    scope: per acting agent
    then: red
  - id: actions-per-role-per-hour
    counts: [every non-read action]
    window: 1h
    max: 120
    scope: per role
    then: red
    why: More instances of one role do not get more actions (review S-8).
  - id: page-person-per-hour
    counts: [incident.page_person]
    window: 1h
    max: 6
    scope: all agents
    then: batch                    # later pages go into one summary page every 30 min; never dropped

# The action types of the operations API.
#
# Fields:
#   class          the base class in production (and canary)
#   staging_class  optional; the class on staging (may be lower; game days, design 19.5)
#   params         the parameters that the agent sends; anything else is red (defaults)
#   rules          ordered; each `when` is evaluated on params and context; `class` sets the class
#                  if it is higher than the current one; `effect: refuse` stops the request;
#                  `effect: page_person` pages the person and does not change the class
#   tags           used by global_rules and aggregate_limits; a tag with `when` applies only then
#   undo           the action that reverses it, or none; the undo has its own class
#   runbook        file in docs/ops/runbooks/ (green and amber actions)
actions:

  # ---------------------------------------------------------------- workloads and releases

  workload.restart:
    summary: Restart the pods of one workload (rolling).
    class: green
    params:
      workload: {type: workload_ref, required: true}
      reason: {type: incident_ref, required: true}
    rules:
      - when: target_kind == stateful_set and target_replicas == 1
        class: amber
        why: A restart is an outage for it.
      - when: target_namespace in [ruum-security, openbao, zitadel, spicedb, ruum-ops]
        class: amber
    tags: [raises_in_security_incident]
    undo: none (a restart changes no state)
    runbook: runbooks/workload.restart.md

  workload.scale:
    summary: Change the replica count or resource requests of one workload.
    class: green
    params:
      workload: {type: workload_ref, required: true}
      replicas: {type: integer, min: 0}
      cpu_request: {type: quantity}
      memory_request: {type: quantity}
      reason: {type: incident_ref, required: true}
    rules:
      - when: target_kind == cnpg_cluster
        effect: refuse
        why: CloudNativePG clusters are never scaled as plain workloads (review N-2).
      - when: replicas > workload_declared_max or replicas < workload_declared_min
        class: amber
      - when: target_kind == stateful_set and replicas < target_replicas
        class: amber
        why: Lowering a stateful set can drop a member with its volume (review N-2).
      - when: replicas == 0 and not workload_scale_to_zero
        class: red
        why: Scaling a platform service to zero is an outage.
      - when: cost_delta_eur_month > budget_remaining_eur
        class: red
        why: Spending above budget is red (design 19.3).
      - when: cost_delta_eur_month > 100
        class: amber
    tags: [raises_in_security_incident, {tag: removes_capacity, when: it lowers replicas or requests}]
    undo: workload.scale to the earlier values (recorded in the audit entry)
    runbook: runbooks/workload.scale.md

  workload.rollback:
    summary: Deploy the last known good version of one workload or tenant-facing service.
    class: green
    params:
      workload: {type: workload_ref, required: true}
      to_version: {type: version_ref, required: true}
      reason: {type: incident_ref, required: true}
    rules:
      - when: not is_previous_release
        class: amber
      - when: last_known_good_age > 7d
        class: amber
      - when: rollback_reverts_advisory
        class: amber
        why: A rollback over a security patch brings the hole back (review B-3).
      - when: rollback_reverts_advisory and open_security_incident
        class: red
      - when: rollback_crosses_migration == irreversible
        class: red
        why: The old code may not read the new schema; a rollback can lose writes.
    tags: [deploys_change, raises_in_security_incident]
    undo: release.promote of the version that was rolled back
    runbook: runbooks/workload.rollback.md

  release.promote:
    summary: Promote a release one stage (staging -> canary cell -> all cells).
    class: green
    params:
      release: {type: release_ref, required: true}
      to_stage: {type: enum, values: [canary, all_cells], required: true}
    rules:
      - when: not release_ci_passed or not release_panel_approved
        class: red
      - when: to_stage == all_cells and canary_analysis == inconclusive
        class: amber
      - when: to_stage == all_cells and canary_analysis in [failed, not_run]
        class: red
      - when: release_path_class == security
        class: red
      - when: release_migrations == additive and to_stage == all_cells
        class: amber
        why: The guard checks that the canary ran the migration cleanly before every cell runs it.
      - when: release_migrations == irreversible
        class: red
        why: >-
          Canary analysis measures errors and latency, not lost data. A drop, a lossy type change
          or a data rewrite is a deletion; a person decides at the first production stage (review B-2).
    tags: [deploys_change, raises_in_security_incident]
    undo: workload.rollback in each promoted cell
    runbook: runbooks/release.promote.md

  release.pause:
    summary: Stop a rollout where it is. Nothing is rolled back.
    class: green
    params:
      release: {type: release_ref, required: true}
      reason: {type: incident_ref, required: true}
    rules: []
    tags: []
    undo: release.promote (continues the rollout)
    runbook: runbooks/release.pause.md

  job.rerun:
    summary: Run a failed background job or reconciler task again (media, index, webhooks, GC check).
    class: green
    params:
      job: {type: job_ref, required: true}
    rules:
      - when: job_deletes_data
        class: red
        why: A rerun of a deleting job is a deletion.
      - when: job_failures_24h >= 3
        class: amber
    tags: [{tag: deletes, when: job_deletes_data}]
    undo: none (jobs are idempotent by design 14; a rerun repeats the same result)
    runbook: runbooks/job.rerun.md

  queue.redeliver:
    summary: Move messages from a NATS JetStream dead-letter subject back to their stream.
    class: green
    params:
      stream: {type: stream_ref, required: true}
      max_messages: {type: integer, min: 1, max: 10000, required: true}
    rules:
      - when: max_messages > 1000
        class: amber
      - when: stream_consumers_call_out
        class: amber
        why: >-
          Idempotency keys protect Ruum's own consumers, not an external receiver; a redelivery can
          send webhooks or e-mail again (review N-3).
    tags: [raises_in_security_incident]
    undo: none; Ruum's consumers are idempotent (idempotency keys, design 14); external effects are not undone
    runbook: runbooks/queue.redeliver.md

  # ---------------------------------------------------------------- nodes, disks, capacity

  node.cordon:
    summary: Cordon and drain one Kubernetes node (no new pods; existing pods move away).
    class: green
    params:
      node: {type: node_ref, required: true}
      reason: {type: incident_ref, required: true}
    rules:
      - when: not quorum_safe
        class: red
      - when: ready_nodes_after < 2
        class: amber
      - when: nodes_cordoned_by_agents >= 1
        class: amber
    tags: [removes_capacity]
    undo: node.uncordon (same runbook)
    runbook: runbooks/node.cordon.md

  node.uncordon:
    summary: Let pods schedule on a node again.
    class: green
    params:
      node: {type: node_ref, required: true}
    rules: []
    tags: []
    undo: node.cordon
    runbook: runbooks/node.cordon.md

  node.replace:
    summary: Order a new server of the same type and join it to the cluster; the old one stays cordoned.
    class: amber
    params:
      node: {type: node_ref, required: true}
      reason: {type: incident_ref, required: true}
    rules:
      - when: cost_delta_eur_month > budget_remaining_eur
        class: red
      - when: not quorum_safe
        class: red
    tags: [raises_in_security_incident]
    undo: none for the order; the old server stays cordoned until node.return
    runbook: runbooks/node.replace.md

  node.return:
    summary: Return a replaced server to the provider. Its local disks are destroyed.
    class: amber
    params:
      node: {type: node_ref, required: true}
    rules:
      - when: the node was not replaced by node.replace at least 72 h ago
        effect: refuse
      - when: not quorum_safe
        class: red
      - when: node_holds_volume
        class: red
        why: Returning a server destroys its local volumes (review S-1).
    tags: [deletes, removes_capacity]
    undo: none
    runbook: runbooks/node.replace.md

  disk.expand:
    summary: Grow a persistent volume (CloudNativePG data, WAL, NATS, Loki).
    class: green
    params:
      volume: {type: volume_ref, required: true}
      new_size: {type: quantity, required: true}
    rules:
      - when: new_size > 2 x current size
        class: amber
      - when: cost_delta_eur_month > budget_remaining_eur
        class: red
    tags: []
    undo: none (volumes do not shrink); the cost is in the weekly digest
    runbook: runbooks/disk.expand.md

  capacity.add_cell:
    summary: Create a new cell from the infrastructure code (design 14, stage 2).
    class: amber
    params:
      region: {type: enum, values: [hel1], required: true}
      size: {type: cell_size_ref, required: true}
    rules:
      - when: cost_delta_eur_month > budget_remaining_eur
        class: red
      - when: region not in the list above
        class: red
        why: A new region is a product and legal decision (data location).
    tags: [raises_in_security_incident]
    undo: capacity.remove_cell (red, because it deletes infrastructure) while the cell has no tenants
    runbook: runbooks/capacity.add_cell.md

  # ---------------------------------------------------------------- databases and backups

  database.failover:
    summary: Promote a replica of a CloudNativePG cluster to primary.
    class: amber
    params:
      cluster: {type: cluster_ref, required: true}
      to_instance: {type: instance_ref}
      mode: {type: enum, values: [switchover, failover], required: true}
      reason: {type: incident_ref, required: true}
    rules:
      - when: mode == failover and primary_reachable
        class: red
        why: Promoting a replica while the primary still takes writes loses data; use a switchover.
      - when: mode == failover and not primary_reachable
        class: red
        why: >-
          The loss window of a failover with an unreachable primary cannot be computed. Layer 1
          (CloudNativePG) does that failover by itself; an agent request for it is red (review N-1).
      - when: data_loss_window_s > 0
        class: red
    tags: [raises_in_security_incident]
    undo: database.failover with mode switchover back to the old primary after it rejoins as a replica
    runbook: runbooks/database.failover.md
    note: >-
      A switchover fences the primary and waits until replica_lag_bytes is 0 before it promotes;
      its data_loss_window_s is 0.

  database.restore:
    summary: Restore a platform or tenant database cluster from backup and WAL (point in time).
    class: green                   # only an isolated restore of a platform database stays green
    params:
      cluster: {type: cluster_ref, required: true}
      target_time: {type: timestamp_or_latest, required: true}
      mode: {type: enum, values: [new_cluster, in_place], required: true}
      reason: {type: incident_ref, required: true}
    rules:
      - when: cluster_holds_tenant_data
        class: amber
        why: A restore of a tenant database is a copy of tenant data (review B-7).
      - when: mode == in_place, or the new cluster is to get traffic
        class: amber
        why: The restore replaces data that serves users. An isolated restore changes nothing.
      - when: cost_delta_eur_month > 50
        class: amber
      - when: cost_delta_eur_month > budget_remaining_eur
        class: red
      - when: cluster_holds_tenant_data and restore_region != target_cell_region
        class: red
      - when: data_loss_window_s > 0
        class: red
        why: A restore that loses data is red (design 19.3).
      - when: target_time older than the backup promise (7 days, decision 17)
        class: red
    access: >-
      Nobody gets credentials for a new cluster. Agents read it only through diagnostics.read,
      through the privacy filter and the masking of decision 0005 B-2, with the restore's incident
      as the reason.
    lifecycle: restored-copy-expiry
    tags: [raises_in_security_incident]
    undo: >-
      in_place: the engine takes a restore point of the current state first; a restore back to it
      discards every write after the first restore, so that undo has a loss window above 0 and is
      red (review S-14). new_cluster: the copy expires after 72 h (lifecycle restored-copy-expiry).
    runbook: runbooks/database.restore.md

  backup.retry:
    summary: Run a failed scheduled backup again.
    class: green
    params:
      backup_job: {type: job_ref, required: true}
    rules:
      - when: job_failures_24h >= 3
        class: amber
    tags: []
    undo: none (a backup adds a copy; retention removes old ones)
    runbook: runbooks/backup.retry.md

  backup.restore_test:
    summary: Restore a backup into an isolated scratch cluster, check it, and remove the scratch cluster.
    class: green
    params:
      backup: {type: backup_ref, required: true}
    rules:
      - when: cluster_holds_tenant_data and restore_region != target_cell_region
        class: red
      - when: cost_delta_eur_month > budget_remaining_eur
        class: red
    access: the checks run inside the scratch cluster; no agent reads its rows
    lifecycle: restored-copy-expiry
    tags: []
    undo: none needed; the scratch cluster is removed at the end (lifecycle restored-copy-expiry)
    runbook: runbooks/backup.restore_test.md

  # ---------------------------------------------------------------- tenants and apps

  tenant.move_cell:
    summary: Move one tenant to another cell (export, import, switch the directory entry).
    class: amber
    params:
      tenant: {type: tenant_ref, required: true}
      to_cell: {type: cell_ref, required: true}
      reason: {type: text, content_trust: untrusted, required: true}
    rules:
      - when: to_cell is in another region
        class: red
      - when: estimated_write_downtime_s > 900
        class: red
      - when: move_back_reuses_old_copy
        class: red
        why: Switching back to the old read-only copy discards every write since the move (review S-13).
    tags: [raises_in_security_incident]
    undo: >-
      tenant.move_cell back to the old cell, which exports the current copy from the new cell. The
      old read-only copy is only a fallback for a move that fails before the directory switch.
    runbook: runbooks/tenant.move_cell.md

  tenant.drop_old_copy:
    summary: Delete the read-only old copy of a tenant after a tenant.move_cell.
    class: amber
    params:
      tenant: {type: tenant_ref, required: true}
    rules:
      - when: directory_entry_age < 7d
        effect: refuse
      - when: not new_cell_checks_passed
        class: red
        why: The old copy is the only fallback until the new cell is proven (review S-1).
    tags: [deletes]
    undo: none
    runbook: runbooks/tenant.move_cell.md

  app.block:
    summary: Take a tenant's app offline (phishing, malware, abuse report, or an app that harms the platform).
    class: amber
    params:
      app: {type: app_ref, required: true}
      evidence: {type: evidence_ref, required: true}   # URL scan result, abuse report record
    rules:
      - when: tenant_plan == paid and evidence_kind == third_party_report
        class: red
        why: A person checks before a paying customer's app goes down on a report alone.
      - when: app_active_users_30d > 100 or app_is_only_public_custom_domain
        class: red
    tags: []
    undo: app.unblock
    runbook: runbooks/app.block.md

  app.unblock:
    summary: Put a blocked app back online.
    class: amber
    params:
      app: {type: app_ref, required: true}
      reason: {type: text, content_trust: untrusted, required: true}
    rules:
      - when: block_made_by == person
        class: red
    tags: [raises_in_security_incident]
    undo: app.block
    runbook: runbooks/app.unblock.md

  egress.block:
    summary: Block one destination in the egress proxy for one app (or for all apps of one tenant).
    class: amber
    params:
      app: {type: app_ref}
      tenant: {type: tenant_ref}
      destination: {type: host_or_cidr, required: true}
      evidence: {type: evidence_ref, required: true}
      expires_in: {type: duration, max: 7d, required: true}
    rules:
      - when: destination covers more than one /24 or a whole top-level domain
        class: red
    lifecycle: egress-block-expiry
    tags: []
    undo: egress.unblock (same runbook)
    runbook: runbooks/egress.block.md

  egress.unblock:
    summary: Remove a block of the egress proxy.
    class: amber
    params:
      block: {type: block_ref, required: true}
    rules:
      - when: block_made_by == person
        class: red
    tags: [raises_in_security_incident]
    undo: egress.block
    runbook: runbooks/egress.block.md

  ratelimit.tighten:
    summary: Lower a rate limit for a time (one tenant, one app, one IP range), for example in a flood.
    class: green
    params:
      target: {type: ratelimit_target_ref, required: true}
      limit: {type: rate, required: true}
      expires_in: {type: duration, max: 24h, required: true}
    rules:
      - when: target is the whole platform
        class: amber
      - when: target is a tenant or an app and limit < 10 % of its configured value
        class: amber
      - when: target is a tenant or an app and limit < 1 % of its configured value
        class: red
        why: A near-zero limit is a block of the tenant without the tenant.suspend check (review B-9).
      - when: target is an IP range wider than /24 (IPv4) or /48 (IPv6)
        class: amber
      - when: target is an IP range and more than 3 tenants had traffic from it in the last 24 h
        class: amber
        why: A shared range (a CDN, a large ISP, a tenant's office) is not one abuser.
    lifecycle: ratelimit-expiry
    tags: []
    undo: ratelimit.restore (same runbook); also ends by itself at expires_in
    runbook: runbooks/ratelimit.tighten.md

  ratelimit.restore:
    summary: Put a rate limit back to its configured value.
    class: green
    params:
      target: {type: ratelimit_target_ref, required: true}
    rules: []
    tags: []
    undo: ratelimit.tighten
    runbook: runbooks/ratelimit.tighten.md

  # ---------------------------------------------------------------- security

  token.revoke:
    summary: Revoke the sessions, OAuth tokens, app passwords or agent tokens of one principal.
    class: amber
    params:
      principal: {type: principal_ref, required: true}
      kinds: {type: list, values: [sessions, oauth_tokens, app_passwords, agent_tokens], required: true}
      evidence: {type: evidence_ref, required: true}
    rules:
      - when: principal_is_platform_admin
        class: red
      - when: team_owner_with_live_credential_after == 0 for any team of the principal
        class: red
        why: >-
          The team can be locked out of its own space. Computed after the revoke, over every revoke
          of the last 24 h, so two amber revokes cannot lock out both owners (review S-12).
      - when: principal_is_ops_agent
        effect: page_person
        why: Revoking the guard's token makes every amber request red; a person should know.
    tags: []
    undo: none; the person signs in again and makes new tokens (the runbook tells them how)
    runbook: runbooks/token.revoke.md

  secret.rotate:
    summary: Rotate a platform secret or key in OpenBao and roll it out to its users.
    class: green
    params:
      secret: {type: secret_ref, required: true}
    rules:
      - when: not rotation_due
        class: amber
        why: >-
          An emergency rotation after a suspected leak. Computed from the rotation calendar, never
          from a parameter (review B-4).
      - when: secret_encrypts_data_at_rest
        class: red
        why: Rotating these changes stored pseudonyms or can make data unreadable (decision 0004-16).
      - when: secret_root_of_trust
        class: red
    lifecycle: old-secret-version-revoke
    tags: [raises_in_security_incident]
    undo: secret.pin_previous (its own class; red after an emergency rotation)
    runbook: runbooks/secret.rotate.md

  secret.pin_previous:
    summary: Make the previous version of a secret current again, within 24 h of a rotation.
    class: amber
    params:
      secret: {type: secret_ref, required: true}
      reason: {type: incident_ref, required: true}
    rules:
      - when: the previous version was revoked already (more than 24 h)
        effect: refuse
      - when: newer_version_from_emergency
        class: red
        why: The previous version may be the leaked one (review B-4).
      - when: open_security_incident
        class: red
      - when: secret_encrypts_data_at_rest or secret_root_of_trust
        class: red
    tags: [raises_in_security_incident]
    undo: secret.rotate
    runbook: runbooks/secret.rotate.md

  security.patch:
    summary: Roll out a security patch (image, OS of Talos, dependency) to its first production stage.
    class: amber
    staging_class: green
    params:
      release: {type: release_ref, required: true}
      advisory: {type: advisory_ref, required: true}
    rules:
      - when: release_path_class == security
        class: red
      - when: not release_ci_passed
        class: red
      - when: release_migrations == irreversible
        class: red
    stages: >-
      This action rolls out to the canary cell only. The next stages are release.promote requests
      with its canary rules (review S-5).
    tags: [deploys_change]
    undo: workload.rollback, which is amber over a security patch and red during a security incident
    runbook: runbooks/security.patch.md

  gitops.merge:
    summary: Merge an infrastructure pull request that the agent panel reviewed; the rollout follows the stages.
    class: green                   # only routine files stay green
    params:
      pull_request: {type: pr_ref, required: true}
    rules:
      - when: path_class in [data, config]
        class: amber
      - when: path_class in [security, deletes] or a changed file matches no path class
        class: red
        why: >-
          A merge takes the class of the most severe direct action that it is equivalent to
          (`equivalent_actions` in path_classes). A retention change is backup.delete; an alert rule
          change is security_control.disable (review B-1).
      - when: the change is a revert that lowers an image digest that a security.patch raised (rollback_reverts_advisory)
        class: amber
      - when: rollback_reverts_advisory and open_security_incident
        class: red
      - when: any CI gate did not pass
        class: red
      - when: the panel review is missing or not unanimous
        class: red
    stages: the merge rolls out to staging and the canary cell; all cells is a release.promote request
    tags: [deploys_change, raises_in_security_incident]
    undo: a revert pull request (gitops.merge again, with its own class)
    runbook: runbooks/gitops.merge.md

  dns.update:
    summary: Change one DNS record of a Ruum domain (not a tenant's custom domain, which layer 1 handles).
    class: amber
    params:
      record: {type: dns_record_ref, required: true}
      value: {type: text, required: true}
      ttl: {type: duration}
    rules:
      - when: dns_record_type in [NS, MX, CAA] or dns_record_role in [mail, verification]
        class: red
      - when: dns_record_role in [sign_in, app_domain, api, webdav]
        class: red
        why: These records send every tenant's sign-in, app, API or WebDAV traffic (review S-11).
      - when: dns_record_is_wildcard
        class: red
      - when: dns_ttl_after_s > 3600 or dns_ttl_after_s < 60
        class: red
    tags: [raises_in_security_incident]
    undo: dns.update to the earlier value (recorded in the audit entry)
    runbook: runbooks/dns.update.md

  certificate.renew:
    summary: Renew a TLS certificate that the automatic renewal did not renew in time.
    class: green
    params:
      certificate: {type: certificate_ref, required: true}
    rules:
      - when: certificate_ca_change
        class: amber
    tags: []
    undo: none needed (the old certificate stays valid until it expires)
    runbook: runbooks/certificate.renew.md

  # ---------------------------------------------------------------- incidents, alerts, people

  incident.open:
    summary: Open an incident record and its channel; link alerts to it.
    class: green
    params:
      kind: {type: enum, values: [availability, performance, data, security, cost, abuse], required: true}
      severity: {type: enum, values: [sev1, sev2, sev3], required: true}
      alerts: {type: list, item: alert_ref}
    rules:
      - when: kind is lower than incident_kind_floor
        effect: raise kind to incident_kind_floor
        why: >-
          The linked alerts set the floor; an agent cannot file a breach as availability (review
          S-3). Lowering the kind later is incident.update, which stays unlisted (red).
    tags: []
    undo: incident.close
    runbook: runbooks/incident.open.md

  incident.close:
    summary: Close an incident after the checks of its runbook pass; asks the postmortem agent for a report.
    class: green
    params:
      incident: {type: incident_ref, required: true}
    rules:
      - when: incident_kind == security
        class: amber
      - when: incident_data_risk
        class: red
        why: Any incident with possible data loss or exposure pages a person (design 19.4).
    tags: []
    undo: incident.reopen (green, same runbook)
    runbook: runbooks/incident.close.md

  incident.reopen:
    summary: Reopen a closed incident within 7 days; it keeps its timeline.
    class: green
    params:
      incident: {type: incident_ref, required: true}
    rules:
      - when: closed more than 7 days ago
        effect: refuse             # open a new incident and link the old one
    tags: []
    undo: incident.close
    runbook: runbooks/incident.close.md

  incident.page_person:
    summary: Page the person (push notification) about an incident, outside the red-request flow.
    class: green
    params:
      incident: {type: incident_ref, required: true}
      summary: {type: text, max_length: 300, required: true}
    rules: []
    tags: []
    undo: none
    runbook: runbooks/incident.page_person.md

  alert.silence:
    summary: Silence one alert rule for a short time, linked to an open incident.
    class: green
    params:
      alert_rule: {type: alert_rule_ref, required: true}
      incident: {type: incident_ref, required: true}
      duration: {type: duration, max: 24h, required: true}
    rules:
      - when: duration > 2h
        class: amber
      - when: silence_minutes_24h > 120
        class: amber
        why: Two silences of 2 h in a row are one silence of 4 h (review N-4).
      - when: alert_labels contain security, backup, data_integrity or ops_safety
        class: red
        why: >-
          Silencing these turns off a safety control. ops_safety marks the alerts on the operations
          API, the guard, the audit pipeline and the kill switch.
    tags: [raises_in_security_incident]
    undo: alert.unsilence (same runbook); a silence ends by itself
    runbook: runbooks/alert.silence.md

  alert.unsilence:
    summary: End a silence before its end time.
    class: green
    params:
      silence: {type: silence_ref, required: true}
    rules: []
    tags: []
    undo: alert.silence
    runbook: runbooks/alert.silence.md

  status.publish:
    summary: Post or update an outage notice on the public status page.
    class: amber
    params:
      incident: {type: incident_ref, required: true}
      text: {type: text, max_length: 600, required: true}
    rules:
      - when: incident_kind == security or incident_data_risk
        class: red
        why: Telling customers about a breach is red (design 19.3).
      - when: >-
          the text contains any name in the directory (tenant names, app names, account names,
          custom domains), by an exact, case-insensitive word match
        class: red
        why: A list match, not a classifier; when the matcher cannot run, the rule counts as true (review S-2).
    tags: []
    undo: status.publish with a correction (a post is never deleted)
    runbook: runbooks/status.publish.md

  # ---------------------------------------------------------------- diagnostics and compliance

  diagnostics.read:
    summary: Read logs, metrics, traces, events and configuration through the privacy filter (pseudonyms).
    class: green
    params:
      scope: {type: enum, values: [platform, cell, tenant, app], required: true}
      target: {type: ref, required: true}
      query: {type: text, required: true}
      reason: {type: incident_or_ticket_ref}   # required when scope is tenant or app
      consent: {type: consent_ref}             # required when scope is tenant or app and reader_role is support
    rules:
      - when: scope in [tenant, app] and reason is missing
        effect: refuse
        why: Every role names an incident or a ticket for a tenant or app read (review S-4).
      - when: scope in [tenant, app] and reader_role == support and consent is missing or expired
        class: red
        why: Support diagnostics only with the customer's consent for this ticket (design 22.2).
      - when: query_mode == raw
        class: red
        why: Raw personal data is action diagnostics.read_raw (red).
    tags: [read_only]               # not counted as a non-read action; the diagnostics limits count it
    kill_switch: refused for agents; only the person's own session reads while the switch is engaged
    undo: none (read only)
    runbook: runbooks/diagnostics.read.md

  gdpr.export:
    summary: Prepare a data export for the account that asked for it, delivered only to that signed-in account.
    class: amber                    # until the export path has its own test suite (review B-8)
    params:
      request: {type: request_ref, required: true}
    rules:
      - when: not identity_verified
        class: red
      - when: not requester_is_data_subject
        class: red
        why: A request from a lawyer or an authority is a legal request.
      - when: export_covers_unowned_team
        class: red
      - when: account_recent_security_event
        class: red
        why: After an account takeover the export is the attacker's first request (review B-8).
    tags: [raises_in_security_incident]
    undo: gdpr.export_revoke (green); the download link also ends after 7 days
    runbook: runbooks/gdpr.export.md

  gdpr.export_revoke:
    summary: End the download link of a prepared export before its 7 days are over, and delete the export file.
    class: green
    params:
      request: {type: request_ref, required: true}
    rules: []
    tags: []
    undo: none; the person asks for a new export
    runbook: runbooks/gdpr.export.md

  # ---------------------------------------------------------------- the operations swarm itself

  ai_provider.failover:
    summary: Switch the operations agents to the fallback model or provider.
    class: green
    params:
      to_provider: {type: provider_ref, required: true}
    rules:
      - when: not provider_listed
        class: red
        why: Pseudonymized production data goes to the provider; only providers with a DPA and an EU region.
      - when: not provider_is_primary_or_named_fallback
        class: red
      - when: guard_shares_provider after the failover
        class: amber
        why: >-
          The guard and an acting role on one provider are not independent; while it lasts, the
          global rule guard-not-independent sends every amber request to the person (review S-10).
    tags: []
    undo: ai_provider.failover back to the primary
    runbook: runbooks/ai_provider.failover.md

  swarm.pause:
    summary: Pause the operations agents (all, or one role). Layer 1 keeps running.
    class: green
    params:
      roles: {type: list, item: role_ref}
      reason: {type: text, required: true}
    rules:
      - when: roles is empty (all roles), or roles contain security or guard
        effect: page_person
        why: Without the security or guard role, amber requests go to the person (review N-6).
    tags: []
    undo: swarm.resume (red)
    runbook: runbooks/swarm.pause.md

  # ---------------------------------------------------------------- red: listed so that the push
  # notification can name them; these have no runbook for agents. A person decides each one.

  tenant.delete:
    summary: Delete a tenant and all its data.
    class: red
    tags: [deletes]
  data.delete:
    summary: Delete or purge any tenant data (files, versions, databases, trash) outside the product's own retention.
    class: red
    tags: [deletes]
  backup.delete:
    summary: Delete a backup copy or change backup retention (also through gitops.merge, path class deletes).
    class: red
    tags: [deletes]
  queue.purge:
    summary: Purge messages of a stream or a dead-letter subject, or shorten a stream's retention.
    class: red
    tags: [deletes]
  tenant.suspend:
    summary: Suspend a whole tenant (no sign-in, apps offline).
    class: red
  tenant.enable_public_apps:
    summary: Turn on public apps or custom domains for a tenant (design 9.5, decision 22).
    class: red
  capacity.remove_cell:
    summary: Remove a cell and its infrastructure.
    class: red
    tags: [deletes]
  access.grant:
    summary: >-
      Give any principal platform admin rights, change an operations agent's allow-list, or create
      a new operations agent identity (review S-8).
    class: red
  security_control.disable:
    summary: >-
      Turn off or weaken a safety control (privacy filter, masking, row level security, gVisor,
      network policy, firewall, egress proxy, alert rule, audit log, kill switch wiring, a CI gate).
    class: red
  policy.change:
    summary: Approve a change of this policy (agents propose it as a pull request).
    class: red
  budget.raise:
    summary: Raise a budget, or approve spending above it.
    class: red
  diagnostics.read_raw:
    summary: Read raw personal values (no privacy filter) for a limited time.
    class: red
  legal.request:
    summary: Answer a legal or law-enforcement request.
    class: red
  breach.notify:
    summary: Tell customers or an authority about a breach.
    class: red
  swarm.resume:
    summary: Resume the operations agents after a pause or the kill switch.
    class: red
  provider.account_change:
    summary: Create or change a cloud, DNS registrar, payment, e-mail or AI provider account.
    class: red
