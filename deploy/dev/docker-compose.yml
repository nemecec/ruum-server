# The Ruum laptop stack (docs/DESIGN.md section 12.2). Use scripts/dev.sh, not this file directly.
# All host ports bind to 127.0.0.1. The list of ports is in docs/DEVSTACK.md.
name: ruum

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    build: ./postgres
    image: ruum-dev/postgres:17-postgis-pgvector
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/dev.sh up}
      RUUM_DB_PASSWORD: ${RUUM_DB_PASSWORD}
      ZITADEL_DB_PASSWORD: ${ZITADEL_DB_PASSWORD}
      SPICEDB_DB_PASSWORD: ${SPICEDB_DB_PASSWORD}
    command:
      - postgres
      - -c
      - max_connections=300
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=8MB
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d ruum"]  # TCP: the temporary first-start server listens only on the socket
      interval: 3s
      timeout: 3s
      retries: 40
    mem_limit: 1g
    restart: unless-stopped
    logging: *logging

  # The data cluster: customer databases only, never the platform metadata (docs/STEP2.md
  # "Infrastructure work" 1 and 2). Its own network, so the only address it accepts logins from is
  # the network gateway (the host, where the Ruum server runs). See docs/DEVSTACK.md.
  postgres-data:
    build: ./postgres-data
    image: ruum-dev/postgres-data:17
    environment:
      POSTGRES_USER: postgres
      # Empty in a .env older than this service: the first start then fails. `dev.sh up` adds them.
      POSTGRES_PASSWORD: ${POSTGRES_DATA_PASSWORD:-}
      RUUM_DBHOST_PASSWORD: ${RUUM_DBHOST_PASSWORD:-}
      RUUM_DATA_PLATFORM_CIDR: ${RUUM_DATA_PLATFORM_CIDR:-}
    ports:
      - "127.0.0.1:${POSTGRES_DATA_PORT:-5435}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - data
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -h 127.0.0.1 -U postgres -d postgres"]  # TCP, as above
      interval: 3s
      timeout: 3s
      retries: 40
    mem_limit: 768m
    restart: unless-stopped
    logging: *logging

  garage:
    image: dxflrs/garage:v2.5.0
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    ports:
      - "127.0.0.1:3900:3900" # S3 API
      - "127.0.0.1:3903:3903" # admin API
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 3s
      timeout: 3s
      retries: 40
    mem_limit: 256m
    restart: unless-stopped
    logging: *logging

  # Replication of the SQLite databases (docs/STEP2.md "Infrastructure work" 4, docs/DEVSTACK.md
  # "SQLite storage"). One process watches RUUM_SQLITE_DIR (deploy/dev/data/sqlite) and
  # replicates every <tenant>/<database>.db in it to the Garage bucket ruum-sqlite, also files
  # that appear later. No port: the control socket stays inside the container. Pinned by version
  # and digest; scripts/sqlite_restore_test.sh reads this line.
  litestream:
    image: litestream/litestream:0.5.17@sha256:4b02b9859a6b6b4087d8b8944e15f7e984bd7957cba322bbeee38b0e27b9656a
    command: replicate
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      LITESTREAM_S3_ENDPOINT: http://garage:3900
      LITESTREAM_BUCKET: ${RUUM_SQLITE_BUCKET:-ruum-sqlite}
      LITESTREAM_PATH: ""
    volumes:
      - ./litestream/litestream.yml:/etc/litestream.yml:ro
      - ./data/sqlite:/data
      - litestream-meta:/var/lib/litestream/meta
    depends_on:
      garage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "litestream", "list", "-timeout", "2"]
      interval: 3s
      timeout: 3s
      retries: 40
    mem_limit: 256m
    restart: unless-stopped
    logging: *logging

  zitadel:
    image: ghcr.io/zitadel/zitadel:v4.19.5
    command: start-from-init --masterkeyFromEnv --tlsMode disabled
    environment:
      ZITADEL_MASTERKEY: ${ZITADEL_MASTERKEY}
      ZITADEL_PORT: "8080"
      ZITADEL_EXTERNALDOMAIN: localhost
      ZITADEL_EXTERNALPORT: "8180"
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_TLS_ENABLED: "false"
      ZITADEL_DATABASE_POSTGRES_HOST: postgres
      ZITADEL_DATABASE_POSTGRES_PORT: "5432"
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${ZITADEL_DB_PASSWORD}
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: postgres
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${POSTGRES_PASSWORD}
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      ZITADEL_FIRSTINSTANCE_INSTANCENAME: Ruum
      ZITADEL_FIRSTINSTANCE_ORG_NAME: Ruum
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: ${ZITADEL_ADMIN_USERNAME}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${ZITADEL_ADMIN_PASSWORD}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL_ADDRESS: admin@ruum.localhost
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL_VERIFIED: "true"
      # A service account with a personal access token; scripts/dev.sh uses it to create the OIDC apps.
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: ruum-bootstrap
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: Ruum bootstrap
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: "2099-01-01T00:00:00Z"
      ZITADEL_FIRSTINSTANCE_PATPATH: /bootstrap/bootstrap.pat
      # Use the login UI built into Zitadel, so the stack needs no separate login container.
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "false"
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_SMTP_HOST: mailpit:1025
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_TLS: "false"
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_FROM: noreply@ruum.localhost
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_FROMNAME: Ruum
    user: "0"
    volumes:
      - ./.state/zitadel:/bootstrap
    networks:
      - default
      - sso # the mock OIDC provider (profile sso-mock)
    ports:
      - "127.0.0.1:8180:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
    mem_limit: 768m
    restart: unless-stopped
    logging: *logging

  spicedb-migrate:
    image: authzed/spicedb:v1.56.2
    command: migrate head
    environment:
      SPICEDB_DATASTORE_ENGINE: postgres
      SPICEDB_DATASTORE_CONN_URI: postgres://spicedb:${SPICEDB_DB_PASSWORD}@postgres:5432/spicedb?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *logging

  spicedb:
    image: authzed/spicedb:v1.56.2
    command: serve --http-enabled
    environment:
      SPICEDB_GRPC_PRESHARED_KEY: ${SPICEDB_PRESHARED_KEY}
      SPICEDB_DATASTORE_ENGINE: postgres
      SPICEDB_DATASTORE_CONN_URI: postgres://spicedb:${SPICEDB_DB_PASSWORD}@postgres:5432/spicedb?sslmode=disable
      SPICEDB_DATASTORE_CONN_POOL_READ_MAX_OPEN: "10"
      SPICEDB_DATASTORE_CONN_POOL_WRITE_MAX_OPEN: "5"
    ports:
      - "127.0.0.1:50051:50051" # gRPC
      - "127.0.0.1:8543:8443" # HTTP gateway
    depends_on:
      spicedb-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=localhost:50051"]
      interval: 3s
      timeout: 3s
      retries: 40
    mem_limit: 256m
    restart: unless-stopped
    logging: *logging

  nats:
    image: nats:2.15.2-alpine
    command: ["-c", "/etc/nats/nats.conf"]
    volumes:
      - ./nats/nats.conf:/etc/nats/nats.conf:ro
      - nats:/data
    ports:
      - "127.0.0.1:4222:4222" # client
      - "127.0.0.1:8222:8222" # monitoring
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 3s
      timeout: 3s
      retries: 40
    mem_limit: 256m
    restart: unless-stopped
    logging: *logging

  openbao:
    image: openbao/openbao:2.7.2
    command: server -dev
    environment:
      BAO_DEV_ROOT_TOKEN_ID: ${BAO_DEV_ROOT_TOKEN}
      BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      BAO_ADDR: http://127.0.0.1:8200
    cap_add:
      - IPC_LOCK
    ports:
      - "127.0.0.1:8200:8200"
    healthcheck:
      test: ["CMD", "bao", "status"]
      interval: 3s
      timeout: 3s
      retries: 40
    mem_limit: 256m
    restart: unless-stopped
    logging: *logging

  mailpit:
    image: axllent/mailpit:v1.32.0
    environment:
      MP_MAX_MESSAGES: "2000"
    ports:
      - "127.0.0.1:8025:8025" # web UI and API
      - "127.0.0.1:1025:1025" # SMTP
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 3s
      timeout: 3s
      retries: 40
    mem_limit: 128m
    restart: unless-stopped
    logging: *logging

  caddy:
    image: caddy:2.11.7-alpine
    environment:
      RUUM_UPSTREAM: ${RUUM_UPSTREAM:-host.docker.internal:8490}
      RUUM_DAV_UPSTREAM: ${RUUM_DAV_UPSTREAM:-host.docker.internal:8492}
      RUUM_WEB_UPSTREAM: ${RUUM_WEB_UPSTREAM:-host.docker.internal:5173}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 3s
      timeout: 3s
      retries: 40
    mem_limit: 128m
    restart: unless-stopped
    logging: *logging

  # A mock OIDC provider for automated sign-in tests through an external identity provider
  # (design 13: "a mock OIDC provider for SSO tests"). Not started by default:
  # scripts/dev.sh up --sso-mock. scripts/zitadel_idps.sh adds it to Zitadel as "Mock SSO".
  # The issuer is http://oidc-mock.localhost:8190/ruum. Browsers send *.localhost to the loopback
  # address (the host port); in the network `sso` the alias reaches the container. The issuer
  # comes from the Host header, so both sides see the same issuer.
  oidc-mock:
    profiles: ["sso-mock"]
    image: ghcr.io/navikt/mock-oauth2-server:6.1.2
    environment:
      SERVER_PORT: "8190"
      JSON_CONFIG: '{"interactiveLogin":true,"httpServer":"NettyWrapper"}'
    ports:
      - "127.0.0.1:8190:8190"
    networks:
      sso:
        aliases:
          - oidc-mock.localhost
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8190/isalive"]
      interval: 3s
      timeout: 3s
      retries: 40
    mem_limit: 256m
    restart: unless-stopped
    logging: *logging

  # Step 4 (repos and builds). Not started by default: scripts/dev.sh up --step4
  forgejo:
    profiles: ["step4"]
    image: codeberg.org/forgejo/forgejo:15.0.11
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__server__ROOT_URL: http://localhost:3001/
      FORGEJO__server__HTTP_PORT: "3000"
      FORGEJO__server__SSH_PORT: "2222"
      FORGEJO__mailer__ENABLED: "true"
      FORGEJO__mailer__PROTOCOL: smtp
      FORGEJO__mailer__SMTP_ADDR: mailpit
      FORGEJO__mailer__SMTP_PORT: "1025"
      FORGEJO__mailer__FROM: forgejo@ruum.localhost
    volumes:
      - forgejo:/data
    ports:
      - "127.0.0.1:3001:3000" # web
      - "127.0.0.1:2222:22" # SSH
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/healthz"]
      interval: 5s
      timeout: 3s
      retries: 40
    mem_limit: 512m
    restart: unless-stopped
    logging: *logging

  # ---------------------------------------------------------------------------------------------
  # Profile apps (step 3). Not started by default: scripts/dev.sh up --apps. Step 1 and 2 work
  # does not pay its RAM and disk (docs/STEP3.md area 8). Keep every service of the profile in
  # this section. Card I-5 added the telemetry stack below; card I-4 adds the runtime services.
  #
  # The telemetry stack (docs/DEVSTACK.md "Telemetry stack (profile apps)"): the OpenTelemetry
  # Collector and Loki, Mimir and Tempo, each with multi-tenancy on (the header X-Scope-OrgID is
  # the storage tenant; no default tenant). They are on the network `telemetry` only, never on an
  # app network: the processor role of ruum-server (on the host) is the only writer, through the
  # Collector's published port. The images have no shell, so they have no healthcheck;
  # `dev.sh up --apps` waits for their ready endpoints instead. Each image is pinned by version
  # and by the digest of its multi-arch index (linux/amd64 and linux/arm64).
  loki:
    profiles: ["apps"]
    image: grafana/loki:3.7.10@sha256:b43c257ccfc925d4a50b8717cac61a3b51df8c48d01847936057e5c4075a24a7
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./telemetry/loki.yaml:/etc/loki/loki.yaml:ro
      - loki:/loki
    ports:
      - "127.0.0.1:${RUUM_LOKI_PORT:-3100}:3100" # query and push API
    networks:
      - telemetry
    mem_limit: 384m
    restart: unless-stopped
    logging: *logging

  mimir:
    profiles: ["apps"]
    image: grafana/mimir:3.2.5@sha256:245ce851e2f5d27db6bd37720d9ab12bcb017f4b4e20340d9b58266435dbe4b6
    command: ["-config.file=/etc/mimir/mimir.yaml"]
    volumes:
      - ./telemetry/mimir.yaml:/etc/mimir/mimir.yaml:ro
      - mimir:/data
    ports:
      - "127.0.0.1:${RUUM_MIMIR_PORT:-9009}:9009" # query (/prometheus) and push API
    networks:
      - telemetry
    mem_limit: 512m
    restart: unless-stopped
    logging: *logging

  tempo:
    profiles: ["apps"]
    image: grafana/tempo:2.10.10@sha256:12b0820f13ffa10ce956b6e9acc3b03f3cffded99109be6cc09d106fe56e5d38
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./telemetry/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo:/var/tempo
    ports:
      - "127.0.0.1:${RUUM_TEMPO_PORT:-3200}:3200" # query API (its OTLP receiver is not published)
    networks:
      - telemetry
    mem_limit: 384m
    restart: unless-stopped
    logging: *logging

  otel-collector:
    profiles: ["apps"]
    image: otel/opentelemetry-collector-contrib:0.165.0@sha256:e40d61f10c9a617cca1ffd1be4d7e2b3a4b0f0001798ff07e58cabe82e618cea
    command: ["--config=/etc/otelcol/collector.yaml"]
    volumes:
      - ./otel/collector.yaml:/etc/otelcol/collector.yaml:ro
    ports:
      - "127.0.0.1:${RUUM_OTLP_GRPC_PORT:-4317}:4317" # OTLP gRPC (from the processor only)
      - "127.0.0.1:${RUUM_OTLP_HTTP_PORT:-4318}:4318" # OTLP HTTP (from the processor only)
    networks:
      - telemetry
    depends_on:
      - loki
      - mimir
      - tempo
    # 384 MB: memory_limiter holds the Go heap at 160 MiB, but the container (heap, runtime and
    # page cache) was seen at 224 MiB, too close to the earlier 256 MB limit.
    mem_limit: 384m
    restart: unless-stopped
    logging: *logging
  # End of the profile apps.
  # ---------------------------------------------------------------------------------------------

networks:
  data:
  # Zitadel and the mock OIDC provider. Zitadel's HTTP client refuses private addresses (its
  # SSRF deny list: 10/8, 172.16/12, 192.168/16, loopback), so this network uses TEST-NET-3
  # (RFC 5737), a range that is never routed on the internet. The deny list stays as it is.
  sso:
    ipam:
      config:
        - subnet: 203.0.113.0/24
  # The telemetry stores and the Collector (profile apps, card I-5). No app network joins it.
  telemetry:

volumes:
  postgres:
  postgres-data:
  garage-meta:
  garage-data:
  litestream-meta:
  nats:
  caddy-data:
  caddy-config:
  forgejo:
  # Profile apps (card I-5): the telemetry stores. `dev.sh clean` deletes them.
  loki:
  mimir:
  tempo:
