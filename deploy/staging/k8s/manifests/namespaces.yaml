# Namespaces of staging with Pod Security labels (review 1 S-9): restricted everywhere Ruum
# runs, the operators' namespaces too. local-path-storage is privileged (hostPath helper pods)
# and is in manifests/local-path-storage.yaml.
---
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
---
