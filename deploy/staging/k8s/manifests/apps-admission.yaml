# Admission rules of the app sandboxes (backlog S-83, Kimi run 14 I-6 finding 4; backlog I6-1;
# backlog S-89 and I6-20, docs/STEP3.md "The sandbox supervisor", decision 0006 I).
# Restricted Pod Security does not require a runtime class, so without this a pod in ruum-apps
# that lacks runtimeClassName would run app code on the node's kernel. Every pod created or
# changed in ruum-apps (whoever creates it: the runtime driver, an operator, a bug) must run in
# gVisor, use the ServiceAccount ruum-sandbox (no rights), carry no automounted service account
# token, and have the shape of a sandbox with its supervisor:
# - volumes are only emptyDir and one projected volume whose only source is a service account
#   token of the audience ruum-supervisor with expirationSeconds 600 (the API server does not
#   accept that audience; the kubelet issues it for this pod only, and the server's supervisor
#   listener checks it with a TokenReview). No Secret volume, no other projected source;
# - no environment value from another object (valueFrom) and no envFrom, in any container;
# - exactly one init container, named ruum-supervisor, which mounts only ruum-bin; no ephemeral
#   containers; every app container mounts ruum-bin, read-only; exactly one projected volume;
# - every container keeps the termination message path /dev/termination-log and the policy File
#   (never FallbackToLogsOnError, which would copy unredacted logs into the pod status).
# No Secret holds a value of a sandbox (the values are sealed into the records under a key the
# runtime identity does not hold), so a pod's creator gains nothing by mounting one; the second
# policy (ruum-apps-secrets) admits no Secret in ruum-apps at all, so a stray or forged Secret
# (also a service account token Secret) cannot appear there.
# ops/gvisor-check.sh checks the rules live (server-side dry runs that must be refused, and a
# positive control); its control pod without gVisor runs in ops.
# k8s/apply.sh applies this file after the runtime class.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: ruum-apps-gvisor
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: ruum-apps
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods", "pods/ephemeralcontainers"]
  variables:
    # Every container of the pod, init containers included.
    - name: all
      expression: "object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : [])"
  validations:
    - expression: "has(object.spec.runtimeClassName) && object.spec.runtimeClassName == 'gvisor'"
      message: "pods in ruum-apps run in gVisor only (runtimeClassName: gvisor; backlog S-83)"
      reason: Forbidden
    - expression: "has(object.spec.automountServiceAccountToken) && object.spec.automountServiceAccountToken == false"
      message: "pods in ruum-apps carry no automounted service account token (automountServiceAccountToken: false)"
      reason: Forbidden
    - expression: "!has(object.spec.hostNetwork) || object.spec.hostNetwork == false"
      message: "pods in ruum-apps never use the node's network"
      reason: Forbidden
    - expression: "!has(object.spec.ephemeralContainers) || size(object.spec.ephemeralContainers) == 0"
      message: "pods in ruum-apps have no ephemeral containers"
      reason: Forbidden
    - expression: "has(object.spec.initContainers) && size(object.spec.initContainers) == 1 && object.spec.initContainers[0].name == 'ruum-supervisor' && has(object.spec.initContainers[0].volumeMounts) && size(object.spec.initContainers[0].volumeMounts) == 1 && object.spec.initContainers[0].volumeMounts[0].name == 'ruum-bin'"
      message: "pods in ruum-apps have exactly the init container ruum-supervisor, which mounts only ruum-bin"
      reason: Forbidden
    - expression: "has(object.spec.serviceAccountName) && object.spec.serviceAccountName == 'ruum-sandbox'"
      message: "pods in ruum-apps use the ServiceAccount ruum-sandbox only (backlog S-89)"
      reason: Forbidden
    - expression: "!has(object.spec.volumes) || object.spec.volumes.all(v, has(v.emptyDir) || (has(v.projected) && has(v.projected.sources) && size(v.projected.sources) == 1 && has(v.projected.sources[0].serviceAccountToken) && !has(v.projected.sources[0].secret) && !has(v.projected.sources[0].configMap) && !has(v.projected.sources[0].downwardAPI) && !has(v.projected.sources[0].clusterTrustBundle) && v.projected.sources[0].serviceAccountToken.audience == 'ruum-supervisor' && has(v.projected.sources[0].serviceAccountToken.expirationSeconds) && v.projected.sources[0].serviceAccountToken.expirationSeconds == 600))"
      message: "pods in ruum-apps mount only emptyDir volumes and the supervisor's projected token (audience ruum-supervisor, 600 s); no Secret"
      reason: Forbidden
    - expression: "has(object.spec.volumes) && object.spec.volumes.filter(v, has(v.projected)).size() == 1"
      message: "pods in ruum-apps have exactly one projected volume (the supervisor's token)"
      reason: Forbidden
    - expression: "variables.all.all(c, !has(c.envFrom) || size(c.envFrom) == 0)"
      message: "pods in ruum-apps take no envFrom"
      reason: Forbidden
    - expression: "variables.all.all(c, !has(c.env) || c.env.all(e, !has(e.valueFrom)))"
      message: "pods in ruum-apps take no environment value from another object (the supervisor gives the secret values)"
      reason: Forbidden
    - expression: "variables.all.all(c, (!has(c.terminationMessagePath) || c.terminationMessagePath == '/dev/termination-log') && (!has(c.terminationMessagePolicy) || c.terminationMessagePolicy == 'File'))"
      message: "pods in ruum-apps keep the termination message path /dev/termination-log and the policy File"
      reason: Forbidden
    - expression: "object.spec.containers.all(c, has(c.volumeMounts) && c.volumeMounts.exists(m, m.name == 'ruum-bin') && c.volumeMounts.all(m, m.name != 'ruum-bin' || (has(m.readOnly) && m.readOnly == true)))"
      message: "pods in ruum-apps mount the supervisor (ruum-bin) read-only in every app container"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: ruum-apps-gvisor
spec:
  policyName: ruum-apps-gvisor
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: ruum-apps
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: ruum-apps-secrets
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: ruum-apps
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["secrets"]
  validations:
    - expression: "false"
      message: "no Secret in ruum-apps: the values of a sandbox are sealed into its record (backlog S-89)"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: ruum-apps-secrets
spec:
  policyName: ruum-apps-secrets
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: ruum-apps
