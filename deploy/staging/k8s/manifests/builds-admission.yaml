# Admission rules of the build pods (card I6-13; crates/ruum-runtime src/builder/kube.rs). Every
# pod created or changed in ruum-builds (the Kubernetes builder of ruum-server makes them) must
# have the shape of a build: gVisor, the ServiceAccount ruum-build (no rights) with no token, no
# host namespace, no init or ephemeral container, one container whose image is the node22 base
# by digest from the cluster registry, only emptyDir volumes, no environment value from another
# object and no envFrom, the termination message from its file. No Secret is admitted in
# ruum-builds: a build has none (docs/STEP3.md "How an app runs" rule 7).
# k8s/apply.sh applies this file after the runtime class; ops/build-check.sh proves the rules with
# server-side dry runs and a positive control.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: ruum-builds-shape
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: ruum-builds
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods", "pods/ephemeralcontainers"]
  validations:
    - expression: "has(object.spec.runtimeClassName) && object.spec.runtimeClassName == 'gvisor'"
      message: "pods in ruum-builds run in gVisor only (runtimeClassName: gvisor)"
      reason: Forbidden
    - expression: "has(object.spec.automountServiceAccountToken) && object.spec.automountServiceAccountToken == false"
      message: "pods in ruum-builds carry no service account token"
      reason: Forbidden
    - expression: "has(object.spec.serviceAccountName) && object.spec.serviceAccountName == 'ruum-build'"
      message: "pods in ruum-builds use the ServiceAccount ruum-build only"
      reason: Forbidden
    - expression: "(!has(object.spec.hostNetwork) || !object.spec.hostNetwork) && (!has(object.spec.hostPID) || !object.spec.hostPID) && (!has(object.spec.hostIPC) || !object.spec.hostIPC)"
      message: "pods in ruum-builds never use a host namespace"
      reason: Forbidden
    - expression: "(!has(object.spec.initContainers) || size(object.spec.initContainers) == 0) && (!has(object.spec.ephemeralContainers) || size(object.spec.ephemeralContainers) == 0) && size(object.spec.containers) == 1"
      message: "pods in ruum-builds have exactly one container and no init or ephemeral container"
      reason: Forbidden
    - expression: "object.spec.containers.all(c, c.image.matches('^registry\\\\.ruum\\\\.internal:5000/ruum-base/node22@sha256:[0-9a-f]{64}$'))"
      message: "pods in ruum-builds run the node22 base image by digest from the cluster registry only"
      reason: Forbidden
    - expression: "!has(object.spec.volumes) || object.spec.volumes.all(v, has(v.emptyDir))"
      message: "pods in ruum-builds mount only emptyDir volumes; no Secret, no projected token"
      reason: Forbidden
    - expression: "object.spec.containers.all(c, (!has(c.envFrom) || size(c.envFrom) == 0) && (!has(c.env) || c.env.all(e, !has(e.valueFrom))))"
      message: "pods in ruum-builds take no environment value from another object"
      reason: Forbidden
    - expression: "object.spec.containers.all(c, (!has(c.terminationMessagePath) || c.terminationMessagePath == '/dev/termination-log') && (!has(c.terminationMessagePolicy) || c.terminationMessagePolicy == 'File'))"
      message: "pods in ruum-builds keep the termination message path /dev/termination-log and the policy File"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: ruum-builds-shape
spec:
  policyName: ruum-builds-shape
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: ruum-builds
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: ruum-builds-secrets
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: ruum-builds
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["secrets"]
  validations:
    - expression: "false"
      message: "no Secret in ruum-builds: a build has no secret (card I6-13)"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: ruum-builds-secrets
spec:
  policyName: ruum-builds-secrets
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: ruum-builds
