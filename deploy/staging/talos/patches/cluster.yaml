# Machine config patch for every staging node (all control plane and worker).
# Talos v1.14 config: each setting lives in its own document. The v1alpha1 document keeps only
# the fields that have no document of their own (etcd here). A setting in both places is an
# error ("... is already set in v1alpha1 config"), so never add machine.kubelet (the kubelet's
# settings are the KubeletConfig document below),
# machine.install, machine.network, machine.features.kubePrism, cluster.apiServer,
# cluster.network or cluster.discovery here. tests/run.sh renders the config and runs
# `talosctl validate --mode cloud` on it.
cluster:
  etcd:
    advertisedSubnets:
      # etcd, kubelet and Flannel use the private network (plan 3.3).
      - 10.20.1.0/24
---
# The kubelet's PID limit of every pod (backlog I6-19): a pod's cgroup holds at most this many
# host processes and threads. Under gVisor the app's own processes live in the sandbox's kernel
# (the supervisor's RLIMIT_NPROC bounds them, 512 by default); this bounds the host side of a
# sandbox (the Sentry's and the gofer's threads), so a hostile app cannot use up the node's PIDs.
# 4096 leaves room for the largest system pods (the Postgres pods of the data cluster: one
# process per connection) and for gVisor's threads. The orchestrator applies it through the
# admin tunnel (up.sh: talos_machine_configuration_apply in place on each node); it is checked by
# tests/talos-validate.sh and live by ops/gvisor-check.sh (each kubelet's configz).
apiVersion: v1alpha1
kind: KubeletConfig
config:
  podPidsLimit: 4096
---
apiVersion: v1alpha1
kind: KubeNodeConfig
nodeIP:
  validSubnets:
    - 10.20.1.0/24
---
# Flannel's VXLAN must use the private network. Without this, flanneld takes the interface of the
# default route (eth0, the public address), and the firewall drops the VXLAN packets between the
# nodes: no pod traffic between nodes (the API server could not reach the cert-manager webhook).
# 10.20.0.1 is the gateway of the Hetzner network; only the private interface routes to it.
# A change here reaches a running cluster only after `talosctl upgrade-k8s` (ops/upgrade-k8s.sh):
# Talos does not update the bootstrap manifests by itself.
apiVersion: v1alpha1
kind: KubeFlannelCNIConfig
extraArgs:
  - --iface-can-reach=10.20.0.1
---
apiVersion: v1alpha1
kind: TimeSyncConfig
ntp:
  servers:
    - ntp1.hetzner.de
    - ntp2.hetzner.com
    - ntp3.hetzner.net
---
apiVersion: v1alpha1
kind: SysctlConfig
params:
  # Caddy's on-demand TLS and many tenant hosts; also useful for NATS.
  net.core.somaxconn: "4096"
  # gVisor (card I-6): runsc starts its gofer and sandbox in new user namespaces. Talos sets this
  # to 0, and then every pod of the runtime class gvisor fails with "fork/exec /proc/self/exe: no
  # space left on device". Pods cannot use it themselves: the kubelet runs with seccompDefault, and
  # RuntimeDefault refuses unshare/clone of a user namespace without CAP_SYS_ADMIN. Only the
  # privileged system pods (flannel, kube-proxy) are unconfined, and they already hold every right.
  user.max_user_namespaces: "11255"
---
# Pod Security "restricted" for every namespace except kube-system (the generated default
# enforces only "baseline").
apiVersion: v1alpha1
kind: KubeAdmissionControlConfig
name: PodSecurity
configuration:
  apiVersion: pod-security.admission.config.k8s.io/v1
  kind: PodSecurityConfiguration
  defaults:
    enforce: restricted
    enforce-version: latest
    audit: restricted
    audit-version: latest
    warn: restricted
    warn-version: latest
