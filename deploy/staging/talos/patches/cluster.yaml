# Machine config patch for every staging node (all control plane and worker).
# Talos v1.14 config: each setting lives in its own document. The v1alpha1 document keeps only
# the fields that have no document of their own (etcd here). A setting in both places is an
# error ("... is already set in v1alpha1 config"), so never add machine.kubelet,
# machine.install, machine.network, machine.features.kubePrism, cluster.apiServer,
# cluster.network or cluster.discovery here. tests/run.sh renders the config and runs
# `talosctl validate --mode cloud` on it.
cluster:
  etcd:
    advertisedSubnets:
      # etcd, kubelet and Flannel use the private network (plan 3.3).
      - 10.20.1.0/24
---
apiVersion: v1alpha1
kind: KubeNodeConfig
nodeIP:
  validSubnets:
    - 10.20.1.0/24
---
# Flannel's VXLAN must use the private network. Without this, flanneld takes the interface of the
# default route (eth0, the public address), and the firewall drops the VXLAN packets between the
# nodes: no pod traffic between nodes (the API server could not reach the cert-manager webhook).
# 10.20.0.1 is the gateway of the Hetzner network; only the private interface routes to it.
# A change here reaches a running cluster only after `talosctl upgrade-k8s` (ops/upgrade-k8s.sh):
# Talos does not update the bootstrap manifests by itself.
apiVersion: v1alpha1
kind: KubeFlannelCNIConfig
extraArgs:
  - --iface-can-reach=10.20.0.1
---
apiVersion: v1alpha1
kind: TimeSyncConfig
ntp:
  servers:
    - ntp1.hetzner.de
    - ntp2.hetzner.com
    - ntp3.hetzner.net
---
apiVersion: v1alpha1
kind: SysctlConfig
params:
  # Caddy's on-demand TLS and many tenant hosts; also useful for NATS.
  net.core.somaxconn: "4096"
---
# Pod Security "restricted" for every namespace except kube-system (the generated default
# enforces only "baseline").
apiVersion: v1alpha1
kind: KubeAdmissionControlConfig
name: PodSecurity
configuration:
  apiVersion: pod-security.admission.config.k8s.io/v1
  kind: PodSecurityConfiguration
  defaults:
    enforce: restricted
    enforce-version: latest
    audit: restricted
    audit-version: latest
    warn: restricted
    warn-version: latest
