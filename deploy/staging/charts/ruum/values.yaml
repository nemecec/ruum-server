# deploy-chart.sh sets the two image references, always by digest (review 1 S-7):
#   ghcr.io/nemecec/ruum-server@sha256:...   ghcr.io/nemecec/ruum-edge@sha256:...
images:
  server: ""
  edge: ""
# The commit of the images, recorded in the release (and in the ConfigMap ruum-release).
commit: ""
# The commit that was live before this deploy (deploy-chart.sh reads it from ruum-release under
# the deploy lock). Recorded in ruum-release as `previous`.
previousCommit: ""
# Only deploy-chart.sh sets it, in a values file of its own: render the migration Job
# (migrate-job.yaml) instead of the release. Never set for `helm upgrade`.
migrationJob: false
migrationJobName: ""
# The database role of the serving pods (k8s/apply.sh, cnpg.yaml). The migration Job logs in as
# the owner ruum and takes the write rights on _sqlx_migrations from this role after each run.
database:
  runtimeRole: ruum_app

hosts:
  public: staging.ruum.space
  auth: auth.staging.ruum.space
  dav: dav.staging.ruum.space
  content: content.staging.ruumapps.net

# ACME (review 2 R-3): staging never uses production's Let's Encrypt quota.
#   letsencrypt-staging: the Let's Encrypt staging CA (not trusted by browsers; for bring-up)
#   zerossl:             ZeroSSL (trusted; separate limits; for the person's sign-in test)
acme:
  issuer: letsencrypt-staging
  email: ""

# Public sources allowed to reach the Zitadel console and admin APIs (review stgsec M-4). Empty:
# they answer 403 to every public address. The operations run on the person's Mac, whose address
# changes, and reach Zitadel in the cluster (zitadel-bootstrap.sh and the person use
# `deploy/staging/tool.sh --port 8080 kubectl -n auth port-forward --address 0.0.0.0 svc/zitadel 8080`).
adminSources: []

# The load balancer's private subnet: the only source allowed to send proxy protocol headers.
proxyProtocolFrom: 10.20.1.0/24

server:
  # At least two (design 12.7); the chart refuses fewer.
  replicas: 2
  # The pause before SIGTERM, and the drain after it (RUUM_SHUTDOWN_GRACE_SECONDS; longer than
  # the longest long poll, 30 seconds). terminationGracePeriodSeconds is their sum plus 10.
  preStopSeconds: 10
  shutdownGraceSeconds: 35
  resources:
    requests: { cpu: 100m, memory: 200Mi }
    limits: { memory: 512Mi }
  # New content hosts per hour that may get a certificate (the ask endpoint, review 1 B-5), for
  # all replicas together. ruum-server counts in memory, per process, so server.yaml gives each
  # replica tlsAskNewHostsPerHour / replicas (at least 1). During a rollout the surge pod adds
  # one more share, and a host allowed by one replica counts again on another. A shared counter
  # is backlog O-28.
  tlsAskNewHostsPerHour: 20

edge:
  # A DaemonSet: one edge on every node (design 12.7, backlog O-26; see edge.yaml).
  # The pause before SIGTERM and Caddy's grace_period for open connections.
  preStopSeconds: 5
  shutdownGraceSeconds: 30
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }
