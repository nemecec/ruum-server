# deploy-chart.sh sets the two image references, always by digest (review 1 S-7):
#   ghcr.io/nemecec/ruum-server@sha256:...   ghcr.io/nemecec/ruum-edge@sha256:...
images:
  server: ""
  edge: ""
# The commit of the images, recorded in the release (and in the ConfigMap ruum-release).
commit: ""

hosts:
  public: staging.ruum.space
  auth: auth.staging.ruum.space
  dav: dav.staging.ruum.space
  content: content.staging.ruumapps.net

# ACME (review 2 R-3): staging never uses production's Let's Encrypt quota.
#   letsencrypt-staging: the Let's Encrypt staging CA (not trusted by browsers; for bring-up)
#   zerossl:             ZeroSSL (trusted; separate limits; for the person's sign-in test)
acme:
  issuer: letsencrypt-staging
  email: ""

# Public sources allowed to reach the Zitadel console and admin APIs (review stgsec M-4). Empty:
# they answer 403 to every public address. The operations run on the person's Mac, whose address
# changes, and reach Zitadel in the cluster (zitadel-bootstrap.sh and the person use
# `deploy/staging/tool.sh --port 8080 kubectl -n auth port-forward --address 0.0.0.0 svc/zitadel 8080`).
adminSources: []

# The load balancer's private subnet: the only source allowed to send proxy protocol headers.
proxyProtocolFrom: 10.20.1.0/24

server:
  resources:
    requests: { cpu: 100m, memory: 200Mi }
    limits: { memory: 512Mi }
  # New content hosts per hour that may get a certificate (the ask endpoint, review 1 B-5).
  tlsAskNewHostsPerHour: 20

edge:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }
