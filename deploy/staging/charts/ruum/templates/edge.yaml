# The edge (plan 5.7): Caddy with the web UI in /srv. Updates without downtime (design 12.7,
# backlog O-26):
# - certificates live in Kubernetes Secrets of the edge namespace (the Caddy module
#   deploy/images/caddy-secret-storage; never in the tenant blob bucket, review 1 S-4 / stgsec
#   M-8): a restart loads them and issues nothing, and every edge pod answers the HTTP-01
#   challenges of the others. The ServiceAccount ruum-edge and its Role (Secrets and Leases of
#   this namespace only) are in charts/platform, because the deployer has no access to Secrets.
# - a DaemonSet, one edge on every node (three on staging, so at least two serve at any time):
#   the Services use externalTrafficPolicy Local and the load balancer's health checks find the
#   nodes with a serving edge. With a Deployment of two, the node that loses its edge in a rollout
#   would keep getting connections until the check (3 x 10 s) marks it down. The DaemonSet
#   update starts the new pod on the same node first (maxSurge 1, maxUnavailable 0), so each
#   node keeps a ready edge through a rollout.
# - ready only with certificates (backlog O-53): after a node reboot an edge started while the
#   API server refused connections, never loaded its certificates from the Secrets and served
#   TLS without them, and the load balancer's TCP check kept the node in rotation. Now:
#   - the init container waits (at most 120 s, a hard limit) until the API server answers, so
#     Caddy normally starts with a reachable certificate storage;
#   - the probes ask Caddy for the ready path over HTTPS without a server name; Caddy answers
#     with the public host's certificate (default_sni) or fails the handshake. So the readiness
#     probe fails until the certificates are loaded, which proves that the API server was
#     reachable. It does not ask the API server again: an API server that is down later must
#     not take every edge out of the load balancer, while Caddy keeps its certificates in memory;
#   - Caddy does not retry a failed load, so the startup probe (5 minutes, which also covers the
#     first ACME orders of a new cluster) and the liveness probe (1 minute) restart it;
#   - the load balancer checks the same path over HTTPS on port 443 (tofu/cluster), so a node
#     whose edge has no certificates leaves the rotation.
# - shutdown: a pause before SIGTERM, then Caddy's grace_period for open connections.
# The ACME CA is never production Let's Encrypt (review 2 R-3).
{{- $grace := int .Values.edge.shutdownGraceSeconds }}
{{- $pause := int .Values.edge.preStopSeconds }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: caddy
  namespace: edge
data:
  Caddyfile: |
    {{- include "ruum.caddyfile" . | nindent 4 }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ruum-edge
  namespace: edge
  labels: { app: ruum-edge }
spec:
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  minReadySeconds: 5
  selector:
    matchLabels: { app: ruum-edge }
  template:
    metadata:
      labels: { app: ruum-edge }
      annotations:
        ruum.space/caddyfile: {{ include "ruum.caddyfile" . | sha256sum | trunc 16 }}
        ruum.space/commit: {{ .Values.commit | quote }}
    spec:
      # The token reaches only the Secrets and Leases of this namespace (charts/platform,
      # edge-rbac.yaml): the certificate storage.
      serviceAccountName: ruum-edge
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: {{ add $pause $grace 10 }}
      tolerations:
        # Staging schedules workloads on its control-plane nodes too.
        - { key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule }
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        # Waits until the API server answers (any HTTP answer: /readyz may need credentials,
        # and this sends none), at most 120 s; then Caddy starts anyway and the probes decide.
        # The 120 s are a hard limit (Kimi re-check of O-53): each try gets what is left of
        # them (3 s at most), and timeout kills a try that hangs. wget's -T does not limit the
        # TLS handshake: its helper ssl_client waits for a server that accepts and never
        # answers. A killed wget leaves ssl_client behind, so the output goes to a file, never
        # to a pipe ($(...) would wait for ssl_client), and pkill ends the helpers.
        - name: wait-api-server
          image: {{ include "ruum.byDigest" .Values.images.edge }}
          command: [/bin/sh, -c]
          # BusyBox wget (Alpine's ssl_client) verifies the server certificate, and the cluster
          # CA is not in the system trust store: without this every try fails with "certificate
          # verify failed" and the wait always runs out (review of O-53, R-1). The API server's
          # certificate has the Service IP as an IP SAN. The CA file is mounted with the
          # ServiceAccount token; the script reads only the CA, never the token.
          env:
            - { name: SSL_CERT_FILE, value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt }
          args:
            - |
              url="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}/readyz"
              limit=120
              end=$(( $(date +%s) + limit ))
              out="no try"
              while :; do
                left=$(( end - $(date +%s) ))
                [ "$left" -gt 0 ] || break
                t=3
                [ "$left" -lt 3 ] && t="$left"
                timeout -s KILL "$t" wget -q -T "$t" -O /dev/null "$url" >/tmp/wget.out 2>&1
                rc=$?
                [ "$rc" -eq 0 ] && exit 0
                pkill -KILL -x ssl_client 2>/dev/null
                out="$(cat /tmp/wget.out)"
                case "$out" in *"server returned error: HTTP/1.1 401"* | *"server returned error: HTTP/1.1 403"*) exit 0 ;; esac
                [ "$rc" -eq 137 ] || [ -z "$out" ] && out="no answer in $t s"
                left=$(( end - $(date +%s) ))
                [ "$left" -gt 2 ] || break
                sleep 2
              done
              echo "the API server did not answer in $limit s: $out; Caddy starts anyway (backlog O-53)"
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 32Mi }
          {{- include "ruum.restricted" . | nindent 10 }}
          volumeMounts:
            # wget's output (see above); the root file system is read-only.
            - { name: init-tmp, mountPath: /tmp }
      containers:
        - name: caddy
          image: {{ include "ruum.byDigest" .Values.images.edge }}
          args: [caddy, run, --config, /etc/caddy/Caddyfile, --adapter, caddyfile]
          env:
            - { name: XDG_DATA_HOME, value: /data }
            - { name: XDG_CONFIG_HOME, value: /config }
            # The holder name of the storage locks (Leases).
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          ports:
            - { name: http, containerPort: 8080 }
            - { name: https, containerPort: 8443 }
          # Backlog O-53: HTTPS without a server name, so a handshake succeeds only with the
          # public host's certificate (see the top of this file).
          startupProbe:
            {{- include "ruum.edgeProbe" . | nindent 12 }}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            {{- include "ruum.edgeProbe" . | nindent 12 }}
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            {{- include "ruum.edgeProbe" . | nindent 12 }}
            periodSeconds: 10
            failureThreshold: 6
          lifecycle:
            preStop:
              sleep: { seconds: {{ $pause }} }
          resources:
            {{- toYaml .Values.edge.resources | nindent 12 }}
          {{- include "ruum.restricted" . | nindent 10 }}
          volumeMounts:
            - { name: caddyfile, mountPath: /etc/caddy, readOnly: true }
            - { name: data, mountPath: /data }
            - { name: config, mountPath: /config }
      volumes:
        - name: caddyfile
          configMap: { name: caddy }
        - name: data
          emptyDir: { sizeLimit: 256Mi }
        - name: config
          emptyDir: { sizeLimit: 16Mi }
        - name: init-tmp
          emptyDir: { sizeLimit: 1Mi }
---
# NodePorts behind the load balancer (tofu/cluster: 443 -> 30443, 80 -> 30081, proxy protocol).
# externalTrafficPolicy Local keeps the source address (the LB, 10.20.1.5), which the proxy
# protocol allow-list and the network policy expect; the LB health checks find the nodes that
# run a serving edge (see the DaemonSet above). Only ready edges get connections here.
# Port 80 on 30080 stays for one release (expand, then contract; design 12.7): the load balancer
# of the release before backlog O-53 sends port 80 there. Remove it once tofu/cluster sends port
# 80 to 30081 on staging.
apiVersion: v1
kind: Service
metadata:
  name: ruum-edge
  namespace: edge
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector: { app: ruum-edge }
  ports:
    - { name: http, port: 80, targetPort: http, nodePort: 30080 }
    - { name: https, port: 443, targetPort: https, nodePort: 30443 }
---
# Port 80 for the load balancer (backlog O-53): also to edges that are not ready, because a new
# cluster gets its first certificates through ACME HTTP-01 challenges on port 80, and an edge
# without certificates is not ready. Port 80 answers only those challenges, the health path and
# redirects to HTTPS.
apiVersion: v1
kind: Service
metadata:
  name: ruum-edge-http
  namespace: edge
spec:
  type: NodePort
  externalTrafficPolicy: Local
  publishNotReadyAddresses: true
  selector: { app: ruum-edge }
  ports:
    - { name: http, port: 80, targetPort: http, nodePort: 30081 }
