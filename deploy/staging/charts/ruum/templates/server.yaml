{{- include "ruum.checkCommit" . }}
{{- if and .Values.previousCommit (not (regexMatch "^[0-9a-f]{40}$" .Values.previousCommit)) }}
{{- fail "previousCommit must be empty or 40 lowercase hex characters" }}
{{- end }}
# ruum-server (plan 5.8). Updates without downtime (design 12.7, backlog O-25):
# - migrations run before the rollout in the Job of migrate-job.yaml (deploy-chart.sh), under
#   an advisory lock; the serving pods run with RUUM_MIGRATE=false and refuse to start on a
#   database without their release's migrations;
# - at least two replicas, a rolling update that never goes below them (maxUnavailable 0),
#   spread over the nodes, and a disruption budget;
# - shutdown: the preStop pause takes the pod out of the Service before SIGTERM; then the
#   server takes no new connections and lets open requests finish (RUUM_SHUTDOWN_GRACE_SECONDS).
# Migrations follow expand and contract (README "Deploy"): the previous image must work on the
# new schema, because old and new pods serve side by side and a failed rollout rolls the image
# back but not the schema (review 2 U-3).
{{- $grace := int .Values.server.shutdownGraceSeconds }}
{{- $pause := int .Values.server.preStopSeconds }}
{{- if lt (int .Values.server.replicas) 2 }}
{{- fail "server.replicas must be at least 2 (design 12.7)" }}
{{- end }}
{{- /* The ask limit is counted in each process (review of O-25, change 4; backlog O-28): each
       replica gets its share, so all of them together allow about tlsAskNewHostsPerHour. */}}
{{- $askPerReplica := max 1 (div (int .Values.server.tlsAskNewHostsPerHour) (int .Values.server.replicas)) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ruum-server
  namespace: ruum
  labels: { app: ruum-server }
  annotations:
    ruum.space/commit: {{ .Values.commit | quote }}
spec:
  replicas: {{ .Values.server.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  minReadySeconds: 5
  selector:
    matchLabels: { app: ruum-server }
  template:
    metadata:
      labels: { app: ruum-server }
      annotations:
        ruum.space/commit: {{ .Values.commit | quote }}
    spec:
      automountServiceAccountToken: false
      # The preStop pause, the drain and a margin (design 12.7).
      terminationGracePeriodSeconds: {{ add $pause $grace 10 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: ruum-server }
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: server
          image: {{ include "ruum.byDigest" .Values.images.server }}
          # Every RUUM_* name here and in ruum-server-env must be one the server reads, and every
          # name the server needs in production must be set: crates/ruum-server/env-names.txt,
          # checked by tests/server-env.sh. Not set on purpose:
          # - RUUM_OIDC_CLIENT_SECRET: ruum-web is a public client with PKCE (zitadel-bootstrap.sh);
          # - RUUM_OIDC_REDIRECT_URI: the default <RUUM_PUBLIC_URL>/v1/auth/callback is the URI
          #   that zitadel-bootstrap.sh registers;
          # - RUUM_DBHOST_URL and a KEK (RUUM_LOCAL_KEK_FILE, RUUM_OPENBAO_*): staging runs step 1
          #   (decision 0007) and has no data cluster, so createDatabase answers 422 and no tenant
          #   key is made. Add them together with a data cluster.
          envFrom:
            # DATABASE_URL (the role ruum_app: data rights only, no DDL, read-only
            # _sqlx_migrations; the owner's DSN is only in the migration Job), RUUM_S3_ACCESS_KEY_ID, RUUM_S3_SECRET_ACCESS_KEY,
            # RUUM_SPICEDB_PRESHARED_KEY, RUUM_TOKEN_SIGNING_KEY, RUUM_CONTENT_SIGNING_KEY,
            # RUUM_SIGNUP_ALLOWED_EMAILS, RUUM_SIGNUP_ALLOWED_UNVERIFIED_EMAILS (k8s/apply.sh).
            - secretRef: { name: ruum-server-env }
          env:
            - { name: RUST_LOG, value: "info" }
            - { name: RUUM_BIND, value: "0.0.0.0:8491" }
            - { name: RUUM_DAV_BIND, value: "0.0.0.0:8492" }
            - { name: RUUM_INTERNAL_BIND, value: "0.0.0.0:8493" }
            - { name: RUUM_TLS_ASK_NEW_HOSTS_PER_HOUR, value: {{ $askPerReplica | quote }} }
            - { name: RUUM_PUBLIC_URL, value: "https://{{ .Values.hosts.public }}" }
            - { name: RUUM_DAV_URL, value: "https://{{ .Values.hosts.dav }}/" }
            - { name: RUUM_CONTENT_URL, value: "https://{{ .Values.hosts.content }}" }
            - { name: RUUM_OIDC_ISSUER, value: "https://{{ .Values.hosts.auth }}" }
            - name: RUUM_OIDC_CLIENT_ID
              valueFrom: { secretKeyRef: { name: ruum-oidc, key: client-id } }
            # The Zitadel IdP IDs for /v1/auth/login?idp=google|microsoft (zitadel-bootstrap.sh
            # writes them). Not optional: without them the sign-in stops at Zitadel's choice page.
            - name: RUUM_OIDC_IDP_GOOGLE
              valueFrom: { secretKeyRef: { name: ruum-oidc, key: idp-google } }
            - name: RUUM_OIDC_IDP_MICROSOFT
              valueFrom: { secretKeyRef: { name: ruum-oidc, key: idp-microsoft } }
            # The migration Job runs the migrations (migrate-job.yaml); the server only checks them.
            # Without DATABASE_URL it refuses to start (no in-memory fallback in a cluster).
            - { name: RUUM_MIGRATE, value: "false" }
            - { name: RUUM_MIGRATIONS_DIR, value: /app/migrations }
            - { name: RUUM_SHUTDOWN_GRACE_SECONDS, value: {{ $grace | quote }} }
            # The server talks to SpiceDB's HTTP gateway, not gRPC (ruum_core::authz::spicedb).
            - { name: RUUM_SPICEDB_HTTP_URL, value: "http://spicedb.authz.svc.cluster.local:8443" }
            - { name: RUUM_S3_ENDPOINT, value: "https://hel1.your-objectstorage.com" }
            - { name: RUUM_S3_REGION, value: hel1 }
            - { name: RUUM_S3_BUCKET, value: ruum-staging-blobs-768usm }
            - { name: RUUM_S3_FORCE_PATH_STYLE, value: "false" }
            - { name: SMTP_URL, value: "smtp://mailpit.ops.svc.cluster.local:1025" }
            - { name: RUUM_MAIL_FROM, value: "no-reply@notify.staging.ruum.space" }
            # PUT bodies of the WebDAV host (ruum_webdav::SPOOL_DIR_ENV).
            - { name: RUUM_DAV_SPOOL_DIR, value: /spool }
            - { name: TMPDIR, value: /tmp }
          ports:
            - { name: platform, containerPort: 8491 }
            - { name: dav, containerPort: 8492 }
            - { name: internal, containerPort: 8493 }
          readinessProbe:
            httpGet: { path: /healthz, port: platform }
            periodSeconds: 5
            failureThreshold: 2
          # A pause before SIGTERM: Kubernetes takes the terminating pod out of the Service at
          # once, and the pause lets kube-proxy and the edge stop sending new requests to it.
          # The image has no shell, so the pause is the kubelet's own sleep action.
          lifecycle:
            preStop:
              sleep: { seconds: {{ $pause }} }
          livenessProbe:
            httpGet: { path: /healthz, port: platform }
            periodSeconds: 30
            failureThreshold: 5
          startupProbe:
            httpGet: { path: /healthz, port: platform }
            periodSeconds: 5
            failureThreshold: 60
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
          {{- include "ruum.restricted" . | nindent 10 }}
          volumeMounts:
            - { name: pg-ca, mountPath: /pg-ca, readOnly: true }
            - { name: spool, mountPath: /spool }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: pg-ca
          secret: { secretName: pg-ca, items: [{ key: ca.crt, path: ca.crt }] }
        - name: spool
          emptyDir: { sizeLimit: 2Gi }
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
---
# Voluntary disruptions (a node drain, a Kubernetes upgrade) leave at least one server.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ruum-server
  namespace: ruum
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: ruum-server }
---
apiVersion: v1
kind: Service
metadata:
  name: ruum-server
  namespace: ruum
spec:
  selector: { app: ruum-server }
  ports:
    - { name: platform, port: 8491, targetPort: platform }
    - { name: dav, port: 8492, targetPort: dav }
---
# The internal listener: the edge's on-demand TLS `ask` (review 1 B-6). No public route.
apiVersion: v1
kind: Service
metadata:
  name: ruum-server-internal
  namespace: ruum
spec:
  selector: { app: ruum-server }
  ports:
    - { name: internal, port: 8493, targetPort: internal }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ruum-release
  namespace: ruum
data:
  commit: {{ .Values.commit | quote }}
  # The release that was live before this one: the only target of a plain `deploy.sh --rollback`
  # (design 12.7 promises that the previous release runs on the new schema, nothing older).
  previous: {{ .Values.previousCommit | quote }}
  server: {{ .Values.images.server | quote }}
  edge: {{ .Values.images.edge | quote }}
