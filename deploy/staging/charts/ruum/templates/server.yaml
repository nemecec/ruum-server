{{- include "ruum.checkCommit" . }}
{{- if and .Values.previousCommit (not (regexMatch "^[0-9a-f]{40}$" .Values.previousCommit)) }}
{{- fail "previousCommit must be empty or 40 lowercase hex characters" }}
{{- end }}
# ruum-server (plan 5.8). Updates without downtime (design 12.7, backlog O-25):
# - migrations run before the rollout in the Job of migrate-job.yaml (deploy-chart.sh), under
#   an advisory lock; the serving pods run with RUUM_MIGRATE=false and refuse to start on a
#   database without their release's migrations;
# - at least two replicas, a rolling update that never goes below them (maxUnavailable 0),
#   spread over the nodes, and a disruption budget;
# - shutdown: the preStop pause takes the pod out of the Service before SIGTERM; then the
#   server takes no new connections and lets open requests finish (RUUM_SHUTDOWN_GRACE_SECONDS).
# Migrations follow expand and contract (README "Deploy"): the previous image must work on the
# new schema, because old and new pods serve side by side and a failed rollout rolls the image
# back but not the schema (review 2 U-3).
{{- $grace := int .Values.server.shutdownGraceSeconds }}
{{- $pause := int .Values.server.preStopSeconds }}
{{- if lt (int .Values.server.replicas) 2 }}
{{- fail "server.replicas must be at least 2 (design 12.7)" }}
{{- end }}
{{- /* The ask limit is counted in each process (review of O-25, change 4; backlog O-28): each
       replica gets its share, so all of them together allow about tlsAskNewHostsPerHour. */}}
{{- $askPerReplica := max 1 (div (int .Values.server.tlsAskNewHostsPerHour) (int .Values.server.replicas)) }}
{{- /* The Kubernetes runtime driver (backlog I6-1): with the app runtime only. */}}
{{- $kube := and (include "ruum.apps" .) .Values.runtime.kubernetes }}
{{- /* The node22 builder (card I6-13): only with the driver and a registry. */}}
{{- $builder := and $kube .Values.runtime.builder }}
{{- if and .Values.runtime.builder (not $kube) }}
{{- fail "runtime.builder needs runtime.kubernetes and the app runtime (the images it builds run there)" }}
{{- end }}
{{- if and $builder (not .Values.runtime.registry) }}
{{- fail "runtime.builder needs runtime.registry (the name the nodes pull from: registry.ruum.internal:5000)" }}
{{- end }}
{{- if and $builder (not (regexMatch "^https?://[a-z0-9.-]+(:[0-9]{1,5})?$" .Values.runtime.registryPushUrl)) }}
{{- fail "runtime.registryPushUrl must be http(s)://host[:port] without a path" }}
{{- end }}
{{- if and .Values.runtime.registry (not (regexMatch "^[a-z0-9.-]+(:[0-9]{1,5})?$" .Values.runtime.registry)) }}
{{- fail "runtime.registry must be host or host:port" }}
{{- end }}
{{- /* The sandbox supervisor (backlog I6-20, S-89; decision 0006 I): the driver does not start
       without its pinned image, and its launch channel is TLS with a pinned certificate
       (supervisorNetwork tls, backlog I620-2) or plain HTTP over encrypted node traffic
       (supervisorNetwork encrypted, only with nodeNetworkEncrypted). */}}
{{- if $kube }}
{{- if not (regexMatch "^[a-z0-9./:-]+@sha256:[0-9a-f]{64}$" (.Values.runtime.supervisorImage | default "")) }}
{{- fail "runtime.supervisorImage must be the sandbox supervisor's image by digest (name@sha256:...) when runtime.kubernetes is on" }}
{{- end }}
{{- if not (has .Values.runtime.supervisorNetwork (list "tls" "encrypted")) }}
{{- fail "runtime.supervisorNetwork must be tls or encrypted (backlog I620-2)" }}
{{- end }}
{{- if and (eq .Values.runtime.supervisorNetwork "encrypted") (not .Values.runtime.nodeNetworkEncrypted) }}
{{- fail "runtime.supervisorNetwork encrypted needs runtime.nodeNetworkEncrypted true: that launch channel is plain HTTP (decision 0006 I point 4; deploy/staging/README.md)" }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ruum-server
  namespace: ruum
  labels: { app: ruum-server }
  annotations:
    ruum.space/commit: {{ .Values.commit | quote }}
spec:
  replicas: {{ .Values.server.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  minReadySeconds: 5
  selector:
    matchLabels: { app: ruum-server }
  template:
    metadata:
      labels: { app: ruum-server }
      annotations:
        ruum.space/commit: {{ .Values.commit | quote }}
    spec:
      automountServiceAccountToken: false
      {{- if $kube }}
      # The runtime driver's account (charts/platform runtime-rbac.yaml): its token only in the
      # projected volume kube-api below, for the Role in ruum-apps.
      serviceAccountName: ruum-server
      {{- else }}
      # Named, not left out: Kubernetes keeps the deprecated serviceAccount field of an earlier
      # release, so a pod spec without the name still runs as ruum-server (backlog S-93).
      serviceAccountName: default
      {{- end }}
      # The preStop pause, the drain and a margin (design 12.7).
      terminationGracePeriodSeconds: {{ add $pause $grace 10 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: ruum-server }
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: server
          image: {{ include "ruum.byDigest" .Values.images.server }}
          # Every RUUM_* name here and in ruum-server-env must be one the server reads, and every
          # name the server needs in production must be set: crates/ruum-server/env-names.txt,
          # checked by tests/server-env.sh. Not set on purpose:
          # - RUUM_OIDC_CLIENT_SECRET: ruum-web is a public client with PKCE (zitadel-bootstrap.sh);
          # - RUUM_OIDC_REDIRECT_URI: the default <RUUM_PUBLIC_URL>/v1/auth/callback is the URI
          #   that zitadel-bootstrap.sh registers;
          # - RUUM_DBHOST_URL and a KEK (RUUM_LOCAL_KEK_FILE, RUUM_OPENBAO_*): staging runs step 1
          #   (decision 0007) and has no data cluster, so createDatabase answers 422 and no tenant
          #   key is made. Add them together with a data cluster.
          envFrom:
            # DATABASE_URL (the role ruum_app: data rights only, no DDL, read-only
            # _sqlx_migrations; the owner's DSN is only in the migration Job), RUUM_S3_ACCESS_KEY_ID, RUUM_S3_SECRET_ACCESS_KEY,
            # RUUM_SPICEDB_PRESHARED_KEY, RUUM_TOKEN_SIGNING_KEY, RUUM_CONTENT_SIGNING_KEY,
            # RUUM_SIGNUP_ALLOWED_EMAILS, RUUM_SIGNUP_ALLOWED_UNVERIFIED_EMAILS (k8s/apply.sh).
            - secretRef: { name: ruum-server-env }
          env:
            - { name: RUST_LOG, value: "info" }
            - { name: RUUM_BIND, value: "0.0.0.0:8491" }
            - { name: RUUM_DAV_BIND, value: "0.0.0.0:8492" }
            - { name: RUUM_INTERNAL_BIND, value: "0.0.0.0:8493" }
            - { name: RUUM_TLS_ASK_NEW_HOSTS_PER_HOUR, value: {{ $askPerReplica | quote }} }
            - { name: RUUM_PUBLIC_URL, value: "https://{{ .Values.hosts.public }}" }
            - { name: RUUM_DAV_URL, value: "https://{{ .Values.hosts.dav }}/" }
            - { name: RUUM_CONTENT_URL, value: "https://{{ .Values.hosts.content }}" }
            - { name: RUUM_OIDC_ISSUER, value: "https://{{ .Values.hosts.auth }}" }
            # App addresses, the sign-in redirect to app origins and the certificates of app
            # hosts (tls-ask); the same value as the gateway's (card I-6).
            - { name: RUUM_APPS_DOMAIN, value: {{ .Values.hosts.apps | quote }} }
            - name: RUUM_OIDC_CLIENT_ID
              valueFrom: { secretKeyRef: { name: ruum-oidc, key: client-id } }
            # The Zitadel IdP IDs for /v1/auth/login?idp=google|microsoft (zitadel-bootstrap.sh
            # writes them). Not optional: without them the sign-in stops at Zitadel's choice page.
            - name: RUUM_OIDC_IDP_GOOGLE
              valueFrom: { secretKeyRef: { name: ruum-oidc, key: idp-google } }
            - name: RUUM_OIDC_IDP_MICROSOFT
              valueFrom: { secretKeyRef: { name: ruum-oidc, key: idp-microsoft } }
            # The migration Job runs the migrations (migrate-job.yaml); the server only checks them.
            # Without DATABASE_URL it refuses to start (no in-memory fallback in a cluster).
            - { name: RUUM_MIGRATE, value: "false" }
            - { name: RUUM_MIGRATIONS_DIR, value: /app/migrations }
            - { name: RUUM_SHUTDOWN_GRACE_SECONDS, value: {{ $grace | quote }} }
            # The server talks to SpiceDB's HTTP gateway, not gRPC (ruum_core::authz::spicedb).
            - { name: RUUM_SPICEDB_HTTP_URL, value: "http://spicedb.authz.svc.cluster.local:8443" }
            # The endpoint of the location where tofu/cluster makes both buckets (HCLOUD_LOCATION of
            # versions.env, fsn1 since 2026-11-11). hel1 answers NoSuchBucket (backlog O-56);
            # tests/run.sh ties both lines to HCLOUD_LOCATION.
            - { name: RUUM_S3_ENDPOINT, value: "https://fsn1.your-objectstorage.com" }
            - { name: RUUM_S3_REGION, value: fsn1 }
            - { name: RUUM_S3_BUCKET, value: ruum-staging-blobs-768usm }
            # Static app files in a bucket of their own (decision 0008-4; tofu/cluster). Only the
            # server writes; the gateway gets short-lived links that the server signs.
            - { name: RUUM_STATIC_S3_BUCKET, value: ruum-staging-static-768usm }
            - { name: RUUM_S3_FORCE_PATH_STYLE, value: "false" }
            - { name: SMTP_URL, value: "smtp://mailpit.ops.svc.cluster.local:1025" }
            - { name: RUUM_MAIL_FROM, value: "no-reply@notify.staging.ruum.space" }
            # PUT bodies of the WebDAV host (ruum_webdav::SPOOL_DIR_ENV).
            - { name: RUUM_DAV_SPOOL_DIR, value: /spool }
            - { name: TMPDIR, value: /tmp }
            {{- if $kube }}
            # The runtime driver of the sandboxes (backlog I6-1): gVisor pods in ruum-apps; the
            # egress proxy's Service is their only way out (network policies). No egress control
            # listener yet (backlog I6-2), so no sandbox is registered and the proxy refuses them.
            - { name: RUUM_RUNTIME_DRIVER, value: kubernetes }
            - { name: RUUM_KUBE_TOKEN_FILE, value: /var/run/secrets/ruum-kube/token }
            - { name: RUUM_KUBE_CA_FILE, value: /var/run/secrets/ruum-kube/ca.crt }
            - { name: RUUM_KUBE_NAMESPACE, value: ruum-apps }
            - { name: RUUM_KUBE_RUNTIME_CLASS, value: gvisor }
            # overhead.podFixed of k8s/manifests/runtimeclass.yaml, exactly (tests/run.sh checks
            # it): the RuntimeClass admission plugin writes it into every sandbox pod, and the
            # driver's read-back refuses a pod with any other (review of I6-20).
            - { name: RUUM_KUBE_RUNTIME_CLASS_OVERHEAD, value: "cpu=50m,memory=64Mi" }
            - { name: RUUM_KUBE_EGRESS_PROXY, value: "ruum-egress.ruum.svc.cluster.local:3128" }
            - { name: RUUM_KUBE_SPLIT_LOG_STREAMS, value: {{ ternary "on" "off" .Values.runtime.splitLogStreams | quote }} }
            {{- if .Values.runtime.registry }}
            - { name: RUUM_REGISTRY, value: {{ .Values.runtime.registry | quote }} }
            {{- end }}
            # The sandbox supervisor (backlog I6-20, S-89): the record key (Secret
            # ruum-runtime-record-key, k8s/apply.sh), the pinned image, the listener and the
            # Service the sandboxes reach it by (they have no DNS: the driver resolves it).
            - { name: RUUM_KUBE_RECORD_KEY_FILE, value: /var/run/secrets/ruum-runtime/record-key }
            - { name: RUUM_KUBE_SUPERVISOR_IMAGE, value: {{ .Values.runtime.supervisorImage | quote }} }
            - { name: RUUM_KUBE_SUPERVISOR_SERVICE, value: "ruum-supervisor.ruum.svc.cluster.local:8091" }
            - { name: RUUM_KUBE_SUPERVISOR_LISTEN, value: "0.0.0.0:8091" }
            # TLS with the certificate derived from the record key, pinned by each supervisor
            # (backlog I620-2), or plain HTTP over encrypted node traffic.
            - { name: RUUM_KUBE_SUPERVISOR_NETWORK, value: {{ .Values.runtime.supervisorNetwork | quote }} }
            {{- if $builder }}
            # The node22 builder (card I6-13): build pods in ruum-builds, the build channel on
            # its own port (TLS with the supervisor listener's pinned key), the push credential
            # as a file (Secret ruum-registry-push, k8s/apply.sh).
            - { name: RUUM_BUILDER, value: kubernetes }
            - { name: RUUM_BUILD_REGISTRY_URL, value: {{ .Values.runtime.registryPushUrl | quote }} }
            - { name: RUUM_BUILD_PUSH_USER, value: ruum-push }
            - { name: RUUM_BUILD_PUSH_PASSWORD_FILE, value: /var/run/secrets/ruum-registry/push-password }
            - { name: RUUM_BUILD_CHANNEL_SERVICE, value: "ruum-build-channel.ruum.svc.cluster.local:8092" }
            - { name: RUUM_BUILD_CHANNEL_LISTEN, value: "0.0.0.0:8092" }
            - { name: RUUM_BUILD_NAMESPACE, value: ruum-builds }
            {{- end }}
            {{- end }}
          ports:
            - { name: platform, containerPort: 8491 }
            - { name: dav, containerPort: 8492 }
            - { name: internal, containerPort: 8493 }
            {{- if $kube }}
            - { name: supervisor, containerPort: 8091 }
            {{- end }}
            {{- if $builder }}
            - { name: build-channel, containerPort: 8092 }
            {{- end }}
          readinessProbe:
            httpGet: { path: /healthz, port: platform }
            periodSeconds: 5
            failureThreshold: 2
          # A pause before SIGTERM: Kubernetes takes the terminating pod out of the Service at
          # once, and the pause lets kube-proxy and the edge stop sending new requests to it.
          # The image has no shell, so the pause is the kubelet's own sleep action.
          lifecycle:
            preStop:
              sleep: { seconds: {{ $pause }} }
          livenessProbe:
            httpGet: { path: /healthz, port: platform }
            periodSeconds: 30
            failureThreshold: 5
          startupProbe:
            httpGet: { path: /healthz, port: platform }
            periodSeconds: 5
            failureThreshold: 60
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
          {{- include "ruum.restricted" . | nindent 10 }}
          volumeMounts:
            - { name: pg-ca, mountPath: /pg-ca, readOnly: true }
            - { name: spool, mountPath: /spool }
            - { name: tmp, mountPath: /tmp }
            {{- if $kube }}
            - { name: kube-api, mountPath: /var/run/secrets/ruum-kube, readOnly: true }
            - { name: record-key, mountPath: /var/run/secrets/ruum-runtime, readOnly: true }
            {{- end }}
            {{- if $builder }}
            - { name: registry-push, mountPath: /var/run/secrets/ruum-registry, readOnly: true }
            {{- end }}
      volumes:
        - name: pg-ca
          secret: { secretName: pg-ca, items: [{ key: ca.crt, path: ca.crt }] }
        - name: spool
          emptyDir: { sizeLimit: 2Gi }
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
        {{- if $kube }}
        # A token of ruum/ruum-server for the API server only (one hour, renewed by the kubelet;
        # the driver reads the file for every call) and the cluster CA.
        - name: kube-api
          projected:
            sources:
              - serviceAccountToken: { path: token, expirationSeconds: 3600 }
              - configMap: { name: kube-root-ca.crt, items: [{ key: ca.crt, path: ca.crt }] }
        # The record key (backlog S-89): only the server pods hold it; ruum-apps has no right in ruum.
        - name: record-key
          secret: { secretName: ruum-runtime-record-key, items: [{ key: record-key, path: record-key }], defaultMode: 0440 }
        {{- end }}
        {{- if $builder }}
        # The builder's push password (card I6-13): only the server pods hold it; no build sees it.
        - name: registry-push
          secret: { secretName: ruum-registry-push, items: [{ key: push-password, path: push-password }], defaultMode: 0440 }
        {{- end }}
---
# Voluntary disruptions (a node drain, a Kubernetes upgrade) leave at least one server.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ruum-server
  namespace: ruum
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: ruum-server }
---
apiVersion: v1
kind: Service
metadata:
  name: ruum-server
  namespace: ruum
spec:
  selector: { app: ruum-server }
  ports:
    - { name: platform, port: 8491, targetPort: platform }
    - { name: dav, port: 8492, targetPort: dav }
---
{{- if $kube }}
# The supervisor listener (backlog S-89): the sandboxes of ruum-apps fetch their launch data here
# (charts/platform networkpolicies.yaml lets only them reach it). No public route.
apiVersion: v1
kind: Service
metadata:
  name: ruum-supervisor
  namespace: ruum
spec:
  selector: { app: ruum-server }
  ports:
    - { name: supervisor, port: 8091, targetPort: supervisor }
---
{{- end }}
{{- if $builder }}
# The build channel (card I6-13): the build pods of ruum-builds fetch their source and send their
# output here (charts/platform builder-rbac.yaml lets only them reach it). No public route.
apiVersion: v1
kind: Service
metadata:
  name: ruum-build-channel
  namespace: ruum
spec:
  selector: { app: ruum-server }
  ports:
    - { name: build-channel, port: 8092, targetPort: build-channel }
---
{{- end }}
# The internal listener: the edge's on-demand TLS `ask` (review 1 B-6). No public route.
apiVersion: v1
kind: Service
metadata:
  name: ruum-server-internal
  namespace: ruum
spec:
  selector: { app: ruum-server }
  ports:
    - { name: internal, port: 8493, targetPort: internal }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ruum-release
  namespace: ruum
data:
  commit: {{ .Values.commit | quote }}
  # The release that was live before this one: the only target of a plain `deploy.sh --rollback`
  # (design 12.7 promises that the previous release runs on the new schema, nothing older).
  previous: {{ .Values.previousCommit | quote }}
  server: {{ .Values.images.server | quote }}
  edge: {{ .Values.images.edge | quote }}
  # Empty for a release without the app runtime (card I-6).
  gateway: {{ .Values.images.gateway | quote }}
  egress: {{ .Values.images.egress | quote }}
