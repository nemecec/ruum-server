# Values of the staging platform. k8s/apply.sh sets the generation and the versions from
# versions.env; nothing secret is here (the secrets are Kubernetes Secrets made by apply.sh).

# The generation of this cluster (tofu output pg_generation): the CNPG backup path is
# s3://ruum-staging-pg-backup/pg-<generation>/ (review 2 R-2).
generation: ""
# Restore: bootstrap pg from the backup path pg-<restoreFrom> (up.sh --restore-from).
restoreFrom: ""

postgres:
  image: ghcr.io/cloudnative-pg/postgresql:17.11-standard-trixie
  instances: 2
  size: 10Gi
  storageClass: local-path
  # Sizing rule (review 2 U-2): the sum of requests fits on N-1 nodes. See README "Capacity".
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { memory: 768Mi }

backup:
  bucket: ruum-staging-pg-backup
  endpoint: https://s3.nl-ams.scw.cloud
  schedule: "0 0 3 * * *"

spicedb:
  image: authzed/spicedb:v1.56.2
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 256Mi }

mailpit:
  image: axllent/mailpit:v1.32.0
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }

blobCopy:
  image: rclone/rclone:1.75.2
  schedule: "30 2 * * *"
  # The blob bucket of tofu/cluster (bucket_blobs) at the endpoint of its location: the minio
  # provider makes it at ${var.location}.your-objectstorage.com, HCLOUD_LOCATION of versions.env
  # (fsn1 since 2026-11-11). At hel1 the bucket does not exist, and rclone said "directory not
  # found" every night (backlog O-55). tests/run.sh checks both against tofu and versions.env.
  source: ruum-staging-blobs-768usm
  sourceEndpoint: https://fsn1.your-objectstorage.com
  destination: ruum-staging-blobs-copy
  destinationEndpoint: https://s3.nl-ams.scw.cloud

# The private subnet of the nodes and the load balancer (tofu/cluster).
nodeSubnet: 10.20.1.0/24

# The deploy controller (backlog O-34): ghcr.io/nemecec/ruum-deploy-controller@sha256:<digest>.
# k8s/apply.sh sets it from the commit that secrets-push.sh passes, after the provenance check.
deployController:
  image: ""
  # The commit of main the image was built from (40 hex); k8s/apply.sh sets it.
  commit: ""

# The cluster registry of app images (card I6-13; templates/registry.yaml): zot, by digest. Off
# until the README's "node22 apps" steps turn it on. Pull for the nodes (user ruum-pull, Talos
# RegistryAuthConfig), push for the builder (ruum-push), no anonymous access. Images are pushed
# and run by digest only; garbage collection removes blobs that no manifest names (failed
# pushes). Manifests are kept: only the platform knows which deployments can still serve or roll
# back (backlog I613-4).
registry:
  enabled: false
  image: ghcr.io/project-zot/zot-linux-amd64:v2.1.20@sha256:95a837a0afacf5b7edc0c92493f04beee6891989b8d2fd50a00cf65a1e6d4fd5
  # A fixed address in the service range: containerd on the nodes has no cluster DNS, so the
  # Talos mirror of registry.ruum.internal:5000 points here (talos/patches, tofu var
  # registry_pull_password). Inside 10.96.0.0/12, the Talos default service subnet.
  clusterIP: 10.96.0.50
  size: 20Gi
  storageClass: local-path
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
