{{- if .Values.registry.enabled }}
# The cluster registry of app images (card I6-13): zot by digest, one replica on a local-path
# volume. Two users from the Secret ruum-registry-auth (k8s/apply.sh, bcrypt): ruum-pull may
# read (the nodes' containerd, Talos RegistryAuthConfig), ruum-push may read and create (the
# builder in ruum-server; it pushes the manifest by digest once and never deletes). No anonymous
# access. Garbage collection deletes blobs no manifest names (failed pushes, P-84) after a day.
# Manifests stay (backlog I613-4: a platform sweep that knows which deployments can still serve
# or roll back).
apiVersion: v1
kind: ConfigMap
metadata:
  name: ruum-registry
  namespace: ruum-registry
data:
  config.json: |
    {
      "distSpecVersion": "1.1.0",
      "storage": {
        "rootDirectory": "/var/lib/registry",
        "dedupe": false,
        "gc": true,
        "gcDelay": "24h",
        "gcInterval": "6h"
      },
      "http": {
        "address": "0.0.0.0",
        "port": "5000",
        "auth": { "htpasswd": { "path": "/etc/zot/auth/htpasswd" }, "failDelay": 1 },
        "accessControl": {
          "repositories": {
            "**": {
              "anonymousPolicy": [],
              "policies": [
                { "users": ["ruum-pull"], "actions": ["read"] },
                { "users": ["ruum-push"], "actions": ["read", "create"] }
              ]
            }
          }
        }
      },
      "log": { "level": "info" }
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ruum-registry-data
  namespace: ruum-registry
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.registry.storageClass }}
  resources:
    requests: { storage: {{ .Values.registry.size }} }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ruum-registry
  namespace: ruum-registry
spec:
  replicas: 1
  # One volume, one writer.
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: ruum-registry }
  template:
    metadata:
      labels: { app: ruum-registry }
      annotations:
        # A new pod when the settings change (the config file is part of this template).
        ruum.space/config: {{ .Values.registry | toJson | sha256sum | trunc 16 }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: registry
          image: {{ .Values.registry.image }}
          args: ["serve", "/etc/zot/config.json"]
          ports:
            - { name: registry, containerPort: 5000 }
          readinessProbe:
            tcpSocket: { port: registry }
            periodSeconds: 10
          resources:
            {{- toYaml .Values.registry.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/registry }
            - { name: config, mountPath: /etc/zot/config.json, subPath: config.json, readOnly: true }
            - { name: auth, mountPath: /etc/zot/auth, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: ruum-registry-data }
        - name: config
          configMap: { name: ruum-registry }
        - name: auth
          secret: { secretName: ruum-registry-auth, defaultMode: 0440 }
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
---
# A fixed address: the nodes' containerd reaches it without cluster DNS (the Talos mirror of
# registry.ruum.internal:5000).
apiVersion: v1
kind: Service
metadata:
  name: ruum-registry
  namespace: ruum-registry
spec:
  selector: { app: ruum-registry }
  clusterIP: {{ .Values.registry.clusterIP }}
  ports:
    - { name: registry, port: 5000, targetPort: registry }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: ruum-registry
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# The builder in ruum-server pushes; the nodes pull (containerd in the host network, from the
# node subnet). Nothing else reaches the registry; every request needs a user anyway.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: registry-clients
  namespace: ruum-registry
spec:
  podSelector:
    matchLabels: { app: ruum-registry }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ruum }
          podSelector:
            matchLabels: { app: ruum-server }
        - ipBlock: { cidr: {{ .Values.nodeSubnet }} }
      ports:
        - { protocol: TCP, port: 5000 }
{{- end }}
