# The rights of the Kubernetes runtime driver (backlog I6-1; crates/ruum-runtime src/kube): the
# ServiceAccount of ruum-server may make the pods and records (ConfigMaps) of app sandboxes in
# ruum-apps, read their logs, and ask the API server whose a projected token is (TokenReview), and
# nothing else. No verb on Secrets at all (backlog S-89, decision 0006 I): the values of a run are
# sealed into its record under the record key, which is not in ruum-apps, and the sandbox
# supervisor fetches them from the server with the pod's projected token of the audience
# ruum-supervisor (docs/STEP3.md "The sandbox supervisor"). TokenReview is cluster-scoped: it
# answers whether a token is valid and for which pod, and grants nothing. No exec, attach or
# port-forward, no ServiceAccount token, no RBAC change. The admission rules of ruum-apps
# (k8s/manifests/apps-admission.yaml) limit what it may create. The deploy controller's rights
# stay apart (deployer-rbac.yaml, deploy-controller.yaml).
# Keep rules on one line: ops/rbac-check.sh and the driver's tests (the fake API server reads
# this file and refuses every other verb) check each line.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ruum-server
  namespace: ruum
# Only the server pod mounts a token (a projected volume in charts/ruum server.yaml, with the
# runtime driver on): every other pod of the account gets none.
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ruum-runtime
  namespace: ruum-apps
rules:
  - { apiGroups: [""], resources: [pods], verbs: [create, get, list, delete] }
  - { apiGroups: [""], resources: [pods/log], verbs: [get] }
  - { apiGroups: [""], resources: [configmaps], verbs: [create, get, list, update, delete] }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ruum-runtime
  namespace: ruum-apps
subjects:
  - kind: ServiceAccount
    name: ruum-server
    namespace: ruum
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ruum-runtime
---
# The supervisor listener's check of a sandbox pod's projected token (backlog S-89).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ruum-runtime-tokenreview
rules:
  - { apiGroups: ["authentication.k8s.io"], resources: [tokenreviews], verbs: [create] }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ruum-runtime-tokenreview
subjects:
  - kind: ServiceAccount
    name: ruum-server
    namespace: ruum
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ruum-runtime-tokenreview
---
# The identity of the sandbox pods (backlog S-89): no RoleBinding anywhere, no automounted token.
# Each pod mounts one projected token of the audience ruum-supervisor (600 s), which the API
# server does not accept; the kubelet issues it for that pod, and the server's supervisor
# listener checks it with a TokenReview.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ruum-sandbox
  namespace: ruum-apps
automountServiceAccountToken: false
