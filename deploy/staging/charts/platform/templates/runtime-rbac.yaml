# The rights of the Kubernetes runtime driver (backlog I6-1; crates/ruum-runtime src/kube): the
# ServiceAccount of ruum-server may make the pods, records (ConfigMaps) and Secrets of app
# sandboxes in ruum-apps, and nothing anywhere else. It never reads a Secret (no get, list or
# watch): it writes the token and the secret values of an instance and the pod mounts them. No
# exec, attach or port-forward, no ServiceAccount token, no RBAC change. The deploy controller's
# rights stay apart (deployer-rbac.yaml, deploy-controller.yaml).
# Keep rules on one line: ops/rbac-check.sh and the driver's tests (the fake API server reads
# this file and refuses every other verb) check each line.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ruum-server
  namespace: ruum
# Only the server pod mounts a token (a projected volume in charts/ruum server.yaml, with the
# runtime driver on): every other pod of the account gets none.
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ruum-runtime
  namespace: ruum-apps
rules:
  - { apiGroups: [""], resources: [pods], verbs: [create, get, list, delete] }
  - { apiGroups: [""], resources: [pods/log], verbs: [get] }
  - { apiGroups: [""], resources: [configmaps], verbs: [create, get, list, update, delete] }
  - { apiGroups: [""], resources: [secrets], verbs: [create, patch, delete] }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ruum-runtime
  namespace: ruum-apps
subjects:
  - kind: ServiceAccount
    name: ruum-server
    namespace: ruum
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ruum-runtime
