# deploy.sh uses this ServiceAccount, not the admin kubeconfig (review 1 S-2, review 2 O-1):
# Helm in `ruum` and `edge` only. ops/deployer-kubeconfig.sh writes its kubeconfig into the
# person's work folder on the Mac.
#
# What this ServiceAccount can reach (Kimi review of O-25, finding 1): it has no `get secrets`,
# but it may create and change pods, Deployments, DaemonSets and Jobs in `ruum` and `edge`, and
# read pod logs. A pod can mount any Secret of its namespace, and Kubernetes does not check that
# the pod's creator may read that Secret. So the deployer can read EVERY Secret of `ruum`
# (ruum-server-env: the runtime database DSN, the token and content signing keys, the S3 key, the
# SpiceDB key; ruum-migrate-db: the database owner's DSN; ruum-oidc) and of `edge` (the TLS
# private keys and the ACME account key). Treat the deployer kubeconfig like the admin
# kubeconfig for these two namespaces: operator-only, on the person's Mac, never on the build
# server or in CI (README S-4). It cannot reach `data`, `auth`, `authz`, `nats` or `ops` beyond
# creating CNPG Backups. Backlog O-34 moves the migration step and the rollout out of its reach.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployer
  namespace: ruum
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: deployer-token
  namespace: ruum
  annotations:
    kubernetes.io/service-account.name: deployer
type: kubernetes.io/service-account-token
{{- range list "ruum" "edge" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployer
  namespace: {{ . }}
rules:
  - apiGroups: [apps]
    resources: [deployments, replicasets, daemonsets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [controllerrevisions]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [services, configmaps, pods, pods/log, events, serviceaccounts]
    verbs: [get, list, watch, create, update, patch, delete]
  # No Secrets through the API: deploy-chart.sh runs Helm with HELM_DRIVER=configmap, and the
  # chart has no Secret of its own (k8s/apply.sh makes them). This does NOT keep the Secrets of
  # this namespace from the deployer: pods it creates can mount them (see the top of this file).
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch, create, update, patch, delete]
{{- if eq . "ruum" }}
  # The migration step before each rollout (design 12.7, backlog O-25; deploy-chart.sh).
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, delete]
  # The deploy lock (Lease ruum/ruum-deploy, ops/deploy-lock.sh; Kimi review of O-25, finding 3).
  # No delete: a release clears the holder with a compare-and-swap.
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [ruum-deploy]
    verbs: [get, update]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployer
  namespace: {{ . }}
subjects:
  - kind: ServiceAccount
    name: deployer
    namespace: ruum
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deployer
{{- end }}
---
# Before a release with new migrations, deploy.sh asks CNPG for an on-demand backup (review 2
# U-3). The deployer may create and read Backup objects in `data`, nothing else there.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployer-backup
  namespace: data
rules:
  - apiGroups: [postgresql.cnpg.io]
    resources: [backups]
    verbs: [get, list, watch, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployer-backup
  namespace: data
subjects:
  - kind: ServiceAccount
    name: deployer
    namespace: ruum
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deployer-backup
