# The deployer (review 1 S-2, review 2 O-1; backlog O-34, decision 0008-2). deploy.sh uses this
# ServiceAccount, never the admin kubeconfig; ops/deployer-kubeconfig.sh writes its kubeconfig
# into the person's work folder on the Mac.
#
# Since O-34 the deployer only writes release requests: ConfigMaps in ruum-deploy that the deploy
# controller (deploy-controller.yaml) checks and runs. It creates nothing else anywhere and
# changes nothing: no Pods, Jobs, Deployments, DaemonSets or any other workload, no pod
# subresource (log, exec, attach, port-forward, ephemeral containers), no Secret, no ServiceAccount
# or token, no Role, no Lease, no CNPG Backup, no ConfigMap outside ruum-deploy. So it cannot run a
# pod that mounts a Secret, and it cannot read a Secret through any path. What it reads: the live
# release (ConfigMap ruum/ruum-release), the state of the workloads, and its own requests.
#
# The rules are one line each, in this form: ops/rbac-check.sh reads them in CI (tests/run.sh)
# and fails on any rule it cannot read; on the live cluster it asks the API server
# (kubectl auth can-i --as) after every platform step.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployer
  namespace: ruum
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: deployer-token
  namespace: ruum
  annotations:
    kubernetes.io/service-account.name: deployer
type: kubernetes.io/service-account-token
---
# Release requests: create and read, never update or delete (the controller writes the outcome).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployer
  namespace: ruum-deploy
rules:
  - { apiGroups: [""], resources: [configmaps], verbs: [create, get, list, watch] }
  - { apiGroups: [""], resources: [pods, events], verbs: [get, list, watch] }
  - { apiGroups: [apps], resources: [deployments, replicasets], verbs: [get, list, watch] }
---
# The live release and the state of the rollout, read-only. ConfigMaps only by name: Helm's
# release records (sh.helm.release.v1.*) stay out of reach, read and write.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployer
  namespace: ruum
rules:
  - { apiGroups: [""], resources: [configmaps], resourceNames: [ruum-release], verbs: [get] }
  - { apiGroups: [""], resources: [pods, services, events], verbs: [get, list, watch] }
  - { apiGroups: [apps], resources: [deployments, replicasets, daemonsets], verbs: [get, list, watch] }
  - { apiGroups: [batch], resources: [jobs], verbs: [get, list, watch] }
  - { apiGroups: [coordination.k8s.io], resources: [leases], resourceNames: [ruum-deploy], verbs: [get] }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployer
  namespace: edge
rules:
  - { apiGroups: [""], resources: [pods, events], verbs: [get, list, watch] }
  - { apiGroups: [apps], resources: [daemonsets], verbs: [get, list, watch] }
{{- range list "ruum-deploy" "ruum" "edge" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployer
  namespace: {{ . }}
subjects:
  - kind: ServiceAccount
    name: deployer
    namespace: ruum
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deployer
{{- end }}
