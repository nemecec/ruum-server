# The certificate storage of the edge (backlog O-26): Caddy keeps certificates, ACME accounts
# and challenge tokens in Secrets of the edge namespace and locks with Leases there (the module
# deploy/images/caddy-secret-storage). Here, not in charts/ruum: the deploy controller that installs
# charts/ruum has no access to Secrets, and Kubernetes does not let it grant what it does not hold.
#
# The edge namespace has no other Secrets today, so the token reaches only the edge's own
# certificates. Nothing outside the namespace. The Role has no resourceNames: the module names
# its Secrets and Leases after hashes of the storage keys, and `create` and `list` cannot be
# limited by name. A Secret that someone later puts into `edge` is readable and writable by the
# edge (backlog O-36).
#
# Who else can read these keys: the deploy controller (deploy-controller.yaml) manages the edge
# DaemonSet and may create pods in edge, so through a pod it could read every certificate private
# key and the ACME account key; it runs only code from an image of main, installed by digest by
# the admin. The deployer cannot (backlog O-34): it creates no workload and reads no Secret
# (deployer-rbac.yaml, ops/rbac-check.sh). README S-4.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ruum-edge
  namespace: edge
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ruum-edge-cert-storage
  namespace: edge
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, create, update, delete]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ruum-edge-cert-storage
  namespace: edge
subjects:
  - kind: ServiceAccount
    name: ruum-edge
    namespace: edge
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ruum-edge-cert-storage
