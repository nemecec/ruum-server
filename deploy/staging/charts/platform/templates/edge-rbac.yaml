# The certificate storage of the edge (backlog O-26): Caddy keeps certificates, ACME accounts
# and challenge tokens in Secrets of the edge namespace and locks with Leases there (the module
# deploy/images/caddy-secret-storage). Here, not in charts/ruum: the deployer has no access to
# Secrets, and Kubernetes does not let it grant what it does not hold.
#
# The edge namespace has no other Secrets today, so the token reaches only the edge's own
# certificates. Nothing outside the namespace. The Role has no resourceNames: the module names
# its Secrets and Leases after hashes of the storage keys, and `create` and `list` cannot be
# limited by name. A Secret that someone later puts into `edge` is readable and writable by the
# edge (backlog O-36).
#
# Who else can read these keys: the deployer manages the edge DaemonSet and may create pods in
# edge (deployer-rbac.yaml), so it can run a pod as ruum-edge, or mount the Secrets in a pod of
# its own, and read every certificate private key and the ACME account key. The same holds for
# every Secret of `ruum` (the database DSNs, the token signing key): the deployer can read all of
# them through pods it creates. So the deployer kubeconfig is operator-only. README S-4; backlog
# O-29 and O-34.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ruum-edge
  namespace: edge
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ruum-edge-cert-storage
  namespace: edge
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, create, update, delete]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ruum-edge-cert-storage
  namespace: edge
subjects:
  - kind: ServiceAccount
    name: ruum-edge
    namespace: edge
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ruum-edge-cert-storage
