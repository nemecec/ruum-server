#cloud-config
# The Ruum build server: Docker for the laptop stack, the Rust toolchain, build tools and Node.js
# (for the web UI and its browser tests; setup.sh adds Playwright's Chromium).
# A user "ruum" with the same SSH key as root; password login is off.
users:
  - default
  - name: ruum
    groups: [docker, sudo]
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
ssh_pwauth: false
package_update: true
packages:
  - docker.io
  - docker-compose-v2
  - docker-buildx
  - build-essential
  - pkg-config
  - cmake
  - clang
  - git
  - rsync
  - jq
  - curl
  - unzip
  - postgresql-client
  - fail2ban
  - python3
  - xz-utils
runcmd:
  - echo 'PermitRootLogin no' > /etc/ssh/sshd_config.d/10-ruum.conf && systemctl reload ssh
  - systemctl enable --now fail2ban
  - mkdir -p /home/ruum/.ssh && cp /root/.ssh/authorized_keys /home/ruum/.ssh/ && chown -R ruum:ruum /home/ruum/.ssh && chmod 700 /home/ruum/.ssh
  - systemctl enable --now docker
  # Node.js 22 from the official binaries, pinned with its SHA-256 (keep in step with setup.sh,
  # which installs it too when it is missing).
  - |
    (
    set -e
    v=22.22.3
    case "$(uname -m)" in
      aarch64) a=arm64 sum=1c4a9933a5e45bc88f54f70b5f91232c127ec49f1a5989d23fb85824c7adf9b7 ;;
      x86_64) a=x64 sum=2e5d13569282d016861fae7c8f935e741693c269101a5bebcf761a5376d1f99f ;;
    esac
    curl -fsSL -o /tmp/node.tar.xz "https://nodejs.org/dist/v$v/node-v$v-linux-$a.tar.xz"
    echo "$sum  /tmp/node.tar.xz" | sha256sum -c -
    mkdir -p /opt/node && tar -xJf /tmp/node.tar.xz -C /opt/node && rm /tmp/node.tar.xz
    for b in node npm npx corepack; do ln -sfn "/opt/node/node-v$v-linux-$a/bin/$b" "/usr/local/bin/$b"; done
    ) || echo "Node.js install failed; setup.sh installs it"
  - su - ruum -c 'curl --proto =https --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.99 -c rustfmt -c clippy'
  - touch /home/ruum/.bootstrap-done
