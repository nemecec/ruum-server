# Nightly checks of docs/DESIGN.md, section 18.5: mutation checks, the full end-to-end suite on
# staging and a restore test of the backups.
name: nightly

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      mutations:
        description: "Only these mutations (names in crates/ruum-testkit/mutations, space separated); empty runs all"
        required: false
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.99"

jobs:
  mutation-check:
    name: mutation check of the security suites
    runs-on: ubuntu-24.04
    # The Postgres mutations (ENV="RUUM_SUITE_BACKEND=postgres ...", the Postgres conformance
    # suites) need a database.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ruum
          POSTGRES_PASSWORD: ruum
          POSTGRES_DB: ruum
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ruum" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # A role without superuser, as in ci.yml: the superuser of the service container bypasses
      # row-level security, so the RLS tests of the baseline failed with it.
      DATABASE_URL: postgres://ruum_test:ruum_test@localhost:5432/ruum
      # The mutations of ruum-dbengine run against the data cluster (see ci.yml).
      RUUM_DBHOST_URL: postgres://ruum_dbhost:ci-dbhost@127.0.0.1:5435/postgres
      # SpiceDB (memory datastore), as scripts/buildbox/run.sh starts it. Without it the tests of
      # decision 0002-4 (wiring::tests::writes_of_another_server_hold_at_once) skip, and the
      # mutations authz-ignores-tenant-token and authz-spicedb-ignores-request-floor survive.
      SPICEDB_PRESHARED_KEY: ci-spicedb
      SPICEDB_ENDPOINT: http://127.0.0.1:50051
      RUUM_SPICEDB_ENDPOINT: http://127.0.0.1:50051
      RUUM_SPICEDB_HTTP_URL: http://127.0.0.1:8543
      # A local key-encryption key (32 random bytes, made in a step below), as scripts/dev.sh env
      # gives on the laptop: the server tests with RUUM_DBHOST_URL need one.
      RUUM_LOCAL_KEK_FILE: /tmp/ruum-ci-tenant-keys.kek
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      # CREATEDB for the per-test databases, CREATE on the main database for the schema in which
      # sqlx keeps its list of test databases (as in ci.yml).
      - name: Role for the tests
        run: |
          psql "postgres://ruum:ruum@localhost:5432/ruum" -c "create role ruum_test login password 'ruum_test' createdb"
          psql "postgres://ruum:ruum@localhost:5432/ruum" -c "grant create on database ruum to ruum_test"
      # The data cluster of step 2, as in ci.yml (a service container cannot be built).
      - name: Start the data cluster (postgres-data)
        run: |
          docker build -t ruum-dev/postgres-data:17 deploy/dev/postgres-data
          docker run -d --name postgres-data -p 127.0.0.1:5435:5432 --shm-size 256m \
            -e POSTGRES_PASSWORD=ci-data-superuser -e RUUM_DBHOST_PASSWORD=ci-dbhost \
            ruum-dev/postgres-data:17
          for _ in $(seq 1 90); do
            docker exec postgres-data pg_isready -q -h 127.0.0.1 -U postgres -d postgres && break
            sleep 1
          done
          docker exec postgres-data pg_isready -h 127.0.0.1 -U postgres -d postgres
      - name: Local key-encryption key
        run: head -c 32 /dev/urandom > "$RUUM_LOCAL_KEK_FILE"
      - name: Start SpiceDB (memory datastore)
        run: |
          image=$(awk '/image: authzed\/spicedb:/ {print $2; exit}' deploy/dev/docker-compose.yml)
          docker run -d --name spicedb -p 127.0.0.1:50051:50051 -p 127.0.0.1:8543:8443 \
            -e SPICEDB_GRPC_PRESHARED_KEY="$SPICEDB_PRESHARED_KEY" -e SPICEDB_DATASTORE_ENGINE=memory \
            "$image" serve --http-enabled
          for _ in $(seq 1 120); do
            docker exec spicedb grpc_health_probe -addr=localhost:50051 >/dev/null 2>&1 && break
            sleep 0.5
          done
          docker exec spicedb grpc_health_probe -addr=localhost:50051
      # Strict: step 1 is built, so a survived or skipped mutation fails the run. Set the
      # repository variable MUTATION_STRICT=0 to make them warnings again.
      - name: Break each security rule in a copy; the suites must fail
        env:
          MUTATION_STRICT: ${{ vars.MUTATION_STRICT || '1' }}
          RUUM_REQUIRE_IMPLEMENTED: ${{ vars.RUUM_REQUIRE_IMPLEMENTED || '0' }}
          MUTATIONS: ${{ github.event.inputs.mutations }}
        # MUTATIONS is split into names on purpose (word splitting).
        run: crates/ruum-testkit/scripts/mutation_check.sh $MUTATIONS

  progress:
    name: security suites with RUUM_REQUIRE_IMPLEMENTED=1 (progress report)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - name: List the operations that are not implemented yet
        env:
          RUUM_REQUIRE_IMPLEMENTED: "1"
        run: cargo test -p ruum-testkit --no-fail-fast --test isolation --test permissions -- --nocapture

  e2e-staging:
    name: full end-to-end suite on staging
    runs-on: ubuntu-24.04
    steps:
      - name: Placeholder
        run: echo "::notice::No staging environment yet (design section 13). Add the full e2e run here."

  restore-test:
    name: restore test of the backups
    runs-on: ubuntu-24.04
    steps:
      - name: Placeholder
        run: echo "::notice::No backups yet (design section 5.2). Add the restore test here."
