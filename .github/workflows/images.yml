# Container images of Ruum (deploy/staging, plan 6.1, review 1 B-4 and S-7).
#
# - publish: only after a green `ci` run of a PUSH to main IN THIS REPOSITORY. A workflow_run
#   also fires for pull requests (from forks too, whose head branch can be called `main`), so
#   every condition below is required. The job checks out the exact commit that ci tested and
#   never runs code from a pull request. It pushes ghcr.io/nemecec/ruum-server, ruum-edge and
#   ruum-deploy-controller (backlog O-34) with the tags <full sha> and main, scans the pushed
#   digest, and only then adds the provenance attestation that deploy.sh, the deploy controller
#   and ops/deploy-chart.sh verify before a deploy (and k8s/apply.sh before it installs the
#   controller).
# - build-check: on branches and pull requests that change the images, build without pushing,
#   with a read-only token.
name: images

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  push:
    branches-ignore: [main]
    paths: [deploy/images/**, .github/workflows/images.yml, .dockerignore, web/package-lock.json, Cargo.lock,
      deploy/staging/charts/ruum/**, deploy/staging/ops/**, deploy/staging/setup.sh, deploy/staging/versions.env]
  pull_request:
    paths: [deploy/images/**, .github/workflows/images.yml, .dockerignore,
      deploy/staging/charts/ruum/**, deploy/staging/ops/**, deploy/staging/setup.sh, deploy/staging/versions.env]

permissions: {}

concurrency:
  group: images-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: false

jobs:
  build-check:
    name: build ${{ matrix.image }} (no push)
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: [ruum-server, ruum-edge, ruum-deploy-controller]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/images/${{ matrix.image }}.Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: local/${{ matrix.image }}:check
          cache-from: type=gha,scope=${{ matrix.image }}
      - name: Scan the image (vulnerabilities and secrets in the layers)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/${{ matrix.image }}:check
          scanners: vuln,secret
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  publish:
    name: publish ${{ matrix.image }}
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.repository == 'nemecec/ruum-server'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      # Only for the provenance attestation (actions/attest-build-provenance), which deploy.sh checks.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        image: [ruum-server, ruum-edge, ruum-deploy-controller]
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
      IMAGE: ghcr.io/nemecec/${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/images/${{ matrix.image }}.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.SHA }}
            ${{ env.IMAGE }}:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SHA }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      # Code review F-10: scan the pushed digest itself, so the scanned image and the deployed
      # image are the same. The attestation comes only after a clean scan, and deploy.sh and
      # ops/deploy-chart.sh refuse a digest without it.
      - name: Scan the pushed digest (vulnerabilities and secrets in the layers)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          scanners: vuln,secret
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Provenance attestation (deploy.sh verifies it)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Digest
        run: echo "${IMAGE}@${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
