# The CI gates of docs/DESIGN.md, section 18.5. Nothing merges red.
# Every job is a required check on main (set it in the branch protection rules).
name: ci

on:
  pull_request:
  # Every branch: agents push their work branches so the full suites run here in parallel.
  push:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_TOOLCHAIN: "1.99"

jobs:
  rust-lint:
    name: rust fmt and clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  rust-test:
    name: unit tests and migrations
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ruum
          POSTGRES_PASSWORD: ruum
          POSTGRES_DB: ruum
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ruum" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://ruum:ruum@localhost:5432/ruum
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli
      # The migration check: all migrations apply to an empty database, and a second run is a no-op.
      - name: Apply migrations
        run: |
          sqlx migrate run --source migrations
          sqlx migrate run --source migrations
          sqlx migrate info --source migrations
      # The superuser of the service container bypasses row-level security, so tests that check
      # RLS would fail. The tests connect as a role without superuser, as on the laptop stack:
      # CREATEDB for the per-test databases, and CREATE on the main database for the schema in which
      # sqlx keeps its list of test databases.
      - name: Role for the tests
        run: |
          psql "postgres://ruum:ruum@localhost:5432/ruum" -c "create role ruum_test login password 'ruum_test' createdb"
          psql "postgres://ruum:ruum@localhost:5432/ruum" -c "grant create on database ruum to ruum_test"
      # The data cluster of step 2 (STEP2 "Infrastructure work" 1, 2 and 7; card E-2): the image of
      # deploy/dev/postgres-data with its init script, on 127.0.0.1:5435 as on the laptop. It is
      # built here (a service container cannot be built). The Postgres engine tests of
      # ruum-dbengine run against it; in CI they fail, never skip, when it is missing. pg_hba.conf
      # allows the docker gateway (the runner's connections through the published port).
      - name: Start the data cluster (postgres-data)
        run: |
          docker build -t ruum-dev/postgres-data:17 deploy/dev/postgres-data
          docker run -d --name postgres-data -p 127.0.0.1:5435:5432 --shm-size 256m \
            -e POSTGRES_PASSWORD=ci-data-superuser -e RUUM_DBHOST_PASSWORD=ci-dbhost \
            ruum-dev/postgres-data:17
          for _ in $(seq 1 90); do
            docker exec postgres-data pg_isready -q -h 127.0.0.1 -U postgres -d postgres && break
            sleep 1
          done
          docker exec postgres-data pg_isready -h 127.0.0.1 -U postgres -d postgres
          docker logs postgres-data 2>&1 | grep 'ruum-data'
      # pg_dump must be a PostgreSQL 17 client for the 17 server (the engine's export,
      # RUUM_PG_DUMP); the runner has 16. The client comes from the PGDG repository.
      - name: PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version
      # The isolation checks of the data cluster (card I-1; review-I-1 finding 2): sessions that
      # log in as the per-database roles cannot reach another role or database.
      - name: Data cluster checks (scripts/dbhost_check.sh)
        env:
          RUUM_DBHOST_URL: postgres://ruum_dbhost:ci-dbhost@127.0.0.1:5435/postgres
          DBHOST_CHECK_CONTAINER: postgres-data
        run: scripts/dbhost_check.sh
      # Unit and conformance tests. `#[sqlx::test]` tests use DATABASE_URL (one database per test).
      # RUUM_DBHOST_URL: the Postgres engine (ruum-dbengine) and its conformance suite.
      - name: Unit and conformance tests
        env:
          DATABASE_URL: postgres://ruum_test:ruum_test@localhost:5432/ruum
          RUUM_DBHOST_URL: postgres://ruum_dbhost:ci-dbhost@127.0.0.1:5435/postgres
          RUUM_PG_DUMP: /usr/lib/postgresql/17/bin/pg_dump
        run: |
          cargo test --workspace --exclude ruum-testkit --locked
          cargo test -p ruum-testkit --lib --test contract --test databases_meta --locked

  security-suites:
    name: tenant isolation and permission suites
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ruum
          POSTGRES_PASSWORD: ruum
          POSTGRES_DB: ruum
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ruum" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Step 1 is complete, so a handler that answers 501 (pending) is a failure. A later step can
      # set the repository variable RUUM_REQUIRE_IMPLEMENTED=0 while it adds new operations.
      RUUM_REQUIRE_IMPLEMENTED: ${{ vars.RUUM_REQUIRE_IMPLEMENTED || '1' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - name: Tenant isolation and permission matrix (in-memory services)
        run: cargo test -p ruum-testkit --no-fail-fast --test isolation --test permissions --test databases_d1 --test databases_guests --test databases_agents --test databases_nodes --test databases_statements --test databases_classes_api --test databases_grants_api --test databases_approvals_api --test databases_query_api --test apps_settings --test apps_deployments --test apps_publish --test apps_roles --test apps_meta --test privacy --locked -- --nocapture
      # The data cluster (as in the unit job): the privacy suite runs its Postgres cases on the
      # Postgres engine (card Q-2); without it they fail in CI, never skip.
      - name: Start the data cluster (postgres-data)
        run: |
          docker build -t ruum-dev/postgres-data:17 deploy/dev/postgres-data
          docker run -d --name postgres-data -p 127.0.0.1:5435:5432 --shm-size 256m \
            -e POSTGRES_PASSWORD=ci-data-superuser -e RUUM_DBHOST_PASSWORD=ci-dbhost \
            ruum-dev/postgres-data:17
          for _ in $(seq 1 90); do
            docker exec postgres-data pg_isready -q -h 127.0.0.1 -U postgres -d postgres && break
            sleep 1
          done
          docker exec postgres-data pg_isready -h 127.0.0.1 -U postgres -d postgres
      # The superuser of the service container bypasses row-level security. The suites connect
      # as a role without superuser (CREATEDB for the suite databases), as on the laptop stack.
      - name: Role for the suites
        run: psql "postgres://ruum:ruum@localhost:5432/ruum" -c "create role ruum_suite login password 'ruum_suite' createdb"
      - name: Tenant isolation and permission matrix (Postgres stores)
        env:
          RUUM_SUITE_BACKEND: postgres
          DATABASE_URL: postgres://ruum_suite:ruum_suite@localhost:5432/ruum
          RUUM_DBHOST_URL: postgres://ruum_dbhost:ci-dbhost@127.0.0.1:5435/postgres
        run: cargo test -p ruum-testkit --no-fail-fast --test isolation --test permissions --test databases_d1 --test databases_guests --test databases_agents --test databases_nodes --test databases_statements --test databases_classes_api --test databases_grants_api --test databases_approvals_api --test databases_query_api --test apps_settings --test apps_deployments --test apps_publish --test apps_roles --test apps_meta --test privacy --locked -- --nocapture

  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  contracts:
    name: contract lint and breaking-change diff
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Lint the OpenAPI contract
        run: npx --yes @redocly/cli@1.34.5 lint --config contracts/redocly.yaml contracts/openapi.yaml
      - name: Validate the SpiceDB schema and its assertions
        run: docker run --rm -v "$PWD/contracts/authz:/schema:ro" -w /schema authzed/zed:v1.2.1 validate schema.test.yaml
      # A breaking change of the API needs a contract pull request that a person approves
      # (design section 18.1). Such a pull request carries the label `contract-change`.
      - name: Breaking changes against the base branch
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'contract-change')
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          mkdir -p /tmp/oasdiff
          if ! git show "origin/$BASE_REF:contracts/openapi.yaml" > /tmp/oasdiff/base.yaml 2>/dev/null; then
            echo "The base branch has no contracts/openapi.yaml; nothing to compare."
            exit 0
          fi
          cp contracts/openapi.yaml /tmp/oasdiff/head.yaml
          docker run --rm -v /tmp/oasdiff:/w:ro -w /w tufin/oasdiff:v1.11.4 \
            breaking base.yaml head.yaml --fail-on ERR

  web:
    name: web build and generated client
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # The API client is generated from contracts/openapi.yaml and must be committed up to date.
      - name: Generated API client is up to date
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts || {
            echo "::error::web/src/api/schema.d.ts is out of date. Run 'npm run gen:api' in web/ and commit it."
            exit 1
          }
      - run: npm run lint
      - run: npm run build

  e2e:
    name: end-to-end against the Compose stack
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # Placeholder until the e2e suite exists (design 12.2). The laptop stack
      # (deploy/dev/docker-compose.yml, scripts/dev.sh) exists; the suite goes in tests/e2e.
      - name: End-to-end tests
        run: |
          if [ -d tests/e2e ]; then
            echo "::error::tests/e2e exists: replace this placeholder with 'scripts/dev.sh up', seed and the e2e suite."
            exit 1
          fi
          echo "::notice::No e2e suite yet; the end-to-end gate is a placeholder."

  e2e-browser:
    name: browser end-to-end (Playwright, Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The laptop stack: Postgres, Garage, Zitadel, SpiceDB, Mailpit, ... (deploy/dev), with the
      # mock OIDC provider that web/e2e/sso.e2e.ts signs in through. CI has no Google or Microsoft
      # keys, so dev.sh adds only the mock provider to Zitadel.
      - name: Start the stack
        run: scripts/dev.sh up --sso-mock
      - name: Web dependencies and Chromium
        working-directory: web
        run: |
          npm ci
          # On 2026-11-11 the runners could not resolve the Ubuntu apt mirrors for hours, so
          # --with-deps failed. The runner image already has Google Chrome and its libraries;
          # then Chromium is installed without the apt packages, and the tests show if it runs.
          if ! timeout 600 npx playwright install --with-deps chromium; then
            echo "::warning::apt packages for Playwright could not be installed; using the runner image's libraries"
            npx playwright install chromium
          fi
      # Builds the server, seeds, starts the server (8492) and Vite (5182), runs web/e2e, stops both.
      - name: Browser end-to-end tests
        env:
          # The work folder (report, traces, logs) goes here, for the artifact below.
          TMPDIR: ${{ runner.temp }}
          # The sign-in test through the mock provider must run, not skip.
          RUUM_E2E_SSO_MOCK: required
        run: scripts/e2e_browser.sh
      - name: Keep the report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-browser-report
          path: ${{ runner.temp }}/ruum-e2e-browser.*
          if-no-files-found: ignore
      - name: Stack logs
        if: failure()
        run: docker compose -f deploy/dev/docker-compose.yml --env-file deploy/dev/.env logs --tail=200

  staging:
    name: staging as code (guards, charts, OpenTofu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # Pinned and checksummed tools (deploy/staging/versions.env); nothing cloud is touched and no
      # secret is used: check-plan, price, the secret lists, helm lint/template, caddy adapt,
      # tofu fmt and validate, talosctl validate of the rendered machine configs
      # (deploy/staging/tests/run.sh).
      - name: Tools
        run: deploy/staging/setup.sh tofu talosctl helm
      - name: Shellcheck
        run: shellcheck -x -S warning deploy/staging/*.sh deploy/staging/ops/*.sh deploy/staging/k8s/*.sh deploy/staging/tests/*.sh
      - name: Staging tests
        run: deploy/staging/tests/run.sh
