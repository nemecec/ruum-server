# The CI gates of docs/DESIGN.md, section 18.5. Nothing merges red.
# Every job is a required check on main (set it in the branch protection rules).
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_TOOLCHAIN: "1.99"

jobs:
  rust-lint:
    name: rust fmt and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  rust-test:
    name: unit tests and migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ruum
          POSTGRES_PASSWORD: ruum
          POSTGRES_DB: ruum
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ruum" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://ruum:ruum@localhost:5432/ruum
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli
      # The migration check: all migrations apply to an empty database, and a second run is a no-op.
      - name: Apply migrations
        run: |
          sqlx migrate run --source migrations
          sqlx migrate run --source migrations
          sqlx migrate info --source migrations
      # Unit and conformance tests. `#[sqlx::test]` tests use DATABASE_URL (one database per test).
      - name: Unit and conformance tests
        run: |
          cargo test --workspace --exclude ruum-testkit --locked
          cargo test -p ruum-testkit --lib --test contract --locked

  security-suites:
    name: tenant isolation and permission suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      # A handler that answers 501 counts as pending. Set the repository variable
      # RUUM_REQUIRE_IMPLEMENTED=1 when step 1 is complete, so pending becomes a failure.
      - name: Tenant isolation and permission matrix
        env:
          RUUM_REQUIRE_IMPLEMENTED: ${{ vars.RUUM_REQUIRE_IMPLEMENTED || '0' }}
        run: cargo test -p ruum-testkit --no-fail-fast --test isolation --test permissions --locked -- --nocapture

  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  contracts:
    name: contract lint and breaking-change diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Lint the OpenAPI contract
        run: npx --yes @redocly/cli@1.34.5 lint --config contracts/redocly.yaml contracts/openapi.yaml
      - name: Validate the SpiceDB schema and its assertions
        run: docker run --rm -v "$PWD/contracts/authz:/schema:ro" -w /schema authzed/zed:v1.2.1 validate schema.test.yaml
      # A breaking change of the API needs a contract pull request that a person approves
      # (design section 18.1). Such a pull request carries the label `contract-change`.
      - name: Breaking changes against the base branch
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'contract-change')
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          mkdir -p /tmp/oasdiff
          if ! git show "origin/$BASE_REF:contracts/openapi.yaml" > /tmp/oasdiff/base.yaml 2>/dev/null; then
            echo "The base branch has no contracts/openapi.yaml; nothing to compare."
            exit 0
          fi
          cp contracts/openapi.yaml /tmp/oasdiff/head.yaml
          docker run --rm -v /tmp/oasdiff:/w:ro -w /w tufin/oasdiff:v1.11.4 \
            breaking base.yaml head.yaml --fail-on ERR

  web:
    name: web build and generated client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # The API client is generated from contracts/openapi.yaml and must be committed up to date.
      - name: Generated API client is up to date
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts || {
            echo "::error::web/src/api/schema.d.ts is out of date. Run 'npm run gen:api' in web/ and commit it."
            exit 1
          }
      - run: npm run lint
      - run: npm run build

  e2e:
    name: end-to-end against the Compose stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Placeholder until the e2e suite exists (design 12.2). The laptop stack
      # (deploy/dev/docker-compose.yml, scripts/dev.sh) exists; the suite goes in tests/e2e.
      - name: End-to-end tests
        run: |
          if [ -d tests/e2e ]; then
            echo "::error::tests/e2e exists: replace this placeholder with 'scripts/dev.sh up', seed and the e2e suite."
            exit 1
          fi
          echo "::notice::No e2e suite yet; the end-to-end gate is a placeholder."
