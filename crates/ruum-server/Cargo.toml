[package]
name = "ruum-server"
description = "The Ruum core service binary. Reads config from the environment and wires the modules."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "ruum-server"
path = "src/main.rs"

[dependencies]
ruum-core.workspace = true
ruum-api.workspace = true
ruum-mcp.workspace = true
ruum-webdav.workspace = true
# The Kubernetes runtime driver of the sandboxes (backlog I6-1), with RUUM_RUNTIME_DRIVER=kubernetes.
ruum-runtime.workspace = true
anyhow.workspace = true
axum.workspace = true
sqlx.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# The telemetry role (card O-1b): the OTLP receiver over gRPC (tonic) and HTTP/protobuf.
opentelemetry-proto.workspace = true
prost.workspace = true
tonic.workspace = true
tokio-stream = { workspace = true, features = ["net"] }
# The receiver reads bodies frame by frame and holds their bytes in the budget (O-1b review).
bytes.workspace = true
futures.workspace = true
http-body-util.workspace = true
# The drop reasons' snake_case names in OTLP partial-success messages.
serde_json.workspace = true
# The supervisor listener's own connections (Kimi re-check of I6-20 in run 16, defect 4):
# hyper's HTTP/1 connections with a header read timeout, as `ruum-runtime-api` serves its API.
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util = { workspace = true, features = ["tokio", "service"] }
tower.workspace = true
# The seal ledger of the Kubernetes driver in the platform database (backlog I620-9).
async-trait.workspace = true
# TLS 1.3 on the supervisor listener with the key derived from the record key (backlog I620-2).
tokio-rustls.workspace = true

[dev-dependencies]
# The telemetry receiver tests (card O-1b): HTTP clients from a chosen loopback address.
reqwest.workspace = true
# `#[sqlx::test]` (one database per test) needs the `macros` feature. No `query!` macros are used.
sqlx = { workspace = true, features = ["macros"] }
serde_json.workspace = true
# Deployment IDs in the static bucket test (decision 0008-4).
uuid.workspace = true
# The supervisor's own TLS client against the listener (backlog I620-2).
ruum-supervisor.workspace = true
