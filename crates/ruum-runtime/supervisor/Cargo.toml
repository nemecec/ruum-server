[package]
name = "ruum-supervisor"
description = "The sandbox supervisor (backlog I6-20, S-89): the first process of every app sandbox. It fetches the run's secret values over a per-run channel, starts the app, and redacts its output before the container runtime sees it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# A static binary for `*-unknown-linux-musl` (docs/STEP3.md "The sandbox supervisor"): std, `nix`
# (safe wrappers of prctl, setrlimit, waitpid, kill and sigwait) and the redactor of ruum-core,
# compiled from its own file (src/lib.rs). No async runtime. TLS 1.3 to the launch listener with
# a pinned certificate (backlog I620-2): rustls with the aws-lc-rs provider (the workspace's one,
# so no second provider joins the tree's rustls; its primitives are the binary's only C and
# assembly code), sha2 for the pin.
[dependencies]
nix.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
rustls = { workspace = true, features = ["aws_lc_rs"] }
sha2.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "ruum-supervisor"
path = "src/main.rs"
